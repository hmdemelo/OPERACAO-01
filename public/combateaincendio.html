/* ===== src/estilo.css ===== */
/* ==========================================================================
   OPERAÇÃO 01 — COMBATE A INCÊNDIO · CENTRO DE TREINAMENTO OPERACIONAL
   src/estilo.css
   --------------------------------------------------------------------------
   Direção de arte: noite operacional. Azul-profundo de madrugada cortado por
   brasa laranja; aço escovado; rótulos em dourado com entreletra ampla;
   névoa volumétrica e bloom quente. Vidro fosco nos painéis (glassmorphism).
   --------------------------------------------------------------------------
   SUMÁRIO
    1. Tokens            6. HUD                11. Códex
    2. Reset e base      7. Hub / missões      12. Estatísticas
    3. Tipografia        8. Briefing           13. Caderno de erros
    4. Componentes       9. Mecânicas          14. Efeitos e partículas
    5. Botões           10. Questões           15. Responsividade
   ========================================================================== */

/* ============================== 1. TOKENS ============================== */
:root{
  /* noite */
  --n0:#050a12; --n1:#070d16; --n2:#0b1522; --n3:#101d2b; --n4:#16283c; --n5:#1e3b58;
  --painel:#0e1a27; --painel2:#132437; --painel3:#1a2f45;
  --linha1:#1f3247; --linha2:#2b4763; --linha3:#3c5f80;
  /* brasa */
  --br1:#fff6d5; --br2:#ffd166; --br3:#ff9430; --br4:#ff6b1a; --br5:#e03a12; --br6:#8f1f0a;
  /* aço */
  --ac1:#e8eef5; --ac2:#c2ccd6; --ac3:#8b98a6; --ac4:#5a6675; --ac5:#39434f;
  /* semântica */
  --ok:#3fd189; --ok-bg:rgba(63,209,137,.11); --ok-ln:rgba(63,209,137,.4);
  --er:#ff5a63; --er-bg:rgba(255,90,99,.11); --er-ln:rgba(255,90,99,.4);
  --inf:#4aa3ff; --inf-bg:rgba(74,163,255,.11);
  --av:#ffb020; --av-bg:rgba(255,176,32,.11);
  /* forma */
  --r1:18px; --r2:13px; --r3:9px; --r4:6px;
  --ff:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --fm:ui-monospace,'Cascadia Mono',Consolas,'SF Mono','Roboto Mono',monospace;
  --sh1:0 18px 48px rgba(0,0,0,.62);
  --sh2:0 8px 22px rgba(0,0,0,.5);
  --sh-br:0 0 34px rgba(255,107,26,.28);
  --hud:62px;
  --ease:cubic-bezier(.22,.72,.28,1);
}

/* =========================== 2. RESET E BASE =========================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--ff); color:var(--ac2); background:var(--n0);
  min-height:100dvh; overflow-x:hidden; line-height:1.6;
}
/* Céu operacional + névoa volumétrica.
   Camada fixa em vez de background-attachment:fixed — este é ignorado ou
   causa travamento de rolagem no iOS/Android e quebra a composição em
   navegadores headless. */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1400px 720px at 50% -18%, #1a3150 0%, transparent 58%),
    radial-gradient(900px 500px at 88% 8%, rgba(255,107,26,.12) 0%, transparent 62%),
    radial-gradient(700px 460px at 6% 78%, rgba(74,163,255,.07) 0%, transparent 60%),
    linear-gradient(180deg,#070d16,#04070c);
}
/* respiração lenta da névoa, como brasa distante */
#nevoa{
  position:fixed;inset:-12%;pointer-events:none;z-index:0;opacity:.5;
  background:
    radial-gradient(50% 40% at 20% 30%, rgba(120,140,170,.055), transparent 70%),
    radial-gradient(46% 36% at 74% 62%, rgba(255,148,48,.05), transparent 70%);
  animation:nevoa 34s ease-in-out infinite alternate;
}
@keyframes nevoa{to{transform:translate3d(3%,-2%,0) scale(1.1)}}
/* varredura fina */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;
  background-image:repeating-linear-gradient(0deg,#9fd8ff 0 1px,transparent 1px 3px);
}
#app{position:relative;z-index:2;min-height:100dvh}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
::selection{background:rgba(255,107,26,.32);color:var(--ac1)}
:focus-visible{outline:2px solid var(--br3);outline-offset:3px;border-radius:var(--r4)}

/* ============================ 3. TIPOGRAFIA ============================ */
h1,h2,h3,h4{margin:0;color:var(--ac1);font-weight:800;line-height:1.12}
h1{font-size:clamp(26px,6.6vw,46px);text-transform:uppercase;letter-spacing:3px}
h2{font-size:clamp(19px,4.6vw,29px);text-transform:uppercase;letter-spacing:1.6px}
h3{font-size:clamp(15px,3.6vw,20px);letter-spacing:.8px}
h4{font-size:clamp(12px,3vw,14px);letter-spacing:1.4px;text-transform:uppercase;color:var(--ac2)}
p{margin:0 0 12px;font-size:clamp(13.6px,3.3vw,15.4px)}
p:last-child{margin-bottom:0}
b,strong{color:var(--ac1);font-weight:700}
em{color:var(--br2);font-style:normal;font-weight:600}
/* rótulo dourado de HUD — assinatura visual do jogo */
.kick{font-family:var(--fm);font-size:10.5px;letter-spacing:3.4px;text-transform:uppercase;
  color:var(--br2);font-weight:700;display:block;margin-bottom:6px;opacity:.95}
.kick.laranja{color:var(--br4)} .kick.aco{color:var(--ac4)} .kick.info{color:var(--inf)}
.kick::after{content:'';display:block;width:26px;height:1px;background:currentColor;
  margin-top:5px;opacity:.55}
.kick.sl::after{display:none}
.muted{color:var(--ac4)}
.small{font-size:12.6px;line-height:1.62}
.tiny{font-family:var(--fm);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
  font-weight:700;color:var(--ac4)}
.mono{font-family:var(--fm)}
.nowrap{white-space:nowrap}

/* =========================== 4. COMPONENTES =========================== */
.painel{
  background:linear-gradient(160deg,rgba(20,36,54,.82),rgba(9,17,27,.9));
  border:1px solid var(--linha1); border-radius:var(--r1);
  box-shadow:var(--sh2), inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
  padding:20px; position:relative; overflow:hidden;
}
.painel::before{
  content:'';position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,209,102,.4),transparent);
}
.painel.quente{border-color:rgba(255,107,26,.3);box-shadow:var(--sh2),var(--sh-br)}
.painel.compacto{padding:14px}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g-auto{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.flex{display:flex;gap:12px;align-items:center} .flex.top{align-items:flex-start}
.entre{justify-content:space-between} .centro{justify-content:center}
.col{flex-direction:column;align-items:stretch} .wr{flex-wrap:wrap}
.crescer{flex:1}
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--linha2),transparent);
  margin:18px 0;border:0}

.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10.5px;
  letter-spacing:1.4px;text-transform:uppercase;font-weight:700;padding:5px 10px;
  border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--linha2);
  color:var(--ac3)}
.tag.ok{color:var(--ok);border-color:var(--ok-ln);background:var(--ok-bg)}
.tag.er{color:var(--er);border-color:var(--er-ln);background:var(--er-bg)}
.tag.av{color:var(--av);border-color:rgba(255,176,32,.4);background:var(--av-bg)}
.tag.inf{color:var(--inf);border-color:rgba(74,163,255,.4);background:var(--inf-bg)}
.tag.br{color:var(--br3);border-color:rgba(255,107,26,.42);background:rgba(255,107,26,.1)}

.caixa{border-radius:var(--r2);padding:13px 15px;border-left:3px solid;
  background:rgba(255,255,255,.03);margin:12px 0}
.caixa h4{margin-bottom:5px;letter-spacing:1.6px}
.caixa.ouro{border-color:var(--ok);background:var(--ok-bg)} .caixa.ouro h4{color:var(--ok)}
.caixa.armadilha{border-color:var(--er);background:var(--er-bg)} .caixa.armadilha h4{color:var(--er)}
.caixa.macete{border-color:var(--av);background:var(--av-bg)} .caixa.macete h4{color:var(--av)}
.caixa.tecnica{border-color:var(--inf);background:var(--inf-bg)} .caixa.tecnica h4{color:var(--inf)}

.barra{height:9px;border-radius:999px;background:rgba(0,0,0,.45);overflow:hidden;
  border:1px solid var(--linha1);position:relative}
.barra > i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--br5),var(--br3),var(--br2));
  box-shadow:0 0 14px rgba(255,148,48,.5);transition:width .7s var(--ease)}
.barra.fina{height:6px} .barra.azul > i{background:linear-gradient(90deg,#2f6fbe,#5aa8f0,#bfe3ff);
  box-shadow:0 0 14px rgba(90,168,240,.45)}
.barra.verde > i{background:linear-gradient(90deg,#1d8a58,var(--ok));box-shadow:0 0 14px rgba(63,209,137,.4)}

.ic{width:1em;height:1em;vertical-align:-.14em;display:inline-block}
.art{width:100%;height:auto;display:block}

/* ============================== 5. BOTÕES ============================== */
.btn{
  --bg1:rgba(255,255,255,.06); --bg2:rgba(255,255,255,.02);
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--ff);font-size:13.6px;font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--ac1);cursor:pointer;
  padding:13px 22px;border-radius:var(--r2);border:1px solid var(--linha2);
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  transition:transform .16s var(--ease),box-shadow .22s,border-color .22s,background .22s;
  position:relative;overflow:hidden;user-select:none;
}
.btn::after{content:'';position:absolute;inset:0;background:
  linear-gradient(120deg,transparent 30%,rgba(255,255,255,.13) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .6s var(--ease)}
.btn:hover{border-color:var(--linha3);transform:translateY(-2px);box-shadow:var(--sh2)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(0) scale(.985)}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn.primario{--bg1:var(--br4);--bg2:var(--br5);border-color:rgba(255,148,48,.55);
  color:#150802;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.btn.primario:hover{box-shadow:0 10px 30px rgba(255,107,26,.42)}
.btn.certo{--bg1:rgba(63,209,137,.2);--bg2:rgba(63,209,137,.08);border-color:var(--ok-ln);color:var(--ok)}
.btn.errado{--bg1:rgba(255,90,99,.2);--bg2:rgba(255,90,99,.08);border-color:var(--er-ln);color:var(--er)}
.btn.fantasma{border-color:transparent;background:transparent;color:var(--ac3);padding:9px 12px}
.btn.fantasma:hover{color:var(--ac1);background:rgba(255,255,255,.05)}
.btn.pequeno{padding:9px 14px;font-size:11.6px}
.btn.bloco{width:100%}
.btn.grande{padding:17px 30px;font-size:15px;letter-spacing:1.6px}

/* ================================ 6. HUD =============================== */
#hud{position:sticky;top:0;z-index:60;height:var(--hud);
  background:linear-gradient(180deg,rgba(7,13,22,.96),rgba(7,13,22,.78));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--linha1);
  padding-top:env(safe-area-inset-top)}
#hud .in{max-width:1180px;margin:0 auto;height:var(--hud);padding:0 14px;
  display:flex;align-items:center;gap:14px}
.hud-marca{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.hud-marca svg{width:34px;height:34px}
.hud-marca b{font-family:var(--fm);font-size:12.5px;letter-spacing:2.6px;color:var(--ac1)}
.hud-marca span{display:block;font-family:var(--fm);font-size:8.6px;letter-spacing:2.2px;color:var(--br4)}
.hud-stats{display:flex;gap:16px;margin-left:auto;align-items:center}
.hud-st{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:12.4px;
  color:var(--ac2);font-weight:700}
.hud-st .ic{color:var(--br3);font-size:15px}
.hud-st.streak .ic{color:var(--br4)} .hud-st.xp .ic{color:var(--br2)}
.hud-patente{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;
  border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--linha2)}
.hud-patente svg{width:26px;height:30px}
.hud-patente .pt-n{font-family:var(--fm);font-size:10.4px;letter-spacing:1.2px;color:var(--ac1);font-weight:700}
.hud-patente .pt-b{width:64px;height:4px;margin-top:3px}

/* ============================ 7. HUB / MISSÕES ========================= */
.hero{position:relative;border-radius:var(--r1);overflow:hidden;margin:18px 0 22px;
  border:1px solid var(--linha1);box-shadow:var(--sh1)}
.hero .cena{width:100%;height:clamp(210px,34vw,330px);display:block}
.hero-txt{position:absolute;inset:auto 0 0;padding:24px 22px;
  background:linear-gradient(0deg,rgba(5,10,18,.94) 12%,rgba(5,10,18,.55) 55%,transparent)}
.hero-txt h1{margin-bottom:6px;text-shadow:0 3px 22px rgba(0,0,0,.85)}
.hero-txt p{max-width:640px;color:var(--ac2);text-shadow:0 2px 12px rgba(0,0,0,.8)}
.cena-vinheta{box-shadow:inset 0 0 120px 32px rgba(4,8,14,.88)}

.trilha{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.missao{
  position:relative;border-radius:var(--r2);overflow:hidden;cursor:pointer;
  border:1px solid var(--linha1);background:var(--painel);
  transition:transform .2s var(--ease),box-shadow .25s,border-color .25s;
  box-shadow:var(--sh2)
}
.missao:hover{transform:translateY(-4px);border-color:rgba(255,148,48,.45);
  box-shadow:0 16px 40px rgba(0,0,0,.6),var(--sh-br)}
.missao .capa{height:132px;position:relative;overflow:hidden}
.missao .capa svg{width:100%;height:100%;display:block}
.missao .capa::after{content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(9,17,27,.96),rgba(9,17,27,.15) 62%,transparent)}
.missao .corpo{padding:14px 15px 16px;position:relative}
.missao h3{margin-bottom:5px;font-size:16.4px}
.missao .desc{font-size:13.4px;color:var(--ac3);line-height:1.54;min-height:40px}
.missao .rodape{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.missao .num{position:absolute;top:-24px;right:14px;font-family:var(--fm);font-size:36px;
  font-weight:800;color:rgba(255,209,102,.16);letter-spacing:-2px}
.missao.bloqueada{opacity:.5;cursor:not-allowed}
.missao.bloqueada:hover{transform:none;border-color:var(--linha1);box-shadow:var(--sh2)}
.missao.concluida{border-color:rgba(63,209,137,.42)}
.missao .selo{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;
  border-radius:50%;display:grid;place-items:center;font-size:16px;
  background:rgba(6,12,20,.85);border:1px solid var(--linha2);backdrop-filter:blur(6px)}
.missao.concluida .selo{color:var(--ok);border-color:var(--ok-ln)}
.missao.bloqueada .selo{color:var(--ac4)}

/* faixa de eixos */
.eixos{display:flex;gap:9px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.eixos::-webkit-scrollbar{display:none}
.eixo-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:9px 15px;
  border-radius:999px;border:1px solid var(--linha1);background:rgba(255,255,255,.035);
  font-family:var(--fm);font-size:11.4px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--ac3);cursor:pointer;transition:.2s var(--ease);font-weight:700;white-space:nowrap}
.eixo-chip:hover{color:var(--ac1);border-color:var(--linha3)}
.eixo-chip.on{color:#150802;background:linear-gradient(180deg,var(--br3),var(--br4));
  border-color:transparent;box-shadow:0 6px 18px rgba(255,107,26,.34)}
.eixo-chip .pt{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ============================== 8. BRIEFING ============================ */
.briefing{position:relative;border-radius:var(--r1);overflow:hidden;border:1px solid var(--linha1)}
.briefing .cena{width:100%;height:clamp(170px,28vw,250px)}
.briefing .sobre{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:flex-end;padding:22px;
  background:linear-gradient(0deg,rgba(5,10,18,.95),rgba(5,10,18,.35) 60%,transparent)}
.objetivos{list-style:none;padding:0;margin:10px 0 0}
.objetivos li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;
  border-bottom:1px dashed var(--linha1);font-size:13.4px}
.objetivos li:last-child{border-bottom:0}
.objetivos li::before{content:'◈';color:var(--br3);font-size:11px;margin-top:3px}

/* ============================== 9. MECÂNICAS =========================== */
.palco{position:relative;border-radius:var(--r1);overflow:hidden;border:1px solid var(--linha1);
  box-shadow:var(--sh1);margin-bottom:16px}
.palco .cena{width:100%;height:clamp(150px,26vw,250px)}
/* etiqueta discreta sobre a cena — o texto da pergunta NÃO fica sobre a imagem,
   porque fundo em chamas destrói a legibilidade, sobretudo no celular */
.palco-tag{position:absolute;top:12px;left:12px;pointer-events:none;
  font-family:var(--fm);font-size:10px;letter-spacing:2.6px;text-transform:uppercase;
  font-weight:700;color:var(--br2);padding:6px 11px;border-radius:999px;
  background:rgba(5,10,18,.8);border:1px solid rgba(255,209,102,.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* bandeja de opções */
.bandeja{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.peca{
  position:relative;cursor:pointer;border-radius:var(--r2);padding:12px 10px 11px;
  border:1px solid var(--linha1);background:linear-gradient(170deg,rgba(24,42,62,.7),rgba(9,17,27,.85));
  text-align:center;transition:transform .18s var(--ease),border-color .2s,box-shadow .2s;
  user-select:none;
}
.peca:hover{transform:translateY(-3px);border-color:var(--linha3);box-shadow:var(--sh2)}
.peca svg{width:100%;max-width:96px;margin:0 auto 7px;height:auto}
.peca .nome{font-family:var(--fm);font-size:11px;letter-spacing:.9px;color:var(--ac2);
  text-transform:uppercase;font-weight:700;line-height:1.35}
.peca .sub{font-size:10px;color:var(--ac4);margin-top:2px}
.peca.sel{border-color:var(--br3);box-shadow:0 0 0 1px var(--br3),0 10px 28px rgba(255,107,26,.3)}
.peca.ok{border-color:var(--ok);background:linear-gradient(170deg,rgba(63,209,137,.16),rgba(9,17,27,.85))}
.peca.er{border-color:var(--er);background:linear-gradient(170deg,rgba(255,90,99,.16),rgba(9,17,27,.85));
  animation:tremor .38s}
.peca.usada{opacity:.3;pointer-events:none}
@keyframes tremor{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}
  46%{transform:translateX(6px)}70%{transform:translateX(-4px)}}

/* montagem EPI/EPR */
.montagem{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;align-items:start}
.boneco{position:relative;border-radius:var(--r2);border:1px solid var(--linha1);
  background:radial-gradient(60% 50% at 50% 30%,rgba(255,148,48,.09),transparent 70%),rgba(6,12,20,.6);
  padding:14px}
.boneco .art-combatente{max-height:400px}
.slot{transition:fill .3s,stroke .3s}
.slot-on{animation:encaixe .45s var(--ease)}
@keyframes encaixe{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.checklist li{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r3);
  border:1px solid var(--linha1);background:rgba(255,255,255,.025);font-size:12.6px}
.checklist li.feito{border-color:var(--ok-ln);background:var(--ok-bg);color:var(--ok)}
.checklist li .n{font-family:var(--fm);font-size:10px;width:19px;height:19px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--ac3);flex-shrink:0}
.checklist li.feito .n{background:var(--ok);color:#04140c}

/* ordenação */
.ordem{display:grid;gap:8px}
.ordem-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r3);
  border:1px solid var(--linha1);background:rgba(255,255,255,.03);cursor:grab;font-size:13px}
.ordem-item.arrastando{opacity:.45;border-color:var(--br3)}
.ordem-item .mao{color:var(--ac4);font-size:15px;cursor:grab}
.ordem-item .setas{margin-left:auto;display:flex;gap:4px}
.ordem-item .setas button{width:27px;height:27px;border-radius:var(--r4);border:1px solid var(--linha2);
  background:rgba(255,255,255,.05);color:var(--ac2);cursor:pointer;font-size:11px;line-height:1}
.ordem-item .setas button:hover{border-color:var(--br3);color:var(--br2)}

/* ============================== 10. QUESTÕES =========================== */
.questao{animation:entra .38s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.q-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
/* ---- ENUNCIADO -------------------------------------------------------
   Elemento mais importante da tela: precisa ser a primeira coisa que o
   olho encontra. Fonte grande, contraste alto, marcador lateral em brasa
   e um cabeçalho que numera a questão. Vale para o quiz (.q-enun) e para
   as mecânicas de bandeja (.pergunta). ------------------------------- */
.q-enun,.pergunta{
  font-size:clamp(16.5px,4.4vw,19.5px);line-height:1.68;color:#f2f7fc;font-weight:500;
  padding:18px 20px;border-radius:var(--r2);border:1px solid var(--linha2);
  background:linear-gradient(160deg,rgba(28,48,70,.72),rgba(9,17,27,.86));
  border-left:5px solid var(--br4);
  box-shadow:0 10px 28px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.055)}
.pergunta{margin-top:12px}
.pergunta .kick{margin-bottom:8px}
.pergunta p{margin:0;font-size:inherit;line-height:inherit;color:inherit}
/* etiqueta “QUESTÃO 03 / 14” acima do enunciado */
.q-num{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);
  font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;
  color:var(--br2);margin-bottom:9px}
.q-num b{color:var(--ac1);font-size:15px;letter-spacing:1px}
.q-num i{font-style:normal;color:var(--ac4)}

.q-alts{display:grid;gap:10px;margin-top:16px}
.alt{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:var(--r2);
  border:1px solid var(--linha1);background:rgba(255,255,255,.035);cursor:pointer;
  transition:.18s var(--ease);font-size:clamp(14.6px,3.9vw,16px);line-height:1.55;
  text-align:left;width:100%;font-family:inherit;color:var(--ac1)}
.alt:hover{border-color:var(--linha3);background:rgba(255,255,255,.055);transform:translateX(3px)}
.alt .letra{font-family:var(--fm);font-weight:700;font-size:12px;width:25px;height:25px;
  border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);
  color:var(--ac3);flex-shrink:0;margin-top:-1px}
.alt.certa{border-color:var(--ok);background:var(--ok-bg);color:var(--ac1)}
.alt.certa .letra{background:var(--ok);color:#04140c}
.alt.errada{border-color:var(--er);background:var(--er-bg)}
.alt.errada .letra{background:var(--er);color:#1c0206}
.alt.neutra{opacity:.52}
.alt[disabled]{cursor:default;transform:none}
.ce-par{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.ce-btn{padding:19px 14px;font-size:15px;letter-spacing:2px}

/* gabarito comentado */
.gabarito{margin-top:16px;animation:entra .4s var(--ease)}
.gab-cab{display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:var(--r2) var(--r2) 0 0;
  border:1px solid;font-family:var(--fm);letter-spacing:1.6px;text-transform:uppercase;
  font-size:12.4px;font-weight:700}
.gab-cab.ok{color:var(--ok);border-color:var(--ok-ln);background:var(--ok-bg)}
.gab-cab.er{color:var(--er);border-color:var(--er-ln);background:var(--er-bg)}
.gab-corpo{border:1px solid var(--linha1);border-top:0;border-radius:0 0 var(--r2) var(--r2);
  padding:16px 18px;background:rgba(9,17,27,.6)}
.gab-corpo .caixa:first-child{margin-top:0}

/* ============================== 11. CÓDEX ============================== */
.codex-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.codex-nav::-webkit-scrollbar{display:none}
.ficha{border-radius:var(--r2);border:1px solid var(--linha1);overflow:hidden;
  background:rgba(255,255,255,.025);transition:.2s var(--ease)}
.ficha:hover{border-color:var(--linha3)}
.ficha-cab{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer}
.ficha-cab svg{width:52px;height:52px;flex-shrink:0}
.ficha-cab h3{font-size:14.6px}
.ficha-cab .seta{margin-left:auto;color:var(--ac4);transition:transform .25s var(--ease)}
.ficha.aberta .ficha-cab .seta{transform:rotate(90deg)}
.ficha-corpo{display:none;padding:0 16px 16px}
.ficha.aberta .ficha-corpo{display:block;animation:entra .3s var(--ease)}
.tabela{width:100%;border-collapse:collapse;font-size:12.8px;margin:8px 0}
.tabela th,.tabela td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--linha1);
  vertical-align:top}
.tabela th{font-family:var(--fm);font-size:10.4px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--br2);font-weight:700}
.tabela tr:last-child td{border-bottom:0}
.tabela td:first-child{color:var(--ac1);font-weight:600}
.matriz{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;font-family:var(--fm);font-size:11px}
.matriz div{padding:9px 4px;text-align:center;border-radius:var(--r4);
  background:rgba(255,255,255,.04);border:1px solid var(--linha1)}
.matriz .cab{color:var(--br2);font-weight:700;letter-spacing:1px}
.matriz .sim{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok);font-weight:700}
.matriz .nao{background:var(--er-bg);border-color:var(--er-ln);color:var(--er);font-weight:700}

/* ========================== 12. ESTATÍSTICAS ========================== */
.metricas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.metrica{padding:16px 15px;border-radius:var(--r2);border:1px solid var(--linha1);
  background:linear-gradient(165deg,rgba(20,36,54,.6),rgba(9,17,27,.7));position:relative;overflow:hidden}
.metrica .v{font-family:var(--fm);font-size:30px;font-weight:800;color:var(--ac1);line-height:1;
  letter-spacing:-1px}
.metrica .v small{font-size:15px;color:var(--ac4);margin-left:2px}
.metrica .l{font-family:var(--fm);font-size:9.6px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--ac4);margin-top:7px}
.metrica .ic{position:absolute;top:12px;right:12px;font-size:20px;color:var(--br4);opacity:.35}
.metrica.destaque{border-color:rgba(255,148,48,.4)}
.metrica.destaque .v{color:var(--br2)}

.dominio{display:grid;gap:9px}
.dom-linha{display:grid;grid-template-columns:minmax(96px,1.4fr) 1fr auto;gap:11px;align-items:center;
  font-size:12.4px}
.dom-linha .nm{color:var(--ac2)}
.dom-linha .pc{font-family:var(--fm);font-size:11.6px;color:var(--ac3);min-width:38px;text-align:right}
.dom-linha.critico .nm{color:var(--er)} .dom-linha.critico .pc{color:var(--er)}
.dom-linha.solido .nm{color:var(--ok)} .dom-linha.solido .pc{color:var(--ok)}

/* medalhas */
.vitrine{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.med{text-align:center;padding:13px 8px;border-radius:var(--r2);border:1px solid var(--linha1);
  background:rgba(255,255,255,.025);transition:.2s var(--ease)}
.med svg{margin:0 auto 7px;width:60px;height:auto}
.med .t{font-family:var(--fm);font-size:10px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--ac2);font-weight:700;line-height:1.35}
.med .d{font-size:10px;color:var(--ac4);margin-top:3px;line-height:1.4}
.med.travada{opacity:.3;filter:grayscale(1)}
.med.nova{border-color:var(--br3);box-shadow:var(--sh-br);animation:pulso 1.7s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 44px rgba(255,107,26,.5)}}

/* ======================= 13. CADERNO DE ERROS ========================= */
.erro-item{border-radius:var(--r2);border:1px solid var(--linha1);margin-bottom:10px;overflow:hidden;
  background:rgba(255,255,255,.022)}
.erro-cab{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.erro-cab .q{flex:1;font-size:12.8px;color:var(--ac2);min-width:180px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.erro-corpo{display:none;padding:0 14px 14px;border-top:1px solid var(--linha1);margin-top:2px}
.erro-item.aberto .erro-corpo{display:block;animation:entra .28s var(--ease)}
.vazio{text-align:center;padding:44px 20px;color:var(--ac4)}
.vazio svg{width:64px;height:64px;margin:0 auto 14px;opacity:.35}

/* ==================== 14. EFEITOS E PARTÍCULAS ======================== */
/* chama viva */
.chama{transform-origin:50% 100%;animation:chamaDanca var(--dur,2.4s) ease-in-out infinite alternate;
  animation-delay:var(--del,0s)}
@keyframes chamaDanca{
  0%{transform:scaleY(.94) scaleX(1.04) rotate(-2.5deg)}
  50%{transform:scaleY(1.07) scaleX(.95) rotate(1.5deg)}
  100%{transform:scaleY(.98) scaleX(1.03) rotate(2.5deg)}}
.ch-int{animation:chamaNucleo calc(var(--dur,2.4s)*.6) ease-in-out infinite alternate}
@keyframes chamaNucleo{to{transform:scaleY(1.16) translateY(-2px);opacity:.85}}
.ch-halo{animation:haloPulso calc(var(--dur,2.4s)*1.4) ease-in-out infinite alternate}
@keyframes haloPulso{to{transform:scale(1.16);opacity:.75}}
/* fumaça */
.fum{animation:fumSobe var(--dur,11s) linear infinite;animation-delay:var(--del,0s);
  opacity:var(--op,.5);transform-origin:50% 100%}
@keyframes fumSobe{
  0%{transform:translateY(30%) scale(.5);opacity:0}
  18%{opacity:var(--op,.5)}
  100%{transform:translateY(-88%) scale(1.85);opacity:0}}
/* brasas */
.brasa{animation:brasaSobe var(--dur,6s) linear infinite;animation-delay:var(--del,0s);opacity:0}
@keyframes brasaSobe{
  0%{transform:translate(0,0) scale(1);opacity:0}
  12%{opacity:.95}
  70%{opacity:.7}
  100%{transform:translate(var(--dx,0),var(--sub,-300px)) scale(.25);opacity:0}}
/* vértice do tetraedro */
.tv{cursor:pointer} .tv circle{transition:r .25s var(--ease),opacity .25s}
.tv-on circle:first-child{animation:pulso 1.6s ease-in-out infinite}

/* transição cinematográfica entre telas */
.tela{animation:telaEntra .45s var(--ease)}
@keyframes telaEntra{from{opacity:0;transform:translateY(20px) scale(.985);filter:blur(5px)}
  to{opacity:1;transform:none;filter:none}}
#cortina{position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,107,26,.24),rgba(4,8,14,.98) 68%)}
#cortina.ativa{animation:cortinaFlash .62s var(--ease)}
@keyframes cortinaFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

/* aviso flutuante (toast) */
#avisos{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:190;
  display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:min(94vw,430px)}
.aviso{display:flex;align-items:center;gap:11px;padding:13px 19px;border-radius:999px;
  background:rgba(9,17,27,.95);border:1px solid var(--linha2);box-shadow:var(--sh1);
  font-size:13px;color:var(--ac1);backdrop-filter:blur(14px);animation:avisoEntra .4s var(--ease);
  max-width:100%}
.aviso.ok{border-color:var(--ok-ln)} .aviso.ok .ic{color:var(--ok)}
.aviso.er{border-color:var(--er-ln)} .aviso.er .ic{color:var(--er)}
.aviso.xp{border-color:rgba(255,176,32,.5)} .aviso.xp .ic{color:var(--br2)}
.aviso.saindo{animation:avisoSai .35s var(--ease) forwards}
@keyframes avisoEntra{from{opacity:0;transform:translateY(22px) scale(.9)}to{opacity:1;transform:none}}
@keyframes avisoSai{to{opacity:0;transform:translateY(-14px) scale(.94)}}

/* combo */
#combo{position:fixed;right:18px;top:calc(var(--hud) + 18px);z-index:70;
  font-family:var(--fm);text-align:right;pointer-events:none;opacity:0;transition:opacity .3s}
#combo.on{opacity:1}
#combo .n{font-size:38px;font-weight:800;color:var(--br2);line-height:1;
  text-shadow:0 0 26px rgba(255,148,48,.65);animation:comboPop .35s var(--ease)}
#combo .l{font-size:9.6px;letter-spacing:2.6px;color:var(--br4);text-transform:uppercase}
@keyframes comboPop{0%{transform:scale(1.5)}100%{transform:scale(1)}}

/* modal */
.modal{position:fixed;inset:0;z-index:180;display:none;place-items:center;padding:18px;
  background:rgba(3,6,11,.86);backdrop-filter:blur(9px)}
.modal.on{display:grid;animation:entra .3s var(--ease)}
.modal .cx{width:min(560px,100%);max-height:88dvh;overflow:auto}

/* resultado de missão */
.resultado{text-align:center;padding:8px 0}
.resultado .selo-r{width:118px;height:118px;margin:0 auto 16px;border-radius:50%;display:grid;
  place-items:center;font-size:50px;border:2px solid;position:relative}
.resultado .selo-r.aprovado{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);
  box-shadow:0 0 60px rgba(63,209,137,.3)}
.resultado .selo-r.reprovado{color:var(--av);border-color:var(--av);background:var(--av-bg);
  box-shadow:0 0 60px rgba(255,176,32,.24)}
.resultado h2{margin-bottom:6px}
.placar{display:flex;justify-content:center;gap:26px;margin:20px 0;flex-wrap:wrap}
.placar > div{text-align:center}
.placar .v{font-family:var(--fm);font-size:27px;font-weight:800;color:var(--ac1)}
.placar .l{font-family:var(--fm);font-size:9.4px;letter-spacing:1.8px;color:var(--ac4);
  text-transform:uppercase;margin-top:4px}

/* splash */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 42%,#132840,#04070c 72%)}
#splash.sai{animation:splashSai .85s var(--ease) forwards}
@keyframes splashSai{to{opacity:0;transform:scale(1.14);filter:blur(14px);visibility:hidden}}
.splash-in{text-align:center;animation:entra .9s var(--ease)}
.splash-in svg{margin:0 auto 22px}
.splash-in h1{font-size:clamp(23px,6.2vw,42px);margin-bottom:8px}
.splash-in .sub{font-family:var(--fm);font-size:11px;letter-spacing:4.4px;color:var(--br3);
  text-transform:uppercase}
.splash-carga{width:min(300px,74vw);margin:30px auto 0}
.splash-carga .t{font-family:var(--fm);font-size:9.6px;letter-spacing:2.4px;color:var(--ac4);
  margin-bottom:8px;text-transform:uppercase}

/* ========================== 15. RESPONSIVIDADE ======================== */
@media (max-width:900px){
  .montagem{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  :root{--hud:56px;--r1:14px;--r2:11px}
  .wrap{padding:0 12px 56px}
  .hud-stats{gap:11px} .hud-st span{display:none}
  .hud-patente .pt-n,.hud-patente .pt-b{display:none}
  .hud-patente{padding:5px 6px}
  .hud-marca span{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .metricas{grid-template-columns:repeat(2,1fr)}
  .trilha{grid-template-columns:1fr}
  .bandeja{grid-template-columns:repeat(2,1fr)}
  .matriz{font-size:9.6px} .matriz div{padding:7px 2px}
  #combo{right:12px} #combo .n{font-size:30px}
  .placar{gap:18px}
  .vitrine{grid-template-columns:repeat(3,1fr)}
  /* alvos de toque: mínimo confortável de 46 px de altura */
  .btn{padding:14px 20px;min-height:46px}
  .btn.pequeno{padding:11px 14px;min-height:40px}
  .ce-btn{padding:20px 12px;font-size:16px;min-height:60px}
  .alt{padding:16px 15px;min-height:56px}
  .peca{padding:14px 10px 13px}
  .ordem-item .setas button{width:44px;height:44px;font-size:14px}
  .eixo-chip{padding:12px 17px;min-height:44px}
  .ficha-cab{padding:15px 14px}
  .erro-cab{padding:14px 13px}
  /* enunciado ocupa mais a tela e respira melhor */
  .q-enun,.pergunta{padding:17px 16px}
  .tabela th,.tabela td{padding:9px 8px}
}
/* Em telas estreitas a bandeja e as métricas seguem em DUAS colunas: com uma
   só, escolher entre as cinco classes exigiria rolar a tela inteira, o que
   atrapalha justamente a comparação que a mecânica quer treinar. */
@media (max-width:400px){
  .vitrine{grid-template-columns:repeat(2,1fr)}
  .peca svg{max-width:78px}
  .peca .nome{font-size:10.4px}
  .placar{gap:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
@media print{ body{background:#fff;color:#000} #hud,#avisos,.btn{display:none} }

</style>
</head>
<body>
<div id="nevoa"></div>
<header id="hud"></header>
<div id="app"><main class="wrap" id="tela"></main></div>
<div id="combo"></div>
<div id="avisos"></div>
<div id="cortina"></div>
<div class="modal" id="modal"></div>
<script>
/* ===== dados/conteudo.js ===== */
/* ==========================================================================
   OPERAÇÃO 01 — COMBATE A INCÊNDIO · CENTRO DE TREINAMENTO OPERACIONAL
   dados/conteudo.js — Base técnica do jogo
   --------------------------------------------------------------------------
   Fonte: OP01_Apostila_Combate_Incendio_CBMMA.pdf (6 eixos do edital CBMMA)
   Normas de apoio: ABNT NBR 12693, NBR 15808, manuais de bombeiro.
   Este módulo é a FONTE ÚNICA DA VERDADE: briefings, códex, mecânicas de
   triagem/agente/método e o gerador de cenários leem tudo daqui.
   ========================================================================== */
const CONTEUDO = {

/* ---------------------------------------------------------------- EIXOS -- */
eixos: [
  { id:'teoria', n:'Teoria do Fogo', cod:'E1', cor:'#ff8a3d', icone:'tetraedro',
    lema:'Antes de combater, entenda o inimigo.',
    resumo:'Fogo é reação química de oxidação exotérmica que libera luz e calor. Incêndio é o fogo sem controle. Todo o combate nasce de compreender os elementos que sustentam a combustão.' },
  { id:'classes', n:'Classes de Incêndio', cod:'E2', cor:'#ffb020', icone:'classes',
    lema:'A classe define o agente. Errou a classe, errou tudo.',
    resumo:'As classes classificam o fogo pelo material combustível envolvido. No Brasil (ABNT NBR 12693) são cinco: A, B, C, D e K.' },
  { id:'metodos', n:'Métodos de Extinção', cod:'E3', cor:'#4aa3ff', icone:'metodo',
    lema:'Cada método arranca um vértice do tetraedro.',
