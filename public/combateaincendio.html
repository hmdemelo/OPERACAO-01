 m:'Água em óleo quente = explosão de fogo.'},

{i:'A006',t:'ce',e:'agentes',s:'Água',d:3,
 x:'Situação hipotética: em um princípio de incêndio em pilha de papelão em um galpão, a guarnição emprega linha de mangueira com esguicho regulável, aplicando jato em neblina. Assertiva: a escolha do agente e do método é tecnicamente adequada à classe do sinistro.',
 g:1,
 j:'Correto. Papelão é sólido comum, portanto classe A. A água atua por resfriamento, e o jato em neblina amplia a superfície de troca térmica, com o benefício adicional do anteparo contra a radiação. Escolha tecnicamente correta.',
 p:'Nem todo item é armadilha. A CEBRASPE intercala assertivas corretas para punir quem responde "errado" por reflexo diante de cenários longos.',
 m:'Sólido comum + água = combinação correta.'},

{i:'A007',t:'ce',e:'agentes',s:'Água',d:2,
 x:'Entre as vantagens da água como agente extintor destacam-se a abundância, o baixo custo e a possibilidade de grande vazão por meio da rede de hidrantes.',
 g:1,
 j:'Correto. São vantagens logísticas e operacionais reais: disponibilidade, custo reduzido e vazão elevada sustentada, o que viabiliza o combate prolongado em incêndios de grande porte.',
 p:'A banca cobra tanto vantagens quanto limitações de cada agente. Conheça os dois lados.',
 m:'Água: barata, abundante e de alta vazão.'},

/* ---------------------------------------------------------- ESPUMA ---- */
{i:'A008',t:'ce',e:'agentes',s:'Espuma',d:1,
 x:'A espuma mecânica atua por abafamento e por resfriamento, sendo indicada para os incêndios das classes A e B.',
 g:1,
 j:'Correto. A espuma forma manta sobre o combustível, suprimindo o comburente (abafamento), e, por conter água em sua composição, também remove calor (resfriamento). Cobre as classes A e B.',
 p:'Fixe: espuma = A e B. A banca acrescenta a classe C, o que é falso e perigoso.',
 m:'Espuma » A e B.'},

{i:'A009',t:'ce',e:'agentes',s:'Espuma',d:1,
 x:'A espuma mecânica é agente adequado aos incêndios de classe C, por formar camada isolante sobre o equipamento energizado.',
 g:0,
 j:'ERRADO e perigoso. A espuma CONTÉM ÁGUA e conduz corrente elétrica — é PROIBIDA na classe C. A camada formada não isola eletricamente; ao contrário, estabelece caminho condutor até o operador.',
 p:'Pegadinha expressamente listada na apostila. A banca oferece justificativa técnica falsa ("camada isolante") para conferir verossimilhança.',
 m:'Espuma tem água » proibida em C.'},

{i:'A010',t:'ce',e:'agentes',s:'Espuma',d:2,
 x:'A espuma mecânica é especialmente eficaz nos incêndios de classe B, uma vez que a manta formada sela a superfície do líquido e impede a liberação de vapores inflamáveis.',
 g:1,
 j:'Correto. Como os líquidos inflamáveis queimam na interface com o ar, a manta de espuma sela essa superfície, bloqueando simultaneamente o acesso do oxigênio e a liberação de vapores — o que ainda previne a reignição.',
 p:'A eficácia da espuma na classe B decorre da característica da própria classe: queima superficial. Conceitos encadeados.',
 m:'Líquido queima em cima; a espuma sela em cima.'},

{i:'A011',t:'ce',e:'agentes',s:'Espuma',d:2,
 x:'A espuma mecânica é obtida a partir da mistura de líquido gerador de espuma, água e ar, em proporções adequadas.',
 g:1,
 j:'Correto. A espuma mecânica resulta da associação de três componentes: LGE (líquido gerador de espuma), água e ar, este último incorporado mecanicamente durante a formação.',
 p:'A presença da ÁGUA nessa composição é justamente o que veda o uso da espuma na classe C. Composição explica restrição.',
 m:'LGE + água + ar = espuma mecânica.'},

{i:'A012',t:'ce',e:'agentes',s:'Espuma',d:2,
 x:'A espuma mecânica constitui agente adequado ao combate de incêndios em metais pirofóricos e em óleos de cozinha.',
 g:0,
 j:'ERRADO nas duas indicações. A espuma não serve para a classe D (contém água, que reage com os metais) nem para a classe K (não provoca saponificação e não impede a reignição do óleo). Cobre apenas A e B.',
 p:'Item com dois erros simultâneos. A banca acumula indicações falsas em uma só assertiva para elevar a dificuldade.',
 m:'Espuma: A e B. Nada além disso.'},

/* ------------------------------------------------------ PÓ QUÍMICO ---- */
{i:'A013',t:'ce',e:'agentes',s:'Pó químico',d:1,
 x:'O pó químico ABC é o agente extintor mais versátil, sendo indicado para os incêndios das classes A, B e C.',
 g:1,
 j:'Correto. O pó ABC, à base de fosfato monoamônico, cobre três classes — a maior amplitude entre os agentes comuns. Atua por quebra da reação em cadeia e por abafamento.',
 p:'A banca troca ABC por BC nas alternativas. O BC cobre apenas B e C; a letra que lhe falta é justamente o A.',
 m:'ABC cobre A, B e C. É o mais versátil.'},

{i:'A014',t:'ce',e:'agentes',s:'Pó químico',d:2,
 x:'O pó químico BC é indicado para as classes B e C, não abrangendo os incêndios de classe A.',
 g:1,
 j:'Correto. O pó BC atua rapidamente sobre a chama de líquidos inflamáveis e é seguro em energizados, mas não forma crosta sobre o sólido em brasa nem alcança a queima em profundidade — por isso não cobre a classe A.',
 p:'Pegadinha clássica: "pó BC também cobre classe A". Errado. A sigla diz exatamente quais classes o agente cobre.',
 m:'A sigla é a resposta: BC cobre B e C.'},

{i:'A015',t:'ce',e:'agentes',s:'Pó químico',d:2,
 x:'A cobertura da classe A pelo pó químico ABC decorre de sua base de fosfato monoamônico, que forma crosta sobre o material em brasa.',
 g:1,
 j:'Correto. O fosfato monoamônico funde e adere ao sólido em brasa, formando crosta que sela o material e impede a reignição. É esse mecanismo que distingue o ABC do BC.',
 p:'Item que exige o fundamento químico da diferença. Quem entende o mecanismo responde variações inéditas.',
 m:'ABC forma crosta na brasa; BC não forma.'},

{i:'A016',t:'ce',e:'agentes',s:'Pó químico',d:2,
 x:'Entre as limitações do pó químico ABC destacam-se a deposição de resíduo corrosivo, capaz de danificar equipamentos eletrônicos, e a acentuada redução da visibilidade durante a aplicação.',
 g:1,
 j:'Correto. Ambas as limitações são relevantes na decisão tática: o resíduo inutiliza eletrônicos, e a nuvem de pó compromete a visibilidade em ambientes internos, dificultando a progressão e a localização de vítimas.',
 p:'É por essas limitações que o CO₂ é preferido em data centers e salas técnicas, embora o pó ABC seja tecnicamente admissível na classe C.',
 m:'Pó apaga rápido, mas suja e cega.'},

{i:'A017',t:'ce',e:'agentes',s:'Pó químico',d:2,
 x:'Os pós químicos BC e ABC conduzem corrente elétrica, razão pela qual seu emprego é vedado nos incêndios de classe C.',
 g:0,
 j:'ERRADO. Os pós químicos NÃO conduzem corrente elétrica e são justamente por isso admitidos na classe C. Quem conduz corrente e é vedado em C são a água e a espuma.',
 p:'Inversão direta: a banca atribui ao pó a limitação que pertence à água e à espuma.',
 m:'Pó não conduz. Pode em C.'},

{i:'A018',t:'ce',e:'agentes',s:'Pó químico',d:3,
 x:'O pó químico atua preponderantemente pela quebra da reação em cadeia, produzindo, ainda, efeito secundário de abafamento sobre o material em combustão.',
 g:1,
 j:'Correto e preciso. A ação principal é a extinção química — captura dos radicais livres. O abafamento é efeito secundário, ampliado no pó ABC pela formação de crosta sobre o sólido.',
 p:'Note a diferença entre "preponderantemente" (correto) e "exclusivamente" (que tornaria o item falso). A CEBRASPE explora esse contraste.',
 m:'Pó: química em primeiro lugar, abafamento em segundo.'},

{i:'A019',t:'ce',e:'agentes',s:'Pó químico',d:2,
 x:'O pó químico ABC é agente indicado para o combate a incêndios em metais pirofóricos, dada sua ampla versatilidade.',
 g:0,
 j:'ERRADO. O pó ABC cobre as classes A, B e C — não a classe D. Metais pirofóricos exigem pó ESPECIAL de classe D, com formulação e mecanismo próprios (formação de crosta isolante).',
 p:'A banca usa a versatilidade real do ABC para estendê-la indevidamente a uma quarta classe. Versátil não significa universal.',
 m:'ABC para de vez no C. D tem pó próprio.'},

/* -------------------------------------------------------------- CO₂ --- */
{i:'A020',t:'ce',e:'agentes',s:'CO2',d:1,
 x:'O dióxido de carbono é agente extintor indicado para as classes B e C, atuando preponderantemente por abafamento.',
 g:1,
 j:'Correto. O CO₂ desloca o oxigênio ao redor do foco (abafamento) e, por não conduzir corrente nem deixar resíduo, é especialmente adequado a equipamentos elétricos e eletrônicos.',
 p:'A banca estende o CO₂ à classe D — indicação falsa e expressamente destacada na apostila.',
 m:'CO₂ » B e C.'},

{i:'A021',t:'ce',e:'agentes',s:'CO2',d:1,
 x:'O dióxido de carbono é especialmente indicado para incêndios em equipamentos elétricos energizados porque não conduz corrente elétrica e não deixa resíduos sobre o equipamento.',
 g:1,
 j:'Correto. São as duas vantagens decisivas do CO₂ na classe C: segurança elétrica para o operador e preservação do equipamento protegido, que não sofre danos por resíduo.',
 p:'A banca inverte, afirmando que o CO₂ "deixa resíduo isolante" ou que "é bom condutor". Ambas as afirmações são falsas.',
 m:'CO₂: não conduz e não suja.'},

{i:'A022',t:'ce',e:'agentes',s:'CO2',d:2,
 x:'O dióxido de carbono, aplicado em ambiente fechado, pode deslocar o oxigênio respirável e provocar asfixia na guarnição.',
 g:1,
 j:'Correto. O mesmo mecanismo que extingue o fogo — deslocamento do oxigênio — ameaça os operadores em ambiente confinado. Exige-se controle da exposição, ventilação e proteção respiratória.',
 p:'Cuidado de uso expressamente destacado na apostila. A banca cobra as limitações tanto quanto as indicações.',
 m:'CO₂ em ambiente fechado asfixia.'},

{i:'A023',t:'ce',e:'agentes',s:'CO2',d:2,
 x:'O dióxido de carbono apresenta elevada capacidade de resfriamento, sendo, por essa razão, o agente ideal para os incêndios de classe A.',
 g:0,
 j:'ERRADO em ambos os pontos. O CO₂ resfria POUCO, e é justamente essa deficiência que o torna inadequado à classe A: extinta a chama, a brasa permanece aquecida e o material reacende quando o oxigênio retorna.',
 p:'A banca constrói uma premissa falsa (alta capacidade de resfriamento) para sustentar uma conclusão falsa (ideal para classe A). Ambas caem juntas.',
 m:'CO₂ abafa, mas quase não resfria. Reignição em A.'},

{i:'A024',t:'ce',e:'agentes',s:'CO2',d:2,
 x:'O dióxido de carbono apresenta eficácia reduzida quando aplicado ao ar livre, uma vez que o agente se dispersa antes de atingir concentração suficiente sobre o foco.',
 g:1,
 j:'Correto. Correntes de ar dispersam o gás rapidamente em ambiente aberto, impedindo que se forme a concentração necessária ao abafamento. O CO₂ é agente de ambientes confinados ou semiconfinados.',
 p:'Limitação frequentemente esquecida. A banca cobra o CO₂ por quatro ângulos: não conduz, não deixa resíduo, asfixia em confinado e é fraco ao ar livre.',
 m:'CO₂ ao ar livre se perde.'},

{i:'A025',t:'ce',e:'agentes',s:'CO2',d:2,
 x:'A descarga do dióxido de carbono ocorre em temperatura muito baixa, o que expõe o operador ao risco de queimadura por frio no contato com o difusor do extintor.',
 g:1,
 j:'Correto. A expansão do gás provoca queda acentuada de temperatura no difusor. O operador deve manusear o equipamento pelo punho isolante, evitando o contato direto com a parte metálica.',
 p:'Cuidado de uso destacado na apostila. Item de detalhe operacional, comum em provas de nível técnico.',
 m:'O difusor do CO₂ congela — não segure nele.'},

{i:'A026',t:'ce',e:'agentes',s:'CO2',d:2,
 x:'O dióxido de carbono constitui agente adequado ao combate de incêndios em metais pirofóricos, por atuar mediante abafamento.',
 g:0,
 j:'ERRADO. O CO₂ NÃO serve para a classe D. Metais em combustão podem decompor o dióxido de carbono e prosseguir queimando, e o agente não forma a crosta isolante exigida. Somente o pó especial de classe D é adequado.',
 p:'Pegadinha expressamente listada na apostila: "CO₂ serve para classe D" é afirmação clássica e ERRADA.',
 m:'CO₂ para no C. Não entra em D.'},

/* --------------------------------------------- AGENTES ESPECIAIS ------ */
{i:'A027',t:'ce',e:'agentes',s:'Agentes especiais',d:1,
 x:'O pó especial de classe D é agente de emprego exclusivo em incêndios de metais pirofóricos, formando crosta que isola o metal do oxigênio.',
 g:1,
 j:'Correto. O pó D é formulado especificamente para metais e atua por abafamento e isolamento específico, cobrindo o metal com camada que interrompe o contato com o comburente.',
 p:'A banca sugere que o pó D "também cobre a classe K" ou que é polivalente. É exclusivo da classe D.',
 m:'Pó D só serve para D.'},

{i:'A028',t:'ce',e:'agentes',s:'Agentes especiais',d:1,
 x:'O agente extintor de classe K atua por saponificação, formando sobre o óleo camada que abafa e resfria simultaneamente.',
 g:1,
 j:'Correto. A saponificação converte a superfície do óleo em camada semelhante a sabão, que sela o combustível e contribui para reduzir a temperatura — combate direto à reignição típica da classe.',
 p:'Saponificação é termo exclusivo da classe K. Se aparecer associado a outra classe ou como forma de transmissão de calor, o item está errado.',
 m:'K » saponificação » abafa e resfria.'},

{i:'A029',t:'ce',e:'agentes',s:'Agentes especiais',d:2,
 x:'Os agentes halogenados atuam por quebra da reação em cadeia e apresentam como vantagem a ausência de resíduo após a aplicação.',
 g:1,
 j:'Correto. Os halogenados operam por extinção química, tal como o pó, mas sem deixar resíduo — característica que os tornou tradicionais na proteção de equipamentos sensíveis e acervos.',
 p:'A banca associa halogenados ao resfriamento. Eles atuam por extinção química.',
 m:'Halogenado: química, sem resíduo.'},

{i:'A030',t:'ce',e:'agentes',s:'Agentes especiais',d:2,
 x:'A saponificação, mecanismo característico do agente de classe K, consiste em forma de transmissão de calor típica dos óleos aquecidos.',
 g:0,
 j:'ERRADO. A saponificação é reação química de EXTINÇÃO, não forma de transmissão de calor. As formas de transmissão são apenas três: condução, convecção e irradiação.',
 p:'Conceito verdadeiro deslocado para o capítulo errado. A banca faz isso com frequência entre eixos.',
 m:'Saponificação extingue; não transmite calor.'},

/* ------------------------------------------------ CLASSE × AGENTE ----- */
{i:'A031',t:'ce',e:'agentes',s:'Classe × agente',d:2,
 x:'A associação correta entre agentes e classes é a seguinte: água para a classe A; espuma para as classes A e B; pó ABC para as classes A, B e C; e dióxido de carbono para as classes B e C.',
 g:1,
 j:'Correto e completo. É o quadro-síntese do eixo, o conteúdo mais cobrado da disciplina. Complementam-no o pó BC (B e C), o pó especial (D) e o agente saponificante (K).',
 p:'Decore este quadro. A maioria das questões do eixo se resolve por consulta mental direta a ele.',
 m:'Água=A · Espuma=A,B · ABC=A,B,C · CO₂=B,C.'},

{i:'A032',t:'ce',e:'agentes',s:'Classe × agente',d:2,
 x:'A escolha do agente extintor inadequado à classe do incêndio pode resultar tanto na ineficácia do combate quanto no agravamento do sinistro ou em risco à integridade da guarnição.',
 g:1,
 j:'Correto. Há três desfechos possíveis: ineficácia (pó BC em classe A), agravamento (água em classe B ou K) e risco letal (água em classe C ou D). Por isso a associação classe × agente é decisão de segurança, não de preferência.',
 p:'Item conceitual que sintetiza a importância do eixo. A banca costuma cobrá-lo como abertura de bloco.',
 m:'Agente errado: não apaga, piora ou mata.'},

{i:'A033',t:'ce',e:'agentes',s:'Classe × agente',d:3,
 x:'Situação hipotética: um bombeiro precisa combater princípio de incêndio em quadro elétrico energizado, sem possibilidade de desligamento imediato da rede. Assertiva: nessa hipótese, tanto o dióxido de carbono quanto o pó químico constituem agentes tecnicamente admissíveis.',
 g:1,
 j:'Correto. Mantida a energização, trata-se de classe C, que admite agentes não condutores: CO₂ e pós químicos (BC e ABC). Entre eles, o CO₂ é preferível quando se pretende preservar o equipamento, por não deixar resíduo.',
 p:'O item afirma "admissíveis", não "ideais". Ambos são admissíveis; a escolha entre eles depende da preservação do equipamento.',
 m:'Em C: CO₂ ou pó. Nunca água ou espuma.'},

{i:'A034',t:'ce',e:'agentes',s:'Classe × agente',d:2,
 x:'Nenhum dos agentes extintores usualmente empregados cobre, simultaneamente, as classes A, B e C.',
 g:0,
 j:'ERRADO. O pó químico ABC cobre exatamente essas três classes — é o agente mais versátil do rol e a própria sigla o indica.',
 p:'A banca nega a existência do agente polivalente. Se você lembra da sigla ABC, o item cai imediatamente.',
 m:'ABC existe e cobre A, B e C.'},

{i:'A035',t:'ce',e:'agentes',s:'Classe × agente',d:3,
 x:'Situação hipotética: em uma cozinha industrial, ardem simultaneamente óleo em uma fritadeira e um quadro elétrico energizado situado na mesma parede. Assertiva: o agente saponificante de classe K é adequado a ambos os focos, por atuar por abafamento e resfriamento.',
 g:0,
 j:'ERRADO. O agente de classe K é específico para óleos e gorduras de cocção e, sendo de base aquosa, não é adequado ao quadro ENERGIZADO (classe C). Os focos exigem agentes distintos: saponificante para o óleo e CO₂ ou pó para o quadro.',
 p:'Item que explora a coexistência de classes. Ter mecanismo compatível (abafa e resfria) não basta — é preciso compatibilidade com a condição de energização.',
 m:'Agente K é aquoso. Não vai em energizado.'},

{i:'A036',t:'ce',e:'agentes',s:'Classe × agente',d:2,
 x:'O agente extintor deve ser selecionado exclusivamente em função da disponibilidade no local do sinistro, sendo irrelevante a classe do incêndio quando o tempo de resposta é crítico.',
 g:0,
 j:'ERRADO. A urgência não autoriza o emprego de agente incompatível. Água em classe C mata o operador; água em classe D explode; água em classe K projeta óleo em chamas. A classe é sempre determinante.',
 p:'A banca invoca a urgência como falsa justificativa para relativizar a técnica. Pressa nunca autoriza agente incompatível.',
 m:'Urgência não muda a química.'},

{i:'A037',t:'ce',e:'agentes',s:'Água',d:2,
 x:'A água, mesmo aplicada sob a forma de neblina, permanece vedada nos incêndios de classe C, uma vez que a modalidade do jato não altera sua condutividade elétrica.',
 g:1,
 j:'Correto. A neblina modifica a distribuição e a superfície de contato do agente, mas não sua natureza: a água continua condutora. A vedação em classe C independe da forma do jato.',
 p:'A banca sugere que a neblina "suavizaria" a água a ponto de torná-la segura em energizados. Não torna.',
 m:'Neblina muda o jato, não a condutividade.'},

{i:'A038',t:'ce',e:'agentes',s:'CO2',d:3,
 x:'Situação hipotética: após a extinção de um princípio de incêndio em arquivo de documentos mediante aplicação de dióxido de carbono, a guarnição observa reignição do material minutos depois. Assertiva: o fenômeno é compatível com a baixa capacidade de resfriamento do agente empregado frente a um combustível de classe A.',
 g:1,
 j:'Correto. Papel é classe A, com queima em profundidade e formação de brasa. O CO₂ abafa e extingue a chama, mas resfria pouco: dissipado o gás, a brasa remanescente reacende ao contato com o oxigênio. Daí a inadequação do CO₂ à classe A.',
 p:'Item que cobra o diagnóstico da falha a partir do resultado observado. Reignição após CO₂ em classe A é o caso típico.',
 m:'CO₂ em papel: apaga e volta a acender.'},

{i:'A039',t:'ce',e:'agentes',s:'Espuma',d:2,
 x:'A espuma mecânica, por conter água em sua composição, apresenta também capacidade de resfriamento, o que a diferencia dos agentes que atuam exclusivamente por abafamento.',
 g:1,
 j:'Correto. A presença de água confere à espuma ação dupla: abafamento pela manta e resfriamento pela absorção de calor. É essa composição, contudo, que a veda na classe C.',
 p:'A mesma característica explica a virtude (resfria) e a restrição (conduz corrente). A banca cobra os dois lados da mesma moeda.',
 m:'A água da espuma resfria — e proíbe em C.'},

{i:'A040',t:'ce',e:'agentes',s:'Pó químico',d:2,
 x:'A aplicação de pó químico em ambiente interno reduz significativamente a visibilidade, o que pode dificultar a progressão da guarnição e a localização de vítimas.',
 g:1,
 j:'Correto. A nuvem de pó em suspensão obscurece o ambiente, agravando a desorientação já causada pela fumaça. É limitação operacional relevante na decisão tática em ambientes com vítimas.',
 p:'Limitação prática frequentemente ignorada pelo candidato, que memoriza apenas as classes cobertas por cada agente.',
 m:'Pó cega o ambiente.'},

{i:'A041',t:'ce',e:'agentes',s:'Classe × agente',d:3,
 x:'Situação hipotética: em depósito de solventes, ocorre derramamento seguido de incêndio em poça de grandes dimensões, em ambiente aberto. Assertiva: nessa condição, a espuma mecânica é preferível ao dióxido de carbono, dada a maior persistência da manta formada e a limitação do CO₂ em ambientes abertos.',
 g:1,
 j:'Correto nos dois fundamentos. Em incêndio de poça a céu aberto, o CO₂ se dispersa antes de atingir concentração útil, ao passo que a espuma forma manta persistente sobre o líquido, selando a superfície e prevenindo a reignição.',
 p:'Item que compara dois agentes ambos admissíveis na classe B, exigindo o critério de escolha. A CEBRASPE gosta desse nível de refinamento.',
 m:'Poça grande ao ar livre: espuma, não CO₂.'},

{i:'A042',t:'ce',e:'agentes',s:'Agentes especiais',d:2,
 x:'A aplicação do pó especial de classe D deve ser realizada de modo suave, evitando-se jatos de alta energia que possam dispersar o metal em combustão.',
 g:1,
 j:'Correto. Jato violento espalha partículas metálicas incandescentes, ampliando a área do sinistro. A técnica correta é o recobrimento suave, formando crosta contínua sobre o metal.',
 p:'Detalhe operacional específico da classe D, cobrado em provas de nível técnico.',
 m:'Em metal, cobre devagar.'},

 x:'Os extintores de incêndio são aparelhos portáteis, ou sobre rodas, destinados ao combate a princípios de incêndio, identificando-se pelo agente que contêm e pelas classes indicadas em seu rótulo.',
 g:1,
 j:'Correto. O extintor é equipamento de primeira intervenção, dimensionado para PRINCÍPIOS de incêndio. A identificação por agente e por classes no rótulo é o que permite a seleção correta no momento da emergência.',
 p:'A banca amplia a finalidade do extintor, afirmando que se destina ao combate de incêndios "de qualquer porte". Destina-se a princípios.',
 m:'Extintor é para PRINCÍPIO de incêndio.'},

{i:'E002',t:'ce',e:'equipamentos',s:'Extintores',d:1,
 x:'Ao se utilizar um extintor portátil, o jato do agente deve ser dirigido para a base do fogo, e não para o topo das chamas.',
 g:1,
 j:'Correto. A base é onde está o combustível e onde a reação se sustenta. Dirigir o jato ao topo das chamas dissipa o agente sem atingir o foco — erro operacional clássico.',
 p:'Erro comum expressamente destacado na apostila. Se o item mencionar "topo das chamas" como alvo, está errado.',
 m:'Jato SEMPRE na BASE.'},

{i:'E003',t:'ce',e:'equipamentos',s:'Extintores',d:2,
 x:'O método PASS de operação do extintor compreende, nesta ordem, puxar o pino de segurança, apontar o difusor para a base das chamas, soltar o agente acionando o gatilho e sustentar a aplicação em movimento de leque.',
 g:1,
 j:'Correto. A sequência é: Puxar (retirar o pino/lacre), Apontar (à base), Soltar (acionar o gatilho) e Sustentar (movimento de leque, a favor do vento, recuando com segurança).',
 p:'A banca embaralha a ordem — apontar antes de puxar, por exemplo — ou troca "base" por "topo" dentro da descrição do passo.',
 m:'P-A-S-S: Puxar, Apontar, Soltar, Sustentar.'},

{i:'E004',t:'ce',e:'equipamentos',s:'Extintores',d:2,
 x:'Durante a operação do extintor, o combatente deve posicionar-se contra o vento, de frente para a fumaça, de modo a manter o foco sob observação constante.',
 g:0,
 j:'ERRADO. O combatente deve posicionar-se A FAVOR do vento, de modo que a fumaça, o calor e o agente sejam afastados dele, mantendo sempre a rota de fuga assegurada.',
 p:'A banca oferece uma justificativa falsamente prudente ("manter o foco sob observação"). Posicionar-se contra o vento expõe o operador à fumaça e ao calor.',
 m:'Sempre a FAVOR do vento, com rota de fuga.'},

{i:'E005',t:'ce',e:'equipamentos',s:'Inspeção',d:2,
 x:'Na inspeção visual de um extintor, indicam aptidão para uso o manômetro com ponteiro na faixa verde, o lacre íntegro e a validade em dia.',
 g:1,
 j:'Correto. São os três indicadores básicos da inspeção visual, aos quais se somam a desobstrução do acesso e a sinalização visível.',
 p:'A banca troca a faixa verde pela vermelha ou apresenta o lacre rompido como sinal de aptidão. Faixa verde = pressão adequada.',
 m:'Verde, lacrado, na validade e desobstruído.'},

{i:'E006',t:'ce',e:'equipamentos',s:'Inspeção',d:2,
 x:'O extintor de incêndio pode ser mantido atrás de mobiliário ou de materiais armazenados, desde que sua sinalização esteja fixada na parede correspondente.',
 g:0,
 j:'ERRADO. O extintor NUNCA pode estar obstruído. A sinalização não supre o acesso físico: em emergência, o tempo perdido para remover obstáculos compromete a intervenção no princípio de incêndio.',
 p:'A banca oferece uma condição compensatória falsa ("desde que sinalizado"). Acesso desobstruído é requisito autônomo.',
 m:'Extintor nunca obstruído — sinalizar não basta.'},

{i:'E007',t:'ce',e:'equipamentos',s:'Inspeção',d:2,
 x:'O manômetro com ponteiro posicionado na faixa vermelha indica que o extintor está em condições ideais de pressurização e pronto para uso.',
 g:0,
 j:'ERRADO. A faixa VERDE indica pressão adequada. A faixa vermelha sinaliza pressão fora da faixa de trabalho — seja por despressurização, seja por sobrepressão —, o que exige manutenção imediata.',
 p:'Inversão direta das cores. Item de baixa dificuldade técnica, mas que derruba candidatos em leitura acelerada.',
 m:'Verde = pronto. Vermelho = problema.'},

{i:'E008',t:'ce',e:'equipamentos',s:'Extintores',d:3,
 x:'Situação hipotética: ao acionar um extintor diante de um princípio de incêndio, o operador dirige o jato à porção superior das chamas e mantém-se em posição contrária à direção do vento. Assertiva: ambas as condutas descritas estão tecnicamente corretas.',
 g:0,
 j:'ERRADO nas duas condutas. O jato deve ser dirigido à BASE do fogo, e o operador deve posicionar-se A FAVOR do vento. As duas descrições reproduzem exatamente os erros operacionais mais frequentes.',
 p:'Item que acumula dois erros clássicos. Basta identificar um deles para julgar o item como errado.',
 m:'Base do fogo + a favor do vento.'},

/* -------------------------------------------------------- HIDRANTES --- */
{i:'E009',t:'ce',e:'equipamentos',s:'Hidrantes',d:1,
 x:'Os hidrantes são pontos de tomada de água pressurizada da rede de combate a incêndio, podendo ser de coluna, quando externos, ou de parede, quando instalados em abrigos internos.',
 g:1,
 j:'Correto. O hidrante fornece água sob pressão com grande vazão, viabilizando o combate prolongado — ao contrário do extintor, limitado à carga que contém.',
 p:'A banca afirma que os hidrantes "não fornecem água sob pressão" ou que "servem apenas para armazenar extintores". Ambas são falsas.',
 m:'Hidrante = água pressurizada. Coluna (fora) ou parede (dentro).'},

{i:'E010',t:'ce',e:'equipamentos',s:'Hidrantes',d:2,
 x:'A principal vantagem do sistema de hidrantes em relação aos extintores portáteis reside na possibilidade de combate prolongado, em razão da grande vazão e do suprimento contínuo de água.',
 g:1,
 j:'Correto. O extintor tem carga finita e destina-se a princípios; o hidrante, alimentado pela rede ou por reservatório, sustenta o combate por tempo prolongado e com vazão muito superior.',
 p:'A distinção de finalidade entre extintor (princípio) e hidrante (combate prolongado) é cobrada com frequência.',
 m:'Extintor: princípio. Hidrante: combate prolongado.'},

{i:'E011',t:'ce',e:'equipamentos',s:'Hidrantes',d:2,
 x:'Os hidrantes destinam-se exclusivamente ao combate de incêndios de classe C, dada a pressurização da água fornecida.',
 g:0,
 j:'ERRADO. Os hidrantes fornecem ÁGUA, agente vedado justamente na classe C por conduzir corrente elétrica. Seu emprego típico é na classe A. Não há exclusividade de classe alguma na definição do equipamento.',
 p:'Item com erro duplo: inventa exclusividade e escolhe justamente a classe em que a água é proibida.',
 m:'Hidrante joga água. Água não vai em C.'},

{i:'E012',t:'ce',e:'equipamentos',s:'Hidrantes',d:2,
 x:'O hidrante de coluna é instalado em abrigos internos da edificação, ao passo que o hidrante de parede situa-se externamente, junto à via pública.',
 g:0,
 j:'ERRADO — as posições estão invertidas. O hidrante de COLUNA é externo, situado na via; o de PAREDE fica em abrigos internos da edificação.',
 p:'Troca direta entre os dois tipos. Associe pela imagem: coluna se ergue na rua; parede fica na parede, dentro.',
 m:'Coluna na rua; parede dentro.'},

/* ------------------------------------------------------- MANGUEIRAS --- */
{i:'E013',t:'ce',e:'equipamentos',s:'Mangueiras',d:1,
 x:'As mangueiras de incêndio conduzem a água sob pressão do hidrante ou da viatura até o esguicho, sendo classificadas por tipo e por diâmetro.',
 g:1,
 j:'Correto. A classificação por tipo (1 a 5) reflete a resistência e o emprego previsto; a classificação por diâmetro (comumente 38 mm e 63 mm) determina a vazão e a manobrabilidade da linha.',
 p:'A banca inverte a função (afirma que a mangueira modela o jato — isso é do esguicho) ou nega a classificação por tipos.',
 m:'Mangueira CONDUZ; esguicho MODELA.'},

{i:'E014',t:'ce',e:'equipamentos',s:'Mangueiras',d:1,
 x:'As juntas de união do tipo engate rápido, empregadas para conectar mangueiras de incêndio, são conhecidas como juntas Storz.',
 g:1,
 j:'Correto. A junta Storz acopla por um quarto de volta, permitindo conexão e desconexão rápidas — característica essencial na montagem de linhas sob pressão do tempo.',
 p:'A banca oferece alternativas plausíveis de outras áreas: flangeada, rosqueada, soldada, de compressão. A resposta no combate a incêndio é sempre Storz.',
 m:'Engate rápido = STORZ.'},

{i:'E015',t:'ce',e:'equipamentos',s:'Mangueiras',d:2,
 x:'As mangueiras de incêndio devem ser acondicionadas sem torções, uma vez que dobras e torções reduzem a vazão e comprometem a eficiência do combate.',
 g:1,
 j:'Correto. A torção estrangula a seção interna da mangueira, reduzindo a vazão e elevando a perda de carga. O acondicionamento correto é o aduchamento, que preserva a linha e agiliza o lançamento.',
 p:'A banca pode afirmar que a torção "não afeta a vazão, apenas o armazenamento". Afeta diretamente a vazão.',
 m:'Mangueira torcida = menos água na ponta.'},

{i:'E016',t:'ce',e:'equipamentos',s:'Mangueiras',d:2,
 x:'A junta Storz realiza o acoplamento das mangueiras mediante rosqueamento completo, o que exige o emprego de ferramenta específica para cada volta.',
 g:0,
 j:'ERRADO. A junta Storz acopla por UM QUARTO DE VOLTA — é engate rápido, não rosqueamento completo. A chave de mangueira serve para apertar e soltar a união, não para executar múltiplas voltas de rosca.',
 p:'A banca descreve corretamente uma junta rosqueada e a nomeia Storz. Storz é engate rápido.',
 m:'Storz: um quarto de volta e travou.'},

{i:'E017',t:'ce',e:'equipamentos',s:'Mangueiras',d:2,
 x:'Os diâmetros mais comumente empregados nas mangueiras de incêndio são o de 38 mm e o de 63 mm.',
 g:1,
 j:'Correto. O de 38 mm é usual em linhas de ataque, por sua manobrabilidade; o de 63 mm, em linhas de alimentação, por sua maior vazão.',
 p:'Item de memorização numérica. A banca altera os valores para 25 mm ou 100 mm, testando a fixação do dado.',
 m:'38 e 63 milímetros.'},

/* --------------------------------------------------------- ESGUICHOS -- */
{i:'E018',t:'ce',e:'equipamentos',s:'Esguichos',d:1,
 x:'O esguicho é a peça instalada na extremidade da mangueira, responsável por modelar o jato de água aplicado sobre o incêndio.',
 g:1,
 j:'Correto. É o esguicho que define a forma do jato — sólido, neblina ou fechamento —, adequando a aplicação à situação tática enfrentada.',
 p:'A banca atribui essa função à mangueira. A mangueira conduz; o esguicho modela.',
 m:'Esguicho é quem dá forma ao jato.'},

{i:'E019',t:'ce',e:'equipamentos',s:'Esguichos',d:2,
 x:'O esguicho regulável, também denominado universal, permite ao operador selecionar entre jato sólido, jato em neblina e o fechamento do fluxo.',
 g:1,
 j:'Correto. É a versatilidade do esguicho regulável: uma única peça atende ao ataque direto (jato sólido), à proteção e ao resfriamento ampliado (neblina) e ao controle do fluxo (fechamento).',
 p:'A banca atribui essas três funções à agulheta, que produz apenas jato sólido compacto.',
 m:'Regulável = sólido + neblina + fecha.'},

{i:'E020',t:'ce',e:'equipamentos',s:'Esguichos',d:2,
 x:'O esguicho agulheta produz jato compacto de longo alcance, sendo empregado no ataque direto e no resfriamento do material em combustão.',
 g:1,
 j:'Correto. A agulheta gera jato sólido, com grande alcance e poder de penetração, adequado ao ataque direto a distância e ao resfriamento de estruturas.',
 p:'A banca afirma que a agulheta permite selecionar neblina. Não permite — o jato sólido é fixo.',
 m:'Agulheta = jato sólido, só isso.'},

{i:'E021',t:'ce',e:'equipamentos',s:'Esguichos',d:2,
 x:'O esguicho de neblina fragmenta a água em gotículas, o que amplia a área de resfriamento e permite a formação de anteparo contra o calor.',
 g:1,
 j:'Correto. A fragmentação multiplica a superfície de troca térmica e a cortina de gotículas funciona como anteparo, protegendo a guarnição da radiação térmica durante a aproximação.',
 p:'A dupla função — resfriar mais e proteger — é frequentemente reduzida pela banca a apenas uma delas.',
 m:'Neblina: resfria mais e protege o bombeiro.'},

{i:'E022',t:'ce',e:'equipamentos',s:'Esguichos',d:3,
 x:'Situação hipotética: durante a progressão em corredor com elevada carga térmica, a guarnição opta pelo jato em neblina em detrimento do jato sólido. Assertiva: a escolha é tecnicamente justificável, pois a neblina amplia a absorção de calor e forma anteparo protetivo entre a guarnição e a fonte de radiação.',
 g:1,
 j:'Correto. Em ambiente de alta carga térmica, a neblina oferece dois benefícios simultâneos: absorção de calor ampliada pela maior superfície de troca e proteção contra a radiação pela cortina de gotículas.',
 p:'Item de decisão tática. A banca cobra não apenas o que cada esguicho faz, mas quando escolher cada um.',
 m:'Muito calor no corredor: neblina.'},

/* ------------------------------------------------------ MANGOTINHO ---- */
{i:'E023',t:'ce',e:'equipamentos',s:'Mangotinho',d:1,
 x:'O mangotinho é constituído por mangueira semirrígida acondicionada em carretel, podendo ser operado sem a necessidade de extensão completa da linha.',
 g:1,
 j:'Correto. A semirrigidez impede o colapso da mangueira quando parcialmente desenrolada, o que permite a operação imediata — vantagem decisiva na resposta rápida a princípios de incêndio.',
 p:'A banca afirma que o mangotinho "precisa ser totalmente estendido". Justamente não precisa: essa é sua característica definidora.',
 m:'Mangotinho: semirrígido, carretel, uso imediato.'},

{i:'E024',t:'ce',e:'equipamentos',s:'Mangotinho',d:2,
 x:'O mangotinho possui diâmetro superior ao das mangueiras convencionais de incêndio, o que lhe confere maior vazão e alcance.',
 g:0,
 j:'ERRADO. O mangotinho tem diâmetro MENOR que o das mangueiras convencionais. Sua vantagem não é vazão, e sim a rapidez de emprego e a facilidade de manejo por um único operador.',
 p:'A banca inverte a característica dimensional. Menor diâmetro é o que torna o mangotinho manejável e de resposta rápida.',
 m:'Mangotinho é mais fino e mais rápido.'},

{i:'E025',t:'ce',e:'equipamentos',s:'Mangotinho',d:2,
 x:'O mangotinho integra o sistema de hidrantes e mangotinhos, destinando-se à resposta rápida em princípios de incêndio.',
 g:1,
 j:'Correto. O mangotinho compõe o sistema fixo da edificação e é concebido para intervenção imediata, inclusive por pessoa treinada não pertencente ao corpo de bombeiros.',
 p:'A banca desvincula o mangotinho do sistema de hidrantes, tratando-o como equipamento autônomo de viatura. Ele integra o sistema fixo.',
 m:'Mangotinho faz parte do sistema de hidrantes.'},

/* ------------------------------------------------------ ACESSÓRIOS ---- */
{i:'E026',t:'ce',e:'equipamentos',s:'Acessórios',d:1,
 x:'A chave de mangueira, também denominada chave Storz, destina-se a apertar e a soltar as juntas de união das mangueiras de incêndio.',
 g:1,
 j:'Correto. É ferramenta de acoplamento e desacoplamento das juntas, especialmente úteis quando a pressão residual ou a sujeira dificultam a operação manual.',
 p:'A banca atribui à chave a função de controlar o fluxo de água — função do registro ou da válvula.',
 m:'Chave aperta e solta a união.'},

{i:'E027',t:'ce',e:'equipamentos',s:'Acessórios',d:2,
 x:'O derivante é o acessório destinado a dividir o fluxo de uma linha de mangueira em duas ou mais saídas.',
 g:1,
 j:'Correto. O derivante permite montar linhas de ataque simultâneas a partir de uma única alimentação, ampliando a flexibilidade tática da guarnição.',
 p:'A banca confunde derivante com redução. Derivante DIVIDE o fluxo; redução ADAPTA diâmetros.',
 m:'Derivante DIVIDE. Redução ADAPTA.'},

{i:'E028',t:'ce',e:'equipamentos',s:'Acessórios',d:2,
 x:'A redução é o acessório que adapta diâmetros distintos de juntas de união, permitindo, por exemplo, a passagem de uma linha de 63 mm para 38 mm.',
 g:1,
 j:'Correto. A redução compatibiliza seções diferentes, viabilizando a transição da linha de alimentação, de maior diâmetro, para a linha de ataque, de menor diâmetro.',
 p:'Não confunda com o derivante, que divide o fluxo, nem com o tampão, que veda saídas.',
 m:'Redução muda o diâmetro.'},

{i:'E029',t:'ce',e:'equipamentos',s:'Acessórios',d:2,
 x:'O tampão destina-se a vedar as saídas não utilizadas do hidrante ou do derivante, evitando a perda de pressão e a entrada de sujeira no sistema.',
 g:1,
 j:'Correto. A vedação das saídas ociosas preserva a pressão de trabalho da linha ativa e protege o sistema contra contaminação por partículas.',
 p:'Item de detalhe. A banca troca as funções entre tampão, redução e derivante — três acessórios frequentemente confundidos.',
 m:'Tampão VEDA saída.'},

{i:'E030',t:'ce',e:'equipamentos',s:'Acessórios',d:2,
 x:'O registro, ou válvula, controla a passagem e a pressão da água na linha, devendo sua abertura e seu fechamento ocorrer de forma gradual.',
 g:1,
 j:'Correto. A operação gradual evita o golpe de aríete — sobrepressão transitória decorrente da interrupção abrupta do fluxo, capaz de danificar o sistema e projetar a linha.',
 p:'A ressalva "de forma gradual" é o que dá precisão técnica ao item. A banca a suprime ou a inverte ("de forma rápida").',
 m:'Abrir e fechar devagar — golpe de aríete.'},

/* ------------------------------------------- INTEGRAÇÃO E APLICAÇÃO --- */
{i:'E031',t:'ce',e:'equipamentos',s:'Extintores',d:2,
 x:'A seleção do extintor adequado deve considerar as classes de incêndio indicadas em seu rótulo, sendo insuficiente a verificação apenas da carga e da validade do aparelho.',
 g:1,
 j:'Correto. Um extintor pressurizado e dentro da validade permanece inadequado se seu agente não cobrir a classe do sinistro. A verificação das classes no rótulo é etapa autônoma e indispensável.',
 p:'Item que integra o eixo de equipamentos com o de agentes. A banca aprecia essa costura.',
 m:'Extintor bom não é extintor certo.'},

{i:'E032',t:'ce',e:'equipamentos',s:'Mangueiras',d:3,
 x:'Situação hipotética: montada uma linha de ataque, a guarnição constata redução significativa da vazão no esguicho, embora o hidrante esteja plenamente aberto. Assertiva: entre as causas prováveis, inclui-se a existência de torções ou dobras ao longo da mangueira.',
 g:1,
 j:'Correto. Torções e dobras estrangulam a seção interna da mangueira, elevando a perda de carga e reduzindo a vazão na ponta — causa frequente e de verificação imediata em campo.',
 p:'Item de diagnóstico operacional. A banca cobra a causa a partir do sintoma observado.',
 m:'Pouca água na ponta? Verifique torções.'},

{i:'E033',t:'ce',e:'equipamentos',s:'Extintores',d:2,
 x:'O movimento em leque, recomendado na etapa de sustentação da aplicação do extintor, tem por finalidade cobrir toda a base do fogo de maneira uniforme.',
 g:1,
 j:'Correto. O leque distribui o agente por toda a extensão da base, evitando que áreas não atingidas remanesçam em combustão e reacendam o foco já controlado.',
 p:'A banca inverte a finalidade, afirmando que o leque serve para "dispersar a fumaça". Serve para cobrir a base.',
 m:'Leque cobre a base inteira.'},

{i:'E034',t:'ce',e:'equipamentos',s:'Hidrantes',d:2,
 x:'O sistema de hidrantes opera em conjunto com mangueiras e esguichos, não os substituindo.',
 g:1,
 j:'Correto. O hidrante é o ponto de tomada de água; a mangueira conduz; o esguicho aplica. São componentes complementares de um mesmo sistema.',
 p:'A banca afirma que os hidrantes "substituem o uso de mangueiras e esguichos". Não substituem — operam com eles.',
 m:'Hidrante + mangueira + esguicho = sistema.'},

{i:'E035',t:'ce',e:'equipamentos',s:'Inspeção',d:2,
 x:'A sinalização do extintor deve permanecer visível e desobstruída, integrando o conjunto de requisitos verificados na inspeção visual do equipamento.',
 g:1,
 j:'Correto. Sinalização visível, acesso desobstruído, manômetro na faixa verde, lacre íntegro e validade em dia compõem o rol da inspeção visual.',
 p:'Item que completa o rol. A banca apresenta listas parciais, omitindo um dos requisitos, ou insere requisitos inexistentes.',
 m:'Inspeção: verde, lacre, validade, acesso e sinalização.'},

{i:'E036',t:'ce',e:'equipamentos',s:'Esguichos',d:2,
 x:'O jato sólido apresenta maior alcance e maior poder de penetração que o jato em neblina, sendo por isso indicado ao ataque direto a distância.',
 g:1,
 j:'Correto. A concentração da massa de água em jato compacto confere alcance e penetração superiores, adequados ao ataque direto e ao resfriamento de estruturas a distância.',
 p:'Item que compara os dois jatos. Cada um tem vantagem própria: sólido alcança; neblina resfria mais e protege.',
 m:'Sólido alcança longe; neblina protege perto.'},

{i:'E037',t:'ce',e:'equipamentos',s:'Mangotinho',d:3,
 x:'Situação hipotética: detectado princípio de incêndio em depósito dotado de sistema de hidrantes e mangotinhos, um funcionário treinado aciona o mangotinho mais próximo sem desenrolar integralmente o carretel. Assertiva: a conduta é compatível com as características construtivas do equipamento.',
 g:1,
 j:'Correto. A semirrigidez do mangotinho impede o colapso da mangueira quando parcialmente desenrolada, permitindo a operação imediata. É exatamente a característica que o distingue da mangueira convencional.',
 p:'Item que cobra a consequência prática da característica construtiva. Semirrígido significa operável sem extensão completa.',
 m:'Mangotinho funciona parcialmente desenrolado.'},

{i:'E038',t:'ce',e:'equipamentos',s:'Acessórios',d:2,
 x:'O derivante e a redução exercem função idêntica no sistema, distinguindo-se apenas quanto ao material de fabricação.',
 g:0,
 j:'ERRADO. As funções são distintas: o derivante DIVIDE o fluxo em duas ou mais saídas; a redução ADAPTA diâmetros diferentes de juntas de união. A diferença é funcional, não de material.',
 p:'A banca cria falsa equivalência entre acessórios próximos. Cada acessório tem função específica.',
 m:'Derivante divide; redução adapta.'},

/* ------------------------------------------------ MÚLTIPLA ESCOLHA ---- */
{i:'E039',t:'me',e:'equipamentos',s:'Extintores',d:1,
 x:'Ao utilizar um extintor portátil, o jato do agente deve ser dirigido para:',

     'O teto não é o ponto de aplicação do agente extintor.'],

{i:'E040',t:'me',e:'equipamentos',s:'Mangueiras',d:1,

 ja:['CORRETA — Storz, engate rápido por um quarto de volta.',

     'Juntas rosqueadas exigem múltiplas voltas — incompatíveis com a urgência do combate.',
     'Juntas soldadas são permanentes, inaplicáveis a mangueiras.',
     'Juntas de compressão pertencem a outros sistemas hidráulicos.'],

{i:'E041',t:'me',e:'equipamentos',s:'Mangotinho',d:1,

 g:2,

     'O esguicho regulável é a peça de ponta que modela o jato.',
     'CORRETA — mangotinho, semirrígido em carretel.',
     'O derivante divide o fluxo da linha em várias saídas.',
     'O tampão veda saídas não utilizadas do sistema.'],
 p:'A expressão "semirrígida" é a chave: é ela que permite operar sem estender a linha por completo.',
 m:'Semirrígido + carretel = mangotinho.'},

{i:'E042',t:'me',e:'equipamentos',s:'Esguichos',d:2,
 x:'O esguicho que permite ao operador selecionar entre jato sólido, jato em neblina ou o fechamento do fluxo é o:',

 g:1,

     'CORRETA — regulável ou universal.',
     'O derivante divide o fluxo; não modela o jato.',
     'A redução adapta diâmetros; não modela o jato.',
     'O coletor reúne linhas; não modela o jato.'],

 m:'Regulável = sólido, neblina e fecha.'},

{i:'E043',t:'me',e:'equipamentos',s:'Inspeção',d:2,

      'Lacre rompido',

      'Mangueira do extintor obstruída'],

     'Lacre rompido sugere acionamento anterior ou violação.',
     'CORRETA — os três indicadores de aptidão.',
     'A sinalização encoberta compromete a localização em emergência.',
     'Mangueira obstruída impede a saída do agente.'],
 p:'Quatro alternativas descrevem defeitos. Identificado o padrão, a correta se destaca por ser a única afirmativa positiva.',
 m:'Verde, lacrado, na validade.'},

{i:'E044',t:'me',e:'equipamentos',s:'Hidrantes',d:2,

      'São exclusivos para incêndios de classe C',
      'Substituem o uso de mangueiras e esguichos'],
 g:1,
 j:'Os hidrantes são tomadas de água pressurizada da rede de combate, de coluna (externos, na via) ou de parede (abrigos internos). Fornecem grande vazão para o combate prolongado, operando com mangueiras e esguichos.',
 ja:['Hidrante não é abrigo de extintor — é tomada de água.',
     'CORRETA — coluna ou parede, água pressurizada.',
     'A pressurização é a característica central do sistema.',
     'Fornecem água, agente justamente PROIBIDO na classe C.',
     'Operam EM CONJUNTO com mangueiras e esguichos, sem substituí-los.'],
 p:'A alternativa D é a mais traiçoeira: além de inventar exclusividade, escolhe a classe em que a água é vedada.',
 m:'Hidrante = água pressurizada, coluna ou parede.'},

{i:'E045',t:'me',e:'equipamentos',s:'Extintores',d:2,
 x:'A sequência correta de operação de um extintor portátil, conforme o método PASS, é:',

 ja:['Inverte a ordem: não se aponta antes de retirar o pino.',

     'Ordem invertida e alvo errado (topo em vez de base).',
     'Sequência completamente invertida.',
     'A ordem está certa, mas o alvo (topo) e o posicionamento (contra o vento) estão errados.'],

{i:'E046',t:'me',e:'equipamentos',s:'Acessórios',d:2,

     'Inverte redução e tampão.'],

{i:'E047',t:'me',e:'equipamentos',s:'Esguichos',d:3,

      'Reduz o consumo de água a valores desprezíveis',
      'Atua por quebra da reação em cadeia'],

     'A modalidade do jato não altera a condutividade da água: permanece vedada em classe C.',

 m:'Neblina: resfria mais e protege quem avança.'},

{i:'E048',t:'me',e:'equipamentos',s:'Mangueiras',d:3,

      'A utilização de esguicho regulável em vez de agulheta',
      'O acondicionamento aduchado da mangueira antes do lançamento',
      'A presença de tampão nas saídas não utilizadas do hidrante'],

{i:'P006',t:'ce',e:'protecao',s:'EPI',d:2,

</defs></svg>`; }

/* ---------------------------------------------------------------- FOGO ---
   Chama viva multicamada. i = semente (varia o ritmo), s = escala.
------------------------------------------------------------------------- */
function svgChama(s=1,i=0){
  const d=[2.1,2.6,1.8,3.0,2.35][i%5], a=[0,-.35,-.7,-.18,-.52][i%5];
  return `<g class="chama" style="--dur:${d}s;--del:${a}s" transform="scale(${s})">
    <ellipse class="ch-halo" cx="0" cy="-18" rx="42" ry="40" fill="url(#gHalo)"/>
    <use href="#pChama" class="ch-ext" fill="url(#gChama)" transform="scale(1.28)" opacity=".78"/>
    <use href="#pChama" class="ch-med" fill="url(#gChama)"/>
    <use href="#pChamaFina" class="ch-int" fill="url(#gChamaNucleo)" filter="url(#fBloomS)"/>
    <ellipse class="ch-base" cx="1" cy="-3" rx="9" ry="4.5" fill="${ART.brasa1}" opacity=".55" filter="url(#fBloomS)"/>
  </g>`;
}

/* Fileira de chamas ao longo de uma largura ------------------------------ */
function svgFogoLinha(larg,n=5,esc=1){
  let o='';
  for(let k=0;k<n;k++){
    const x=(larg/(n+1))*(k+1)+((k*37)%11)-5;
    const e=esc*(.72+((k*29)%7)/10);
    o+=`<g transform="translate(${x.toFixed(1)},0)">${svgChama(e,k)}</g>`;
  }
  return o;
}

/* --------------------------------------------------------------- FUMAÇA --
   Colunas volumétricas ascendentes.
------------------------------------------------------------------------- */
function svgFumaca(larg,alt,n=4,op=1){
  let o='';
  for(let k=0;k<n;k++){
    const x=(larg/(n+1))*(k+1), r=alt*(.20+((k*23)%9)/28), d=9+((k*31)%8);
    o+=`<g class="fum" style="--dur:${d}s;--del:${-k*2.3}s;--op:${(.5*op).toFixed(2)}">
      <ellipse cx="${x}" cy="${alt*.5}" rx="${r*1.5}" ry="${r}" fill="url(#gFumaca)"/>
      <ellipse cx="${x+r*.4}" cy="${alt*.3}" rx="${r*1.1}" ry="${r*.8}" fill="url(#gFumaca)" opacity=".7"/>
    </g>`;
  }
  return o;
}

/* --------------------------------------------------------------- BRASAS --
   Partículas incandescentes que sobem e se apagam.
------------------------------------------------------------------------- */
function svgBrasas(larg,alt,n=22){
  let o='';
  for(let k=0;k<n;k++){
    const x=((k*137.5)%larg), r=.9+((k*17)%9)/7,
          d=(3.4+((k*13)%22)/6).toFixed(1), del=(-(k*.47)).toFixed(2),
          dx=(((k*53)%40)-20), c=k%3?ART.brasa2:ART.brasa3;
    o+=`<circle class="brasa" cx="${x.toFixed(0)}" cy="${alt}" r="${r.toFixed(1)}"
        fill="${c}" style="--dur:${d}s;--del:${del}s;--dx:${dx}px;--sub:${-alt*.92}px"/>`;
  }
  return o;
}

/* -------------------------------------------------- FEIXES DE LUZ -------- */
function svgFeixes(larg,alt){
  return `<g opacity=".5">
    <path d="M${larg*.18} 0 L${larg*.34} 0 L${larg*.52} ${alt} L${larg*.24} ${alt} Z" fill="url(#gLuz)"/>
    <path d="M${larg*.62} 0 L${larg*.72} 0 L${larg*.86} ${alt} L${larg*.66} ${alt} Z" fill="url(#gLuz)" opacity=".6"/>
  </g>`;
}

   Silhueta com sete slots de EPI + mochila de EPR.
------------------------------------------------------------------------- */
function svgCombatente(vestidos={}, opts={}){
  const on=k=>vestidos[k]?1:0, base='#1e2731', vazio='#161d26';
  const slot=(k,d,cor)=>`<path d="${d}" fill="${on(k)?cor:vazio}"

/* ------------------------------------------------------- TETRAEDRO ------- */
function svgTetraedro(destaque=null, w=260){
  const V={ topo:[130,26], esq:[30,150], dir:[230,150], frente:[130,116] };
  const cores={ combustivel:'#c98a3d', comburente:'#4aa3ff', calor:'#ff6b1a', reacao:'#22c07a' };
  const face=(a,b,c,op)=>`<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]} L${c[0]} ${c[1]} Z"
      fill="#1b2836" opacity="${op}" stroke="#39434f" stroke-width="1.4"/>`;
  const vert=(p,id,lab)=>{
    const on=destaque===id, c=cores[id];
    return `<g class="tv ${on?'tv-on':''}" data-v="${id}">
      <circle cx="${p[0]}" cy="${p[1]}" r="${on?15:11}" fill="${c}" opacity="${on?1:.5}"/>
      <circle cx="${p[0]}" cy="${p[1]}" r="${on?24:0}" fill="${c}" opacity=".2"/>
      <text x="${p[0]}" y="${p[1]+(p[1]<80?-24:34)}" text-anchor="middle" fill="${on?c:'#8b98a6'}"
        font-family="monospace" font-size="12" letter-spacing="1">${lab}</text></g>`;
  };
  /* viewBox com folga: os rótulos "COMBUSTÍVEL" e "COMBURENTE" ultrapassam a
     base do sólido pelos dois lados, e "CALOR" sobe acima do vértice do topo.
     Sem esta margem, o desenho aparece cortado nas laterais e em cima. */
  return `<svg viewBox="-22 -20 304 220" width="${w}" class="art art-tetra">
    ${face(V.topo,V.esq,V.dir,.35)}
    ${face(V.topo,V.esq,V.frente,.6)}
    ${face(V.topo,V.dir,V.frente,.5)}
    ${face(V.esq,V.dir,V.frente,.7)}
    <g stroke="#48566a" stroke-width="1.6" opacity=".8">
      <path d="M130 26 L30 150 M130 26 L230 150 M30 150 L230 150
               M130 26 L130 116 M30 150 L130 116 M230 150 L130 116"/>
    </g>
    ${vert(V.topo,'calor','CALOR')}
    ${vert(V.esq,'combustivel','COMBUSTÍVEL')}
    ${vert(V.dir,'comburente','COMBURENTE')}
    ${vert(V.frente,'reacao','REAÇÃO EM CADEIA')}
  </svg>`;
}

/* ===== src/audio.js ===== */
/* ==========================================================================
   OPERAÇÃO 01 — COMBATE A INCÊNDIO
   src/audio.js — Sound design procedural (Web Audio API)
   --------------------------------------------------------------------------
   Todo o áudio é SINTETIZADO em tempo real: nenhum arquivo externo, nenhum
   download, funcionamento integral offline. Cada efeito é construído a partir
   de osciladores e de ruído filtrado, com envelope próprio.

   Catálogo:
     interface  clique · navegar · abrir · fechar
     resposta   acerto · erro · combo
     progressão nivel · medalha · desbloqueio · missaoOk · missaoFalha
     operação   fogo · agua · espuma · co2 · extintor · radio · sirene
     ambiente   leito operacional contínuo (loop de baixo volume)
   ========================================================================== */

const Audio01 = (()=>{
  let ctx = null, master = null, amb = null, ligado = true;

  function iniciar(){
    if(ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.34;
    master.connect(ctx.destination);
    return ctx;
  }
  function ok(){
    if(!ligado) return false;
    if(!ctx) iniciar();
    if(!ctx) return false;
    if(ctx.state === 'suspended') ctx.resume();
    return true;
  }
  const T = ()=>ctx.currentTime;

  /* ---------------------------------------------------- primitivas ---- */
  function tom(freq, dur, tipo='sine', vol=.3, atk=.006, dest=null){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(0, T());
    g.gain.linearRampToValueAtTime(vol, T()+atk);
    g.gain.exponentialRampToValueAtTime(.0001, T()+dur);
    o.connect(g); g.connect(dest||master);
    o.start(); o.stop(T()+dur+.02);
    return {o, g};
  }
  function varredura(f1, f2, dur, tipo='sine', vol=.3, dest=null){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo;
    o.frequency.setValueAtTime(f1, T());
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), T()+dur);
    g.gain.setValueAtTime(0, T());
    g.gain.linearRampToValueAtTime(vol, T()+.01);
    g.gain.exponentialRampToValueAtTime(.0001, T()+dur);
    o.connect(g); g.connect(dest||master);
    o.start(); o.stop(T()+dur+.02);
  }
  /* buffer de ruído reaproveitado */
  let bufRuido = null;
  function ruidoBuffer(){
    if(bufRuido) return bufRuido;
    const n = ctx.sampleRate * 2;
    bufRuido = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = bufRuido.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    return bufRuido;
  }
  function ruido(dur, {tipo='bandpass', freq=1200, q=1, vol=.2, atk=.01, loop=false, dest=null}={}){
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = ruidoBuffer(); s.loop = true;
    f.type = tipo; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0, T());
    g.gain.linearRampToValueAtTime(vol, T()+atk);
    if(!loop) g.gain.exponentialRampToValueAtTime(.0001, T()+dur);
    s.connect(f); f.connect(g); g.connect(dest||master);
    s.start();
    if(!loop) s.stop(T()+dur+.05);
    return {s, f, g};
  }

  /* ------------------------------------------------------ catálogo ---- */
  const EFEITOS = {

    /* --- interface --- */
    clique(){ tom(880, .05, 'square', .1); tom(1320, .04, 'sine', .07); },
    navegar(){ tom(560, .07, 'triangle', .11); },
    abrir(){ varredura(320, 760, .17, 'sine', .13); },
    fechar(){ varredura(700, 280, .15, 'sine', .11); },
    hover(){ tom(1180, .028, 'sine', .045); },

    /* --- resposta --- */
    acerto(){
      [784, 1047, 1319].forEach((f,k)=>
        setTimeout(()=>tom(f, .2, 'sine', .17), k*52));
      ruido(.12, {freq:3200, q:2, vol:.05});
    },
    erro(){
      varredura(300, 128, .34, 'sawtooth', .13);
      tom(148, .28, 'square', .08);
    },
    combo(n){
      const base = 660 + Math.min(9, n) * 62;
      tom(base, .11, 'triangle', .15);
      setTimeout(()=>tom(base*1.5, .13, 'sine', .12), 58);
    },

    /* --- progressão --- */
    nivel(){
      [523,659,784,1047,1319].forEach((f,k)=>
        setTimeout(()=>{ tom(f,.42,'sine',.19); tom(f*2,.28,'triangle',.07); }, k*98));
      setTimeout(()=>ruido(.7,{tipo:'highpass',freq:2400,vol:.05}), 120);
    },
    medalha(){
      [1047,1319,1568].forEach((f,k)=>setTimeout(()=>tom(f,.5,'sine',.16), k*88));
      setTimeout(()=>tom(2093,.7,'sine',.07), 270);
    },
    desbloqueio(){
      varredura(180, 900, .3, 'sawtooth', .1);
      setTimeout(()=>{ tom(1047,.26,'sine',.15); tom(1568,.3,'sine',.09); }, 150);
    },
    missaoOk(){
      [523,659,784].forEach((f,k)=>setTimeout(()=>tom(f,.5,'sine',.18), k*118));
      setTimeout(()=>EFEITOS.radio(), 520);
    },
    missaoFalha(){
      varredura(420, 180, .55, 'triangle', .14);
      setTimeout(()=>tom(196,.5,'sine',.1), 180);
    },

    /* --- operação --- */
    fogo(dur=1.5){
      ruido(dur, {tipo:'lowpass', freq:760, q:.7, vol:.1, atk:.16});
      ruido(dur*.7, {tipo:'bandpass', freq:210, q:.5, vol:.07, atk:.2});
    },
    agua(dur=1.1){
      ruido(dur, {tipo:'highpass', freq:1700, q:.7, vol:.13, atk:.03});
      ruido(dur, {tipo:'bandpass', freq:3400, q:1.4, vol:.06, atk:.05});
    },
    espuma(dur=1.2){
      ruido(dur, {tipo:'bandpass', freq:900, q:.6, vol:.1, atk:.1});
      for(let k=0;k<9;k++) setTimeout(()=>tom(1400+Math.random()*1800, .035, 'sine', .028), k*95);
    },
    co2(dur=1.3){
      ruido(dur, {tipo:'highpass', freq:2600, q:.5, vol:.14, atk:.02});
      varredura(240, 90, dur*.55, 'sine', .05);
    },
    extintor(){
      tom(1500, .04, 'square', .1);                 // trava do pino
      setTimeout(()=>EFEITOS.co2(.9), 130);
    },
    radio(){
      ruido(.09, {tipo:'bandpass', freq:1900, q:5, vol:.09});
      setTimeout(()=>{ tom(1240,.05,'square',.06); tom(980,.05,'square',.05); }, 95);
      setTimeout(()=>ruido(.07,{tipo:'bandpass',freq:1600,q:5,vol:.06}), 175);
    },
    sirene(dur=1.7){
      const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(),
            lg = ctx.createGain();
      o.type='sawtooth'; o.frequency.value=620;
      lfo.type='sine'; lfo.frequency.value=1.5; lg.gain.value=220;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0,T());
      g.gain.linearRampToValueAtTime(.07,T()+.16);
      g.gain.setValueAtTime(.07,T()+dur-.3);
      g.gain.exponentialRampToValueAtTime(.0001,T()+dur);
      o.connect(g); g.connect(master);
      o.start(); lfo.start(); o.stop(T()+dur); lfo.stop(T()+dur);
    },
    alarmeEPR(){
      for(let k=0;k<4;k++) setTimeout(()=>tom(2400,.1,'square',.09), k*190);
    }
  };

  /* ------------------------------------------- leito ambiente (loop) --- */
  function ambienteLigar(){
    if(!ok() || amb) return;
    const g = ctx.createGain(); g.gain.value = 0; g.connect(master);
    const a = ruido(0, {tipo:'lowpass', freq:340, q:.6, vol:.055, atk:2.4, loop:true, dest:g});
    const b = ruido(0, {tipo:'bandpass', freq:120, q:.4, vol:.035, atk:3.2, loop:true, dest:g});
    g.gain.linearRampToValueAtTime(1, T()+3);
    /* respiração lenta do leito, como brasa distante */
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.type='sine'; lfo.frequency.value=.055; lg.gain.value=140;
    lfo.connect(lg); lg.connect(a.f.frequency); lfo.start();
    amb = {g, a, b, lfo};
  }
  function ambienteDesligar(){
    if(!amb) return;
    amb.g.gain.linearRampToValueAtTime(0, T()+1.1);
    const x = amb; amb = null;
    setTimeout(()=>{ try{ x.a.s.stop(); x.b.s.stop(); x.lfo.stop(); }catch(e){} }, 1400);
  }

  /* ------------------------------------------------------- interface -- */
  return {
    tocar(nome, arg){
      if(!ok()) return;
      try{ const f = EFEITOS[nome]; if(f) f(arg); }catch(e){}
    },
    ambiente(v){ if(v) ambienteLigar(); else ambienteDesligar(); },
    ligado(){ return ligado; },
    alternar(){
      ligado = !ligado;
      if(!ligado) ambienteDesligar();
      return ligado;
    },
    definir(v){ ligado = v; if(!v) ambienteDesligar(); },
    iniciar
  };
})();


/* ===== src/engine.js ===== */
/* ==========================================================================
   OPERAÇÃO 01 — COMBATE A INCÊNDIO
   src/engine.js — Estado, progressão, gamificação, IA de revisão e persistência
   --------------------------------------------------------------------------
   Sem dependências. Salva em localStorage. Funciona offline.
   ========================================================================== */

const CHAVE = 'op01.incendio.v1';
const QUESTOES = [].concat(Q_TEORIA, Q_CLASSES, Q_METODOS, Q_AGENTES,
                          Q_EQUIPAMENTOS, Q_PROTECAO);
const Q_POR_ID = Object.fromEntries(QUESTOES.map(q => [q.i, q]));

/* ------------------------------------------------------------- ESTADO --- */
function estadoNovo(){
  return {
    v:1, criado:Date.now(), visto:Date.now(),
    xp:0, patente:0,
    streakDias:0, ultimoDia:null, melhorStreak:0,
    combo:0, melhorCombo:0,
    missoes:{},              // id » {status,melhorPct,tentativas,concluidoEm}
    q:{},                    // id » {n,ac,er,fac,inter,prox,ult,tempo}
    dominio:{},              // subassunto » {n,ac,tempo}
    erros:[],                // caderno de erros (ids, mais recente primeiro)
    medalhas:{},             // id » timestamp
    diario:{data:null,feitos:0,meta:12,concluido:false},
    semanal:{semana:null,feitos:0,meta:60,concluido:false},
    hist:[],                 // sessões: {d,acertos,total,xp,eixo}
    tempoTotal:0, respondidas:0, acertosTotais:0,
    audio:true
  };
}
let S = estadoNovo();

function carregar(){
  try{
    const b = localStorage.getItem(CHAVE);
    if(b){ const o = JSON.parse(b); if(o && o.v===1) S = Object.assign(estadoNovo(), o); }
  }catch(e){ /* armazenamento indisponível — segue em memória */ }
  checarDia();
}
let salvarPendente = null;
function salvar(){
  clearTimeout(salvarPendente);
  salvarPendente = setTimeout(()=>{
    try{ S.visto = Date.now(); localStorage.setItem(CHAVE, JSON.stringify(S)); }catch(e){}
  }, 220);
}
function zerarProgresso(){
  S = estadoNovo();
  try{ localStorage.removeItem(CHAVE); }catch(e){}
  salvar();
}

/* --------------------------------------------------- DATAS E DESAFIOS --- */
const DIA = 864e5;
function hojeStr(){ const d=new Date(); return d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function semanaStr(){
  const d=new Date(), i=new Date(d.getFullYear(),0,1);
  return d.getFullYear()+'-S'+Math.ceil((((d-i)/DIA)+i.getDay()+1)/7);
}
function checarDia(){
  const h = hojeStr();
  if(S.diario.data !== h){ S.diario = {data:h, feitos:0, meta:12, concluido:false}; }
  if(S.semanal.semana !== semanaStr()){ S.semanal = {semana:semanaStr(), feitos:0, meta:60, concluido:false}; }
  if(S.ultimoDia){
    const dif = Math.round((new Date(h) - new Date(S.ultimoDia)) / DIA);
    if(dif >= 2) S.streakDias = 0;      // quebrou a sequência
  }
}
function marcarDia(){
  const h = hojeStr();
  if(S.ultimoDia !== h){
    const dif = S.ultimoDia ? Math.round((new Date(h) - new Date(S.ultimoDia)) / DIA) : 99;
    S.streakDias = (dif === 1) ? S.streakDias + 1 : 1;
    S.ultimoDia = h;
    S.melhorStreak = Math.max(S.melhorStreak, S.streakDias);
  }
}

/* ---------------------------------------------------------- PROGRESSÃO -- */
function patenteDe(xp){
  let p = 0;
  CONTEUDO.patentes.forEach((t,k)=>{ if(xp >= t.xp) p = k; });
  return p;
}
function patenteAtual(){ return CONTEUDO.patentes[S.patente]; }
function proximaPatente(){ return CONTEUDO.patentes[S.patente+1] || null; }
function progressoPatente(){
  const a = CONTEUDO.patentes[S.patente], b = proximaPatente();
  if(!b) return {pct:100, falta:0, atual:a, prox:null};
  const faixa = b.xp - a.xp, feito = S.xp - a.xp;
  return {pct: Math.max(0, Math.min(100, (feito/faixa)*100)), falta: b.xp - S.xp, atual:a, prox:b};
}
/* devolve {subiu, de, para} */
function darXP(n){
  const antes = S.patente;
  S.xp = Math.max(0, S.xp + Math.round(n));
  S.patente = patenteDe(S.xp);
  salvar();
  return S.patente > antes
    ? {subiu:true, de:CONTEUDO.patentes[antes], para:patenteAtual()}
    : {subiu:false};
}

/* ------------------------------------------------ REGISTRO DE RESPOSTA --
   Núcleo da IA de aprendizagem: repetição espaçada (SM-2 adaptado) por item
   + mapa de domínio por subassunto.
------------------------------------------------------------------------- */
function registrar(idQ, acertou, ms){
  const q = Q_POR_ID[idQ]; if(!q) return {xp:0};
  const agora = Date.now();
  const r = S.q[idQ] || (S.q[idQ] = {n:0, ac:0, er:0, fac:2.5, inter:0, prox:0, ult:0, tempo:0});

  r.n++; r.ult = agora;
  r.tempo = r.tempo ? Math.round((r.tempo*(r.n-1) + ms)/r.n) : ms;
  if(acertou) r.ac++; else r.er++;

  /* --- repetição espaçada -------------------------------------------- */
  const rapido = ms < 22000;
  const q5 = acertou ? (rapido ? 5 : 4) : (r.er > 2 ? 1 : 2);   // qualidade 0-5
  r.fac = Math.max(1.3, r.fac + (0.1 - (5-q5)*(0.08 + (5-q5)*0.02)));
  if(!acertou){ r.inter = 1; }
  else { r.inter = r.inter === 0 ? 1 : (r.inter === 1 ? 3 : Math.round(r.inter * r.fac)); }
  r.prox = agora + r.inter * DIA;

  /* --- mapa de domínio ------------------------------------------------ */
  const d = S.dominio[q.s] || (S.dominio[q.s] = {n:0, ac:0, tempo:0});
  d.n++; if(acertou) d.ac++;
  d.tempo = d.tempo ? Math.round((d.tempo*(d.n-1) + ms)/d.n) : ms;

  /* --- caderno de erros ----------------------------------------------- */
  const iErro = S.erros.indexOf(idQ);
  if(!acertou){
    if(iErro >= 0) S.erros.splice(iErro,1);
    S.erros.unshift(idQ);
    if(S.erros.length > 140) S.erros.pop();
  } else if(iErro >= 0 && r.ac >= 2 && r.inter >= 3){
    S.erros.splice(iErro,1);       // dominada: sai do caderno
  }

  /* --- combo e contadores --------------------------------------------- */
  if(acertou){ S.combo++; S.melhorCombo = Math.max(S.melhorCombo, S.combo); S.acertosTotais++; }
  else S.combo = 0;
  S.respondidas++; S.tempoTotal += ms;
  S.diario.feitos++; S.semanal.feitos++;
  marcarDia();

  /* --- XP com multiplicadores ----------------------------------------- */
  let xp = 0;
  if(acertou){
    xp = 10 + (q.d - 1) * 5;                    // 10 · 15 · 20 por dificuldade
    if(q.t === 'me') xp += 4;                    // múltipla escolha vale mais
    xp = Math.round(xp * multiplicador());
    if(rapido) xp += 3;
    if(iErro >= 0) xp += 6;                      // recuperou item do caderno
  } else {
    xp = 2;                                      // errar também ensina
  }
  const nivel = darXP(xp);
  salvar();
  return {xp, nivel, mult:multiplicador(), saiuDoCaderno: acertou && iErro>=0};
}
function multiplicador(){
  if(S.combo >= 20) return 2.0;
  if(S.combo >= 12) return 1.7;
  if(S.combo >= 7)  return 1.4;
  if(S.combo >= 3)  return 1.2;
  return 1.0;
}

/* ============================ IA DE APRENDIZAGEM ========================
   Pontua cada questão e escolhe as mais úteis ao aluno agora.
   Prioridade: vencidas na revisão > assuntos críticos > inéditas > demais.
========================================================================= */
function pontuar(q, agora){
  const r = S.q[q.i];
  let p = 50;
  if(!r){ p += 34; }                                   // inédita: alto valor
  else{
    if(r.prox && agora >= r.prox) p += 60 + Math.min(40, (agora-r.prox)/DIA*6); // vencida
    else p -= 30;                                       // ainda "fresca"
    const tx = r.ac / Math.max(1, r.n);
    p += (1 - tx) * 55;                                 // erra muito » sobe
    if(r.er > 0) p += 12 * Math.min(3, r.er);
    if(r.n > 4 && tx > .85) p -= 26;                    // dominada » desce
  }
  const d = S.dominio[q.s];
  if(d && d.n >= 3){
    const tx = d.ac / d.n;
    if(tx < .6) p += 30; else if(tx < .75) p += 14; else if(tx > .9) p -= 16;
  }
  if(S.erros.includes(q.i)) p += 36;
  return p + Math.random() * 14;                        // desempate suave
}
/* filtro: {eixo, sub, tipo, dif, somenteErros, somenteVencidas} */
function selecionar(n, filtro = {}){
  const agora = Date.now();
  let pool = QUESTOES.filter(q=>{
    if(filtro.eixo && q.e !== filtro.eixo) return false;
    if(filtro.eixos && !filtro.eixos.includes(q.e)) return false;
    if(filtro.sub && q.s !== filtro.sub) return false;
    if(filtro.tipo && q.t !== filtro.tipo) return false;
    if(filtro.dif && q.d < filtro.dif) return false;
    if(filtro.somenteErros && !S.erros.includes(q.i)) return false;
    if(filtro.somenteVencidas){ const r=S.q[q.i]; if(!r || !r.prox || agora < r.prox) return false; }
    if(filtro.excluir && filtro.excluir.includes(q.i)) return false;
    return true;
  });
  if(!pool.length) return [];
  pool = pool.map(q=>({q, p:pontuar(q, agora)})).sort((a,b)=>b.p-a.p);

  /* mantém a proporção da banca: 80% Certo/Errado, 20% múltipla escolha */
  if(!filtro.tipo && n >= 5){
    const nMe = Math.max(1, Math.round(n * 0.2));
    const ce = pool.filter(o=>o.q.t==='ce').slice(0, n-nMe).map(o=>o.q);
    const me = pool.filter(o=>o.q.t==='me').slice(0, nMe).map(o=>o.q);
    const mix = ce.concat(me);
    if(mix.length >= n) return embaralhar(mix).slice(0, n);
  }
  return pool.slice(0, n).map(o=>o.q);
}
function embaralhar(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

/* --------------------------------------------------- DIAGNÓSTICO ------- */
function dominioLista(){
  return Object.entries(S.dominio)
    .map(([sub,d])=>({sub, n:d.n, pct: Math.round(d.ac/d.n*100), tempo:d.tempo,
      eixo:(QUESTOES.find(q=>q.s===sub)||{}).e}))
    .sort((a,b)=>a.pct-b.pct);
}
function assuntosCriticos(k=4){
  return dominioLista().filter(d=>d.n>=3 && d.pct<70).slice(0,k);
}
function assuntosDominados(k=4){
  return dominioLista().filter(d=>d.n>=3 && d.pct>=85).reverse().slice(0,k);
}
function vencidasCount(){
  const a=Date.now();
  return QUESTOES.filter(q=>{ const r=S.q[q.i]; return r && r.prox && a>=r.prox; }).length;
}
/* próxima missão da trilha ainda não concluída e já liberada */
function proximaMissao(){
  return MISSOES.find(m=>!m.especial && missaoLiberada(m) && missaoEstado(m.id).status!=='ok')
      || MISSOES.find(m=>missaoLiberada(m) && missaoEstado(m.id).status!=='ok')
      || null;
}
/* Toda recomendação devolve uma ação executável — nunca "fique onde está". */
function recomendacao(){
  const crit = assuntosCriticos(1)[0], venc = vencidasCount(), err = S.erros.length;
  if(err >= 6)  return {tipo:'caderno', txt:`Você tem ${err} itens no caderno de erros. Revise antes de avançar.`, acao:'caderno'};
  if(venc >= 8) return {tipo:'revisao', txt:`${venc} questões entraram na janela de revisão espaçada.`, acao:'revisao'};
  if(crit)      return {tipo:'critico', txt:`"${crit.sub}" está em ${crit.pct}% de acerto. É o seu ponto crítico — a revisão vai priorizá-lo.`, acao:'revisao', sub:crit.sub};
  const prox = proximaMissao();
  if(prox && S.respondidas < 20)
    return {tipo:'inicio', txt:`Comece por "${prox.n}" para mapear o seu domínio.`, acao:'missao', alvo:prox.id};
  if(prox)
    return {tipo:'trilha', txt:`Próxima etapa da trilha: "${prox.n}".`, acao:'missao', alvo:prox.id};
  return {tipo:'ok', txt:'Trilha concluída. Mantenha a revisão espaçada em dia.', acao:'revisao'};
}
function taxaGeral(){ return S.respondidas ? Math.round(S.acertosTotais/S.respondidas*100) : 0; }
function tempoMedio(){ return S.respondidas ? Math.round(S.tempoTotal/S.respondidas/1000) : 0; }

  {id:'cem', n:'Centena', d:'100 questões respondidas', ic:'livro', cor:'#c2ccd6',
   t:()=>S.respondidas>=100},
  {id:'trezentas', n:'Banco Vencido', d:'300 questões respondidas', ic:'livro', cor:'#ffb020',
   t:()=>S.respondidas>=300},
  {id:'limpou', n:'Caderno Limpo', d:'Zerar o caderno de erros com 25+ itens já registrados',
   ic:'alvo', cor:'#3fd189',
   t:()=>S.erros.length===0 && S.respondidas>=40},
  {id:'simulado', n:'Prova de Fogo', d:'70%+ no simulado completo', ic:'escudo', cor:'#ff6b1a',
   t:()=>(S.missoes['simulado']||{}).melhorPct>=70},
  {id:'epr', n:'Ar Autônomo', d:'Montar o EPR sem erro', ic:'cilindro', cor:'#4aa3ff',
   t:()=>(S.missoes['m-epr']||{}).melhorPct===100},
  {id:'elite', n:'Elite Operacional', d:'Atingir a última patente', ic:'estrela', cor:'#ffd166',
   t:()=>S.patente>=7}
];
function eixoPct(e){
  const subs = QUESTOES.filter(q=>q.e===e).map(q=>q.s);
  let n=0, ac=0;
  Object.entries(S.dominio).forEach(([s,d])=>{ if(subs.includes(s)){ n+=d.n; ac+=d.ac; } });
  return n>=6 ? Math.round(ac/n*100) : 0;
}
/* devolve as medalhas conquistadas agora */
function checarMedalhas(){
  const novas = [];
  MEDALHAS.forEach(m=>{
    if(!S.medalhas[m.id] && m.t()){ S.medalhas[m.id] = Date.now(); novas.push(m); }
  });
  if(novas.length) salvar();
  return novas;
}

/* ------------------------------------------------------------- MISSÕES -- */
function missaoEstado(id){ return S.missoes[id] || {status:'novo', melhorPct:0, tentativas:0}; }
function missaoLiberada(m){
  if(m.patente !== undefined && S.patente < m.patente) return false;
  if(m.requer && missaoEstado(m.requer).status !== 'ok') return false;
  return true;
}
function concluirMissao(id, pct){
  const e = missaoEstado(id);
  e.tentativas++;
  e.melhorPct = Math.max(e.melhorPct, pct);
  if(pct >= 70){ if(e.status !== 'ok') e.concluidoEm = Date.now(); e.status = 'ok'; }
  else if(e.status !== 'ok') e.status = 'parcial';
  S.missoes[id] = e;
  salvar();
  return e;
}
function registrarSessao(acertos, total, xp, eixo){
  S.hist.unshift({d:Date.now(), acertos, total, xp, eixo});
  if(S.hist.length > 60) S.hist.pop();
  if(S.diario.feitos >= S.diario.meta && !S.diario.concluido){
    S.diario.concluido = true; darXP(80);
  }
  if(S.semanal.feitos >= S.semanal.meta && !S.semanal.concluido){
    S.semanal.concluido = true; darXP(260);
  }
  salvar();
}

/* ------------------------------------------------------------ UTILIDADES */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const som = (n,a)=>Audio01.tocar(n,a);

function aviso(txt, tipo='', icone='check'){
  const c = $('#avisos'); if(!c) return;
  const d = document.createElement('div');
  d.className = 'aviso ' + tipo;
  d.innerHTML = ic(icone) + '<span>' + txt + '</span>';
  c.appendChild(d);
  setTimeout(()=>{ d.classList.add('saindo'); setTimeout(()=>d.remove(), 360); }, 2900);
}
function cortina(){
  const c = $('#cortina'); if(!c) return;
  c.classList.remove('ativa'); void c.offsetWidth; c.classList.add('ativa');
}
function comboHUD(){
  const c = $('#combo'); if(!c) return;
  if(S.combo >= 3){
    c.classList.add('on');
    c.innerHTML = `<div class="n">×${multiplicador().toFixed(1)}</div>
                   <div class="l">combo ${S.combo}</div>`;

}
function fmtTempo(s){
  const m = Math.floor(s/60), r = s%60;
  return m + ':' + String(r).padStart(2,'0');
}

let TELA = 'hub', PARAM = null, M = null;   // M = missão em curso

      </div>
      <hr class="sep" style="margin:16px 0">
      <div class="grade g4">
        ${metrica(S.xp.toLocaleString('pt-BR'), 'XP acumulado', 'xp', true)}
        ${metrica(taxaGeral()+'%', 'taxa de acerto', 'alvo')}
        ${metrica(S.erros.length, 'no caderno de erros', 'livro')}
        ${metrica(vencidasCount(), 'aguardando revisão', 'relogio')}
      </div>
      ${pg.prox ? `<div style="margin-top:16px">
        <div class="flex entre small" style="margin-bottom:6px">

function metrica(v,l,i,d){
  return `<div class="metrica ${d?'destaque':''}">${ic(i)}

}
function atalho(t,s,i,ac){

}
function desafiosCard(){
  const d = S.diario, w = S.semanal;
  const bar = (f,m)=>`<div class="barra fina"><i style="width:${Math.min(100,f/m*100)}%"></i></div>`;
