    <div class="painel compacto">
      <div class="flex entre"><span class="kick sl">${ic('relogio')} Desafio diário</span>
        ${d.concluido?'<span class="tag ok">+80 XP</span>':`<span class="tag">${d.feitos}/${d.meta}</span>`}</div>
      <div style="margin-top:9px">${bar(d.feitos,d.meta)}</div>
      <div class="small muted" style="margin-top:7px">Responder ${d.meta} questões hoje.</div>
    </div>
    <div class="painel compacto">
      <div class="flex entre"><span class="kick sl">${ic('escudo')} Desafio semanal</span>
        ${w.concluido?'<span class="tag ok">+260 XP</span>':`<span class="tag">${w.feitos}/${w.meta}</span>`}</div>
      <div style="margin-top:9px">${bar(w.feitos,w.meta)}</div>
      <div class="small muted" style="margin-top:7px">Responder ${w.meta} questões nesta semana.</div>
    </div></div>`;
}
function cardMissao(m){
  const e = missaoEstado(m.id), lib = missaoLiberada(m);
  const cls = !lib ? 'bloqueada' : (e.status==='ok' ? 'concluida' : '');
  const selo = !lib ? ic('cadeado') : (e.status==='ok' ? ic('check') : ic('seta'));
  let req = '';
  if(!lib){
    req = m.patente !== undefined && S.patente < m.patente
      ? 'Requer ' + CONTEUDO.patentes[m.patente].n
      : 'Conclua ' + (MISSOES.find(x=>x.id===m.requer)||{n:'a missão anterior'}).n;
  }
  const nQ = m.cfg.rodadas ? m.cfg.rodadas.length : (m.cfg.n || (m.cfg.itens?m.cfg.itens.length:0)
             || (m.cfg.lista?m.cfg.lista.length:0));
  return `<article class="missao ${cls}" ${lib?`onclick="irPara('briefing','${m.id}')"`:''}>
    <div class="selo">${selo}</div>
    <div class="capa">${cena(m.cena)}</div>
    <div class="corpo">
      <span class="num">${String(MISSOES.indexOf(m)+1).padStart(2,'0')}</span>
      <h3>${esc(m.n)}</h3>
      <div class="desc">${esc(lib ? m.desc : req)}</div>
      <div class="rodape">
        <span class="tag br">${rotuloMec(m.mec)}</span>
        ${nQ?`<span class="tag">${nQ} etapas</span>`:''}
        ${e.melhorPct?`<span class="tag ${e.melhorPct>=70?'ok':'av'}">${e.melhorPct}%</span>`:''}
      </div></div></article>`;
}
const ROT_MEC = {triagem:'Triagem', classificar:'Classificação', tetraedro:'Tetraedro',
  propagacao:'Propagação', ordenar:'Ordenação', metodo:'Método', agente:'Agente',
  matriz:'Matriz', reconhecer:'Reconhecimento', montar:'Montagem', cenario:'Cenário',
  quiz:'Questões', relampago:'Cronometrado', simulado:'Simulado'};
const rotuloMec = m => ROT_MEC[m] || 'Missão';

function acaoRecomendada(a, alvo){
  if(a==='caderno') return iniciarMissao('caderno');
  if(a==='revisao') return iniciarMissao('revisao');
  if(a==='missao' && alvo) return irPara('briefing', alvo);
  const p = proximaMissao();
  if(p) return irPara('briefing', p.id);
  iniciarMissao('revisao');
}

/* =========================== TELA: BRIEFING =========================== */
function telaBriefing(){
  const m = MISSOES.find(x=>x.id===PARAM); if(!m) return telaHub();
  const e = missaoEstado(m.id);
  const eixo = CONTEUDO.eixos.find(x=>x.id===m.eixo);
  let indisp = '';
  if(m.caderno && !S.erros.length)
    indisp = 'Seu caderno de erros está vazio. Responda outras missões primeiro.';
  return `<div class="tela">
    <button class="btn fantasma" onclick="irPara('hub')">◄ Voltar ao Centro</button>

      <div class="sobre">
        <span class="kick">${eixo?esc(eixo.cod)+' · '+esc(eixo.n):'Operação especial'}</span>

      </div></div>

    <div class="grade g2">
      <div class="painel">
        <span class="kick">Briefing da missão</span>
        <p>${esc(m.desc)}</p>
        <hr class="sep">
        <span class="kick aco sl">Objetivos operacionais</span>
        <ul class="objetivos">${m.obj.map(o=>`<li><span>${esc(o)}</span></li>`).join('')}</ul>
      </div>
      <div class="painel">
        <span class="kick">Ficha técnica</span>
        <table class="tabela">
          <tr><td>Mecânica</td><td class="mono">${rotuloMec(m.mec)}</td></tr>
          <tr><td>Etapas</td><td class="mono">${m.cfg.rodadas?m.cfg.rodadas.length:
            (m.cfg.n||(m.cfg.itens?m.cfg.itens.length:(m.cfg.lista?m.cfg.lista.length:'—')))}</td></tr>
          <tr><td>Aprovação</td><td class="mono">70% de acerto</td></tr>
          <tr><td>Tentativas</td><td class="mono">${e.tentativas}</td></tr>
          <tr><td>Melhor desempenho</td><td class="mono">${e.melhorPct?e.melhorPct+'%':'—'}</td></tr>
          ${m.cfg.seg?`<tr><td>Tempo por questão</td><td class="mono">${m.cfg.seg}s</td></tr>`:''}
        </table>
        ${eixo?`<div class="caixa tecnica"><h4>Fundamento</h4>
          <p class="small" style="margin:0">${esc(eixo.resumo)}</p></div>`:''}
        ${indisp?`<div class="caixa armadilha"><h4>Indisponível</h4>
          <p class="small" style="margin:0">${esc(indisp)}</p></div>`:''}
        <button class="btn primario bloco grande" style="margin-top:14px"
          ${indisp?'disabled':''} onclick="iniciarMissao('${m.id}')">
          ${ic('fogo')} Entrar em operação</button>
      </div></div></div>`;
}

/* ========================= EXECUÇÃO DA MISSÃO ========================== */
function iniciarMissao(id){
  const m = MISSOES.find(x=>x.id===id); if(!m) return;
  pararCron();                          // encerra relógio de missão anterior
  M = {m, i:0, acertos:0, total:0, inicio:Date.now(), tQ:Date.now(),
       itens:[], respondido:false, dados:{}, timer:null, resta:m.cfg.seg||0};

  if(['quiz','cenario','relampago','simulado'].includes(m.mec)){
    let f = Object.assign({}, m.cfg.filtro||{});
    M.itens = selecionar(m.cfg.n, f);
    if(!M.itens.length){ aviso('Nenhuma questão disponível para este filtro.','er','erro'); return irPara('hub'); }
  } else if(m.cfg.rodadas){
    M.itens = embaralhar(m.cfg.rodadas);
  } else if(m.mec==='montar'){
    M.dados.vestidos = {}; M.dados.pend = m.cfg.lista.slice();
    M.itens = m.cfg.lista;
  } else if(m.mec==='ordenar'){
    let o = embaralhar(m.cfg.itens);
    if(o.map(x=>x.id).join()===m.cfg.ordem.join()) o = o.reverse();
    M.dados.ordem = o; M.itens = m.cfg.itens;
  } else if(m.mec==='classificar'){
    M.itens = embaralhar(m.cfg.itens); M.dados.pos = {};
  } else if(m.mec==='matriz'){
    M.dados.grade = {}; M.itens = [];
    m.cfg.agentes.forEach(a=>m.cfg.classes.forEach(c=>M.itens.push({a,c})));
  }
  som('missaoOk'); Audio01.ambiente(true);
  irPara('missao', id, true);
}

function telaMissao(){
  if(!M) return telaHub();
  const m = M.m;
  const prog = progressoMissao();
  return `<div class="tela">
    <div class="flex entre wr" style="margin-bottom:12px;gap:10px">
      <button class="btn fantasma" onclick="abandonar()">◄ Abandonar</button>
      <div class="flex" style="gap:9px">
        <span class="tag br">${rotuloMec(m.mec)}</span>
        <span class="tag">${prog.feito}/${prog.total}</span>
        ${M.total?`<span class="tag ${M.acertos/M.total>=.7?'ok':'av'}">
          ${Math.round(M.acertos/M.total*100)}%</span>`:''}
        ${m.cfg.seg?`<span class="tag ${M.resta<=5?'er':'inf'}" id="cron">${M.resta}s</span>`:''}
      </div></div>
    <div class="barra" style="margin-bottom:16px"><i style="width:${prog.pct}%"></i></div>
    <div id="palco">${renderMecanica()}</div></div>`;
}
function progressoMissao(){
  const m = M.m;
  if(['montar','ordenar','classificar','matriz'].includes(m.mec)){
    const t = M.itens.length;
    const f = m.mec==='montar' ? Object.keys(M.dados.vestidos).length
            : m.mec==='classificar' ? Object.keys(M.dados.pos).length
            : m.mec==='matriz' ? Object.keys(M.dados.grade).length : (M.i?t:0);
    return {feito:f, total:t, pct: t?f/t*100:0};
  }
  return {feito:M.i, total:M.itens.length, pct: M.itens.length ? M.i/M.itens.length*100 : 0};
}
function abandonar(){
  pararCron(); Audio01.ambiente(false);
  if(M && M.total >= 3){ registrarSessao(M.acertos, M.total, 0, M.m.eixo); }
  M = null; irPara('hub');
}

/* ------------------------------------------------- despacho de mecânica */
function renderMecanica(){
  switch(M.m.mec){
    case 'quiz': case 'cenario': case 'relampago': case 'simulado': return mecQuestao();
    case 'triagem':     return mecEscolha(CONTEUDO.classes.map(c=>({
                          id:c.id, svg:svgClasse(c.letra,c.cor,88), n:'Classe '+c.letra, s:c.n})));
    case 'metodo':      return mecEscolha(CONTEUDO.metodos.map(x=>({
                          id:x.id, svg:svgMetodo(x.id,88), n:x.n, s:'retira: '+rotElem(x.elemento)})));
    case 'propagacao':  return mecEscolha(CONTEUDO.propagacao.map(x=>({
                          id:x.id, svg:svgPropagacao(x.id,104), n:x.n, s:x.meio})));
    case 'reconhecer':  return mecReconhecer();
    case 'agente':      return mecAgente();
    case 'tetraedro':   return mecTetraedro();
    case 'montar':      return mecMontar();
    case 'ordenar':     return mecOrdenar();
    case 'classificar': return mecClassificar();
    case 'matriz':      return mecMatriz();
    default:            return mecQuestao();
  }
}
const rotElem = e => ({calor:'calor', comburente:'comburente (O₂)',
  combustivel:'combustível', reacao:'reação em cadeia'}[e] || e);

/* ---------------------------------------------------- palco cinemático --
   A cena é ambientação; o enunciado vem SEMPRE em bloco próprio, abaixo.
   Texto sobre fundo em chamas é ilegível, sobretudo em tela de celular. */
function palcoSimples(cenaId, tag){
  return `<div class="palco">${cena(cenaId)}
    <div class="palco-tag">${esc(tag)}</div></div>`;
}
function palcoCena(cenaId, kick, txt, tag){
  return palcoSimples(cenaId, tag || 'Cena operacional') +
    `<div class="pergunta"><span class="kick">${esc(kick)}</span><p>${esc(txt)}</p></div>`;
}

/* ======================= MECÂNICA: QUESTÃO CEBRASPE =================== */
function mecQuestao(){
  const q = M.itens[M.i];
  if(!q) return '';
  const eixo = CONTEUDO.eixos.find(e=>e.id===q.e);
  const dif = ['','Básica','Intermediária','Avançada'][q.d];
  const corpo = q.t==='ce'
    ? `<div class="ce-par">
         <button class="btn certo ce-btn" onclick="resp(1)">${ic('check')} CERTO</button>
         <button class="btn errado ce-btn" onclick="resp(0)">${ic('erro')} ERRADO</button>
       </div>`
    : `<div class="q-alts">${q.alt.map((a,k)=>
        `<button class="alt" onclick="resp(${k})">
           <span class="letra">${'ABCDE'[k]}</span><span>${esc(a)}</span></button>`).join('')}</div>`;
  return `<div class="questao" id="qbox">
    ${M.m.mec==='cenario' ? palcoSimples(M.m.cena,'Cenário operacional') : ''}
    <div class="q-topo">
      <span class="tag br">${esc(eixo?eixo.n:q.e)}</span>
      <span class="tag">${esc(q.s)}</span>
      <span class="tag ${q.d===3?'av':''}">${dif}</span>
      <span class="tag ${q.t==='ce'?'inf':''}">${q.t==='ce'?'Certo ou Errado':'Múltipla escolha'}</span>

    </div>
    <div class="q-num">Questão <b>${String(M.i+1).padStart(2,'0')}</b>
      <i>de ${String(M.itens.length).padStart(2,'0')}</i></div>
    <div class="q-enun">${esc(q.x)}</div>

}

function resp(v){
  if(M.respondido) return;
  M.respondido = true; pararCron();
  const q = M.itens[M.i];
  const acertou = q.t==='ce' ? (v === q.g) : (v === q.g);
  const ms = Date.now() - M.tQ;
  const r = registrar(q.i, acertou, ms);
  M.total++; if(acertou) M.acertos++;

  som(acertou ? 'acerto' : 'erro');
  if(acertou && S.combo>=3) som('combo', S.combo);
  comboHUD();
  if(r.nivel && r.nivel.subiu) subiuPatente(r.nivel);
  if(acertou) aviso(`+${r.xp} XP${r.mult>1?` · ×${r.mult.toFixed(1)}`:''}`,'xp','xp');
  if(r.saiuDoCaderno) aviso('Item recuperado do caderno de erros','ok','check');

  /* marca as respostas na tela */
  const area = $('#respArea');
  if(q.t==='ce'){
    area.innerHTML = `<div class="ce-par">
      <button class="btn certo ce-btn" disabled style="opacity:${q.g===1?1:.35}">
        ${ic('check')} CERTO ${q.g===1?'✓':''}</button>
      <button class="btn errado ce-btn" disabled style="opacity:${q.g===0?1:.35}">
        ${ic('erro')} ERRADO ${q.g===0?'✓':''}</button></div>`;
  } else {
    $$('.alt', area).forEach((b,k)=>{
      b.disabled = true;
      if(k===q.g) b.classList.add('certa');
      else if(k===v) b.classList.add('errada');
      else b.classList.add('neutra');
    });
  }
  $('#gabArea').innerHTML = gabarito(q, acertou, v);
  atualizarTopo();
  $('#gabArea').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function gabarito(q, acertou, v){
  const respCerta = q.t==='ce' ? (q.g===1?'CERTO':'ERRADO') : 'Alternativa '+'ABCDE'[q.g];
  const alts = q.t==='me' && q.ja ? `<div class="caixa tecnica"><h4>Análise das alternativas</h4>
      ${q.ja.map((j,k)=>`<div class="small" style="display:flex;gap:8px;padding:4px 0;
        ${k===q.g?'color:var(--ok)':''}">
        <b style="min-width:14px">${'ABCDE'[k]}</b><span>${esc(j)}</span></div>`).join('')}</div>` : '';
  return `<div class="gabarito">
    <div class="gab-cab ${acertou?'ok':'er'}">
      ${ic(acertou?'check':'erro')} ${acertou?'Resposta correta':'Resposta incorreta'}
      <span style="margin-left:auto;font-weight:400;letter-spacing:.5px;text-transform:none">
        Gabarito: <b>${respCerta}</b></span></div>
    <div class="gab-corpo">
      <div class="caixa ouro"><h4>Justificativa</h4><p class="small" style="margin:0">${esc(q.j)}</p></div>
      ${alts}
      ${q.p?`<div class="caixa armadilha"><h4>Pegadinha da banca</h4>
        <p class="small" style="margin:0">${esc(q.p)}</p></div>`:''}
      ${q.m?`<div class="caixa macete"><h4>Macete</h4>
        <p class="small" style="margin:0">${esc(q.m)}</p></div>`:''}
      <button class="btn primario bloco" style="margin-top:14px" onclick="proxima()">
        ${M.i+1 >= M.itens.length ? 'Concluir missão' : 'Próxima'} ${ic('seta')}</button>
    </div></div>`;
}

function proxima(){
  M.i++; M.respondido = false; M.tQ = Date.now();
  if(M.i >= M.itens.length) return fimMissao();
  render();
  if(M.m.cfg.seg) iniciarCron();
}

/* ------------------------------------------------------- cronômetro --- */
function iniciarCron(){
  if(!M || !M.m.cfg.seg) return;
  pararCron();
  M.resta = M.m.cfg.seg;
  const meu = M;                       // trava a contagem nesta missão
  meu.timer = setInterval(()=>{
    /* se a missão trocou ou terminou, o intervalo órfão se encerra sozinho —
       sem isso, um relógio antigo passaria a descontar tempo da missão seguinte */
    if(M !== meu){ clearInterval(meu.timer); meu.timer = null; return; }
    M.resta--;
    const c = $('#cron');
    if(c){ c.textContent = M.resta+'s'; c.className = 'tag ' + (M.resta<=5?'er':'inf'); }
    if(M.resta<=0){
      pararCron();
      if(!M.respondido){ aviso('Tempo esgotado','er','relogio'); resp(-1); }
    }
  }, 1000);
}
function pararCron(){ if(M && M.timer){ clearInterval(M.timer); M.timer = null; } }
function atualizarTopo(){
  const t = $('.tela .flex.entre .flex');
  if(t){ const p = progressoMissao();
    $$('.tag', t)[1].textContent = p.feito+'/'+p.total; }
  const b = $('.tela > .barra > i'); if(b) b.style.width = progressoMissao().pct+'%';
}

function escolher(id){
  if(M.respondido) return;
  M.respondido = true;
  const r = M.itens[M.i], acertou = id === r.r;
  M.total++; if(acertou){ M.acertos++; S.combo++; S.melhorCombo=Math.max(S.melhorCombo,S.combo); }
  else S.combo = 0;
  const xp = acertou ? Math.round(14*multiplicador()) : 3;
  const nv = darXP(xp);
  som(acertou?'acerto':'erro'); comboHUD();

function gabaritoEscolha(r, acertou, id){
  const info = infoResposta(r.r), infoErr = id!==r.r ? infoResposta(id) : null;
  return `<div class="gabarito">
    <div class="gab-cab ${acertou?'ok':'er'}">${ic(acertou?'check':'erro')}

function infoResposta(id){
  if(EQUIP_NOMES[id]) return EQUIP_NOMES[id];
  const c = CONTEUDO.classes.find(x=>x.id===id);
  if(c) return {n:'Classe '+c.letra+' — '+c.n, d:c.combustivel+'. '+c.marca+'.', m:c.macete};
  const mt = CONTEUDO.metodos.find(x=>x.id===id);
  if(mt) return {n:mt.n, d:mt.como+' Retira o elemento: '+rotElem(mt.elemento)+'. Ex.: '+mt.ex, m:mt.agente};
  const p = CONTEUDO.propagacao.find(x=>x.id===id);
  if(p) return {n:p.n, d:p.def+' '+p.meio+'.', m:'Exemplo: '+p.ex};
  const eq = CONTEUDO.equipamentos.find(x=>x.id===id);
  if(eq) return {n:eq.n, d:eq.def+' '+eq.detalhe, m:eq.chave};
  const ag = CONTEUDO.agentes.find(x=>x.id===id);
  if(ag) return {n:ag.n+' ('+ag.sigla+')', d:'Ação: '+ag.acao+'. Indicado: classes '+ag.ok.join(', ')+
    '. Vedado: '+(ag.nao.length?'classes '+ag.nao.join(', '):'—')+'.', m:ag.limitacoes[0]};
  return {n:id, d:'—'};
}

/* mantém a ordem sorteada estável entre renders da mesma missão */
function embaralharEstavel(lista){
  if(!M.dados.ordemBandeja) M.dados.ordemBandeja = {};
  return lista.slice().sort((a,b)=>{
    if(M.dados.ordemBandeja[a.id]===undefined) M.dados.ordemBandeja[a.id]=Math.random();
    if(M.dados.ordemBandeja[b.id]===undefined) M.dados.ordemBandeja[b.id]=Math.random();
    return M.dados.ordemBandeja[a.id]-M.dados.ordemBandeja[b.id];
  });
}
function vestir(id){
  const cfg = M.m.cfg, vest = M.dados.vestidos;
  const esperado = cfg.lista.find(x=>!vest[x.id]);
  const acertou = esperado && esperado.id === id;
  M.total++;
  if(acertou){
    M.acertos++; vest[id] = 1; S.combo++; S.melhorCombo = Math.max(S.melhorCombo, S.combo);
    const xp = Math.round(15*multiplicador()); darXP(xp);
    som('acerto'); aviso(`${esc(esperado.n)} · +${xp} XP`, 'xp', 'xp');
    if(cfg.tipo==='epr' && id==='mascara') som('alarmeEPR');
  } else {
    S.combo = 0; darXP(2); som('erro');
    const item = cfg.lista.find(x=>x.id===id);
    aviso(`Fora de ordem: ${esc(esperado?esperado.n:'')} vem antes`, 'er', 'erro');
    if(item){
      $('#gabArea').innerHTML = `<div class="caixa armadilha" style="margin-top:14px">
        <h4>${esc(item.n)}</h4><p class="small" style="margin:0">${esc(item.obs)}</p></div>`;
    }
  }
  comboHUD();
  if(Object.keys(vest).length >= cfg.lista.length) return fimMissao();
  render();
}

            <div class="small muted">${esc(x.d)}</div></div>
          <div class="setas">
            <button onclick="mover(${k},-1)" ${k===0?'disabled':''}>▲</button>

function mover(i, d){
  const o = M.dados.ordem, j = i + d;
  if(j < 0 || j >= o.length) return;
  [o[i], o[j]] = [o[j], o[i]];
  som('clique'); render();
}
function conferirOrdem(){
  if(M.respondido) return;
  const cfg = M.m.cfg;
  const atual = M.dados.ordem.map(x=>x.id);
  const acertou = atual.join() === cfg.ordem.join();
  const certos = atual.filter((id,k)=>id===cfg.ordem[k]).length;
  M.total = cfg.ordem.length; M.acertos = certos;
  if(acertou){
    M.respondido = true;
    const xp = Math.round(28*multiplicador()); darXP(xp);
    S.combo++; S.melhorCombo = Math.max(S.melhorCombo, S.combo);
    som('acerto'); aviso(`Sequência correta · +${xp} XP`, 'xp', 'xp');
    comboHUD();
    $('#gabArea').innerHTML = `<div class="gabarito">
      <div class="gab-cab ok">${ic('check')} Sequência correta</div>
      <div class="gab-corpo">
        <div class="caixa ouro"><h4>Fundamento</h4>
          <p class="small" style="margin:0">${esc(cfg.explica)}</p></div>
        <button class="btn primario bloco" style="margin-top:14px" onclick="fimMissao()">
          Concluir missão ${ic('seta')}</button></div></div>`;
  } else {
    S.combo = 0; darXP(2); som('erro'); comboHUD();
    aviso(`${certos} de ${cfg.ordem.length} na posição correta`, 'er', 'erro');
    $$('#ordem .ordem-item').forEach((el,k)=>{
      el.style.borderColor = atual[k]===cfg.ordem[k] ? 'var(--ok)' : 'var(--er)';
    });
  }
}

function classificar(cid){
  const pos = M.dados.pos;
  const atual = M.itens.find(x=>pos[x.n]===undefined);
  if(!atual) return;
  const acertou = atual.c === cid;
  pos[atual.n] = cid;
  M.total++;
  if(acertou){
    M.acertos++; S.combo++; S.melhorCombo = Math.max(S.melhorCombo, S.combo);
    const xp = Math.round(12*multiplicador()); darXP(xp);
    som('acerto'); aviso(`${esc(atual.n)} » Classe ${cid} · +${xp} XP`, 'xp', 'xp');
  } else {
    S.combo = 0; darXP(2); som('erro');
    const c = CONTEUDO.classes.find(x=>x.id===atual.c);
    aviso(`${esc(atual.n)} é Classe ${atual.c} — ${esc(c.n)}`, 'er', 'erro');
  }
  comboHUD();
  if(M.itens.every(x=>pos[x.n]!==undefined)) return fimMissao();
  render();
}

/* ========================== MECÂNICA: MATRIZ ========================== */
function mecMatriz(){
  const cfg = M.m.cfg, g = M.dados.grade;
  const cel = (a,c)=>{
    const k = a+'|'+c, v = g[k];
    const ag = CONTEUDO.agentes.find(x=>x.id===a);
    const correto = ag.ok.includes(c);
    let cls = '', txt = '·';
    if(v !== undefined){ cls = v===correto ? 'sim' : 'nao'; txt = v ? '✓' : '✕'; }
    return `<div class="${cls}" style="cursor:${v===undefined?'pointer':'default'}"
      ${v===undefined?`onclick="marcarMatriz('${a}','${c}')"`:''}>${txt}</div>`;
  };
  const feitos = Object.keys(g).length, total = M.itens.length;
  return `<div class="questao">
    <div class="painel">
      <span class="kick">Matriz de compatibilidade</span>
      <p class="small">Toque em cada célula para marcar se o agente é <b>indicado</b> para a classe.
        Primeiro toque marca <b>✓ indicado</b>; se estiver errado, a célula fica vermelha.
        Progresso: ${feitos}/${total}.</p>
      <div style="overflow-x:auto;margin-top:12px">
      <div class="matriz" style="min-width:420px;grid-template-columns:1.6fr repeat(5,1fr)">
        <div class="cab">AGENTE</div>
        ${cfg.classes.map(c=>`<div class="cab">${c}</div>`).join('')}
        ${cfg.agentes.map(a=>{
          const ag = CONTEUDO.agentes.find(x=>x.id===a);
          return `<div style="text-align:left;font-size:10px">${esc(ag.sigla)}</div>` +
                 cfg.classes.map(c=>cel(a,c)).join('');
        }).join('')}
      </div></div>
      <div class="flex wr small" style="gap:14px;margin-top:14px">
        <span class="tag ok">✓ marcação correta</span>
        <span class="tag er">✕ marcação incorreta</span>
      </div>
      <button class="btn fantasma bloco" style="margin-top:10px" onclick="preencherNaoMatriz()">
        Marcar todas as restantes como NÃO indicadas</button>
    </div><div id="gabArea"></div></div>`;
}
function marcarMatriz(a, c){
  const g = M.dados.grade, k = a+'|'+c;
  if(g[k] !== undefined) return;
  const ag = CONTEUDO.agentes.find(x=>x.id===a);
  const correto = ag.ok.includes(c);
  g[k] = true;                       // o toque afirma "indicado"
  M.total++;
  if(correto){
    M.acertos++; S.combo++; S.melhorCombo = Math.max(S.melhorCombo, S.combo);
    const xp = Math.round(9*multiplicador()); darXP(xp);
    som('acerto');
  } else {
    S.combo = 0; darXP(1); som('erro');
    aviso(`${esc(ag.n)} NÃO é indicado para a classe ${c}`, 'er', 'erro');
  }
  comboHUD();
  if(Object.keys(g).length >= M.itens.length) return fimMissao();
  render();
}
function preencherNaoMatriz(){
  const g = M.dados.grade;
  M.itens.forEach(({a,c})=>{
    const k = a+'|'+c;
    if(g[k] !== undefined) return;
    const ag = CONTEUDO.agentes.find(x=>x.id===a);
    const correto = ag.ok.includes(c);
    g[k] = false;
    M.total++;
    if(!correto){ M.acertos++; darXP(4); } else darXP(1);
  });
  som('desbloqueio');
  fimMissao();
}

/* ========================== FIM DA MISSÃO ============================= */
function fimMissao(){
  pararCron(); Audio01.ambiente(false);
  const m = M.m;
  const pct = M.total ? Math.round(M.acertos/M.total*100) : 0;
  const seg = Math.round((Date.now()-M.inicio)/1000);
  const aprovado = pct >= 70;
  let bonus = 0;
  if(aprovado){
    bonus = 60 + (pct===100 ? 90 : 0);
    if(m.mec==='simulado') bonus += 240;
    darXP(bonus);
  }
  concluirMissao(m.id, pct);
  registrarSessao(M.acertos, M.total, bonus, m.eixo);
  const novas = checarMedalhas();
  som(aprovado ? 'missaoOk' : 'missaoFalha');
  if(novas.length) setTimeout(()=>som('medalha'), 700);

  const resumo = {pct, seg, acertos:M.acertos, total:M.total, bonus, aprovado, novas, m};
  M = null;
  irPara('resultado', resumo, true);
}

/* ============================== SPLASH =============================== */
function splash(){
  const el = document.createElement('div');
  el.id = 'splash';
  el.innerHTML = `<div class="splash-in">
    ${svgLogo(148)}
    <h1>Combate a Incêndio</h1>
    <div class="sub">Centro de Treinamento Operacional</div>
    <div class="splash-carga">
      <div class="t">Carregando módulos operacionais</div>
      <div class="barra"><i id="cargaBar" style="width:0%"></i></div>
    </div>
    <p class="small muted" style="margin-top:22px;max-width:330px">
      ${QUESTOES.length} questões · ${MISSOES.length} missões · ${CONTEUDO.eixos.length} eixos do edital</p>
  </div>`;
  document.body.appendChild(el);
  let p = 0;
  const t = setInterval(()=>{
    p = Math.min(100, p + 6 + Math.random()*12);
    const b = $('#cargaBar'); if(b) b.style.width = p + '%';
    if(p >= 100){
      clearInterval(t);
      setTimeout(()=>{
        el.classList.add('sai');
        setTimeout(()=>el.remove(), 900);
      }, 380);
    }
  }, 105);
  /* o áudio só inicia após interação do usuário (política dos navegadores) */
  const destravar = ()=>{
    Audio01.iniciar();
    if(S.audio !== false) som('desbloqueio');
    document.removeEventListener('pointerdown', destravar);
    document.removeEventListener('keydown', destravar);
  };
  document.addEventListener('pointerdown', destravar);
  document.addEventListener('keydown', destravar);
}

/* ============================== RENDER =============================== */
const TELAS = {hub:telaHub, briefing:telaBriefing, missao:telaMissao,
  resultado:telaResultado, codex:telaCodex, stats:telaStats, caderno:telaCaderno};
function render(){
  renderHUD();
  $('#tela').innerHTML = (TELAS[TELA] || telaHub)();
  comboHUD();
  /* missões cronometradas: o relógio parte assim que a questão entra em tela */
  if(TELA==='missao' && M && M.m.cfg.seg && !M.respondido && !M.timer) iniciarCron();
}

/* =============================== BOOT ================================ */
function iniciar(){
  document.body.insertAdjacentHTML('afterbegin', svgDefs());
  carregar();
  Audio01.definir(S.audio !== false);
  render();
  splash();
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      if($('#modal').classList.contains('on')) return fecharModal();
      if(TELA === 'missao') return abandonar();
      if(TELA !== 'hub') return irPara('hub');
    }
    if(TELA === 'missao' && M && !M.respondido && M.itens[M.i] && M.itens[M.i].t === 'ce'){
      if(e.key === 'c' || e.key === 'C' || e.key === '1') resp(1);
      if(e.key === 'e' || e.key === 'E' || e.key === '2') resp(0);
    }
    if(TELA === 'missao' && M && M.respondido && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault();
      const b = $('#gabArea .btn.primario'); if(b) b.click();
    }
  });
}
document.addEventListener('DOMContentLoaded', iniciar);
