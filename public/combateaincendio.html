const Q_TEORIA = [

/* ---------------------------------------------- CONCEITO E COMBUSTÃO ---- */
{i:'T001',t:'ce',e:'teoria',s:'Combustão',d:1,
 x:'O fogo é o resultado de uma reação química de oxidação exotérmica, denominada combustão, que se caracteriza pela liberação de luz e calor.',
 g:1,
 j:'Definição exata. A combustão é uma oxidação (o combustível reage com o comburente) exotérmica (libera energia), cujos efeitos perceptíveis são a luz e o calor.',
 p:'A banca costuma trocar "exotérmica" por "endotérmica". Reação que libera calor é EXOtérmica; a que absorve é ENDOtérmica.',
 m:'EXO = para fora. O fogo joga calor para fora.'},

{i:'T002',t:'ce',e:'teoria',s:'Combustão',d:1,
 x:'Incêndio e fogo são expressões tecnicamente sinônimas, uma vez que ambas designam a mesma reação química de oxidação, sem qualquer distinção quanto ao controle sobre o fenômeno.',
 g:0,
 j:'ERRADO. Fogo é a reação química de combustão em si; incêndio é o FOGO SEM CONTROLE, que se propaga e causa danos. A distinção está justamente no controle.',
 p:'Toda vez que a banca afirma que dois conceitos próximos são "sinônimos" ou que não há "qualquer distinção", desconfie. Aqui a diferença é o descontrole.',
 m:'Fogo controlado = fogueira. Fogo descontrolado = incêndio.'},

{i:'T003',t:'ce',e:'teoria',s:'Combustão',d:2,
 x:'Na combustão completa, em que há oxigênio em quantidade suficiente, geram-se principalmente dióxido de carbono e água, observando-se chama azulada e pouca produção de fumaça.',
 g:1,
 j:'Correto em todos os elementos. Oxigênio suficiente permite a oxidação plena do carbono até CO₂; os subprodutos são CO₂ e H₂O, com chama azulada e pouca fumaça.',
 p:'A banca inverte os produtos: coloca CO (monóxido) na completa e CO₂ na incompleta. É o contrário.',
 m:'Completa = azul e limpa (CO₂). Incompleta = amarela e suja (CO + fuligem).'},

{i:'T004',t:'ce',e:'teoria',s:'Combustão',d:2,
 x:'A combustão incompleta decorre da insuficiência de comburente e produz monóxido de carbono, fuligem e fumaça densa, apresentando chama de coloração amarelada.',
 g:1,
 j:'Correto. Com oxigênio insuficiente, o carbono não se oxida plenamente: forma-se CO em vez de CO₂, além de fuligem (carbono não queimado) e fumaça densa, com chama amarelada.',
 p:'Note que o enunciado usa "comburente" em vez de "oxigênio". São a mesma coisa no ar atmosférico — a banca troca o vocabulário para testar o domínio conceitual.',
 m:'Faltou ar » sobrou fuligem.'},

{i:'T005',t:'ce',e:'teoria',s:'Combustão',d:2,
 x:'A combustão incompleta é considerada a forma mais segura de queima, uma vez que, por ocorrer com deficiência de oxigênio, libera menor quantidade de gases tóxicos no ambiente.',
 g:0,
 j:'ERRADO, e gravemente. A combustão incompleta é MAIS PERIGOSA: é ela que gera monóxido de carbono (CO), gás tóxico responsável pela maior parte das mortes em incêndios, além de fuligem e fumaça densa.',
 p:'Armadilha de raciocínio: "menos oxigênio" soa como "menos queima, menos risco". É o oposto — menos oxigênio significa mais CO.',
 m:'Incompleta = incompleta a oxidação = CO tóxico.'},

{i:'T006',t:'ce',e:'teoria',s:'Combustão',d:3,
 x:'Considere um cômodo fechado, com pouca ventilação, no qual se desenvolve um incêndio em mobiliário de madeira. Nessa situação, a tendência é que a combustão se torne progressivamente incompleta, elevando a concentração de monóxido de carbono e reduzindo a visibilidade pela fuligem em suspensão.',
 g:1,
 j:'Correto. O consumo progressivo do oxigênio disponível no compartimento fechado empobrece a mistura, deslocando a queima para o regime incompleto: sobe a produção de CO e de fuligem, com queda drástica de visibilidade.',
 p:'Item de aplicação, típico da CEBRASPE: descreve um cenário e cobra a consequência técnica. Ambiente confinado » combustão incompleta » CO » risco letal.',
 m:'Ambiente fechado é fábrica de monóxido.'},

/* --------------------------------------------- TRIÂNGULO E TETRAEDRO --- */
{i:'T007',t:'ce',e:'teoria',s:'Tetraedro',d:1,
 x:'O triângulo do fogo é composto por combustível, comburente e calor.',
 g:1,
 j:'Correto. São os três elementos essenciais do triângulo. A reação em cadeia é o quarto elemento e pertence exclusivamente ao tetraedro.',
 p:'A banca acrescenta "reação em cadeia" ao triângulo, ou substitui "comburente" por "fumaça" ou "chama" — que são PRODUTOS, não elementos.',
 m:'Triângulo tem 3 lados = 3 elementos.'},

{i:'T008',t:'ce',e:'teoria',s:'Tetraedro',d:1,
 x:'O tetraedro do fogo é formado por combustível, comburente, calor e reação em cadeia.',
 g:1,
 j:'Correto. O tetraedro acrescenta a reação em cadeia aos três elementos do triângulo, totalizando quatro. Esse quarto elemento é justamente o alvo da extinção química.',
 p:'Memorize a figura geométrica: tetraedro é o sólido de quatro faces. Quatro faces = quatro elementos.',
 m:'TETRA = quatro. Tetraedro = 4 elementos.'},

{i:'T009',t:'ce',e:'teoria',s:'Tetraedro',d:2,
 x:'A distinção entre o triângulo e o tetraedro do fogo reside no acréscimo, neste último, do elemento oxigênio, responsável por alimentar a combustão.',
 g:0,
 j:'ERRADO. O elemento acrescentado no tetraedro é a REAÇÃO EM CADEIA, não o oxigênio. O oxigênio (comburente) já compõe o triângulo desde o início.',
 p:'Pegadinha clássica de substituição: troca-se "reação em cadeia" por "oxigênio". Se o oxigênio fosse o acréscimo, o triângulo teria apenas dois elementos.',
 m:'O que entra no tetraedro é a REAÇÃO EM CADEIA.'},

{i:'T010',t:'ce',e:'teoria',s:'Tetraedro',d:1,
 x:'No processo de combustão, o comburente é o material que queima e alimenta a reação, ao passo que o combustível é o agente que sustenta a oxidação.',
 g:0,
 j:'ERRADO — os conceitos estão invertidos. COMBUSTÍVEL é o material que queima (madeira, gasolina, GLP). COMBURENTE é o agente que alimenta a combustão, representado no ar pelo oxigênio.',
 p:'Este é o erro mais cobrado de todo o eixo. Chamar o oxigênio de "combustível" elimina candidato.',
 m:'ComBURENTE = o que faz queimar (oxigênio). ComBUSTÍVEL = o que é queimado.'},

{i:'T011',t:'ce',e:'teoria',s:'Tetraedro',d:1,
 x:'No ar atmosférico, o comburente é representado principalmente pelo oxigênio, presente em concentração aproximada de 21%.',
 g:1,
 j:'Correto. O oxigênio corresponde a cerca de 21% do ar atmosférico e é o comburente por excelência da combustão.',
 p:'A banca troca o oxigênio pelo nitrogênio (que é o gás mais abundante do ar, ~78%, mas NÃO é comburente) para testar a atenção.',
 m:'Nitrogênio é o mais abundante; oxigênio é o que sustenta o fogo.'},

{i:'T012',t:'ce',e:'teoria',s:'Tetraedro',d:2,
 x:'A retirada de qualquer um dos elementos que compõem o tetraedro do fogo é suficiente para provocar a extinção da combustão.',
 g:1,
 j:'Correto — e este é o fundamento de todo o combate a incêndio. Cada método de extinção ataca precisamente um dos quatro vértices: resfriamento/calor, abafamento/comburente, isolamento/combustível e extinção química/reação em cadeia.',
 p:'Item conceitualmente verdadeiro que a banca às vezes nega ("é necessário retirar todos os elementos") para induzir ao erro.',
 m:'Tira um vértice, cai o tetraedro.'},

{i:'T013',t:'ce',e:'teoria',s:'Tetraedro',d:2,
 x:'A reação em cadeia consiste na autossustentação da combustão, mediante a formação de radicais livres que realimentam continuamente o processo de queima.',
 g:1,
 j:'Correto. A reação em cadeia é o mecanismo pelo qual a combustão se automantém: os radicais livres gerados na queima realimentam a própria reação, dispensando estímulo externo contínuo.',
 p:'É esse elemento que o pó químico ataca. Guardar essa ligação (reação em cadeia » extinção química » pó químico) resolve muitas questões.',
 m:'Reação em cadeia é o fogo se alimentando sozinho.'},

{i:'T014',t:'ce',e:'teoria',s:'Tetraedro',d:2,
 x:'A fumaça e a chama, por serem manifestações sempre presentes no incêndio, integram o conjunto de elementos essenciais do tetraedro do fogo.',
 g:0,
 j:'ERRADO. Fumaça e chama são PRODUTOS da combustão, e não elementos que a sustentam. Os elementos do tetraedro são combustível, comburente, calor e reação em cadeia.',
 p:'Confundir PRODUTO com ELEMENTO é armadilha recorrente. Produto é resultado; elemento é causa.',
 m:'Elemento entra; produto sai.'},

{i:'T015',t:'ce',e:'teoria',s:'Tetraedro',d:3,
 x:'Situação hipotética: durante o combate a um princípio de incêndio em um botijão de gás, a guarnição fecha o registro do recipiente, e as chamas se extinguem. Assertiva: nessa hipótese, o elemento do tetraedro do fogo suprimido foi o comburente.',
 g:0,
 j:'ERRADO. Ao fechar o registro, suprimiu-se o COMBUSTÍVEL (o gás que alimentava a chama), configurando o método de isolamento ou retirada do material. O comburente (oxigênio do ar) permaneceu integralmente disponível.',
 p:'Formato "situação hipotética + assertiva", marca registrada da CEBRASPE. A banca aposta que o candidato associe "fechar" a "abafar".',
 m:'Fechou o gás = tirou o COMBUSTÍVEL.'},

{i:'T016',t:'ce',e:'teoria',s:'Tetraedro',d:2,
 x:'O calor, no tetraedro do fogo, é a energia responsável tanto por iniciar quanto por manter a reação de combustão.',
 g:1,
 j:'Correto. O calor exerce dupla função: fornece a energia de ativação que inicia a combustão e mantém o combustível em temperatura suficiente para continuar liberando vapores inflamáveis.',
 p:'É por isso que o resfriamento funciona: retirando calor, o combustível deixa de liberar vapores em quantidade suficiente para sustentar a chama.',
 m:'Calor acende e calor mantém.'},

/* ------------------------------------------- PONTOS DE TEMPERATURA ----- */
{i:'T017',t:'ce',e:'teoria',s:'Pontos de temperatura',d:2,
 x:'Ponto de fulgor é a menor temperatura em que o combustível libera vapores que se inflamam ao contato com fonte externa de calor, sem que haja, contudo, sustentação da chama.',
 g:1,
 j:'Correto e completo. No ponto de fulgor (flash point) há apenas o lampejo: os vapores se inflamam momentaneamente com a fonte externa, mas em quantidade insuficiente para manter a chama.',
 p:'A banca troca a definição de fulgor pela de combustão, afirmando que a chama "se mantém". Não se mantém — ela lampeja e apaga.',
 m:'FULGOR = FULGURA (brilha) e apaga.'},

{i:'T018',t:'ce',e:'teoria',s:'Pontos de temperatura',d:2,
 x:'No ponto de combustão, também denominado ponto de ignição, os vapores liberados pelo combustível, uma vez inflamados por fonte externa, mantêm a chama de forma contínua.',
 g:1,
 j:'Correto. O ponto de combustão está acima do ponto de fulgor: a taxa de liberação de vapores já é suficiente para sustentar a queima continuamente após a ignição.',
 p:'Fulgor e combustão são conceitos vizinhos — a diferença é exclusivamente a SUSTENTAÇÃO da chama.',
 m:'Fulgor acende e apaga; combustão acende e MANTÉM.'},

{i:'T019',t:'ce',e:'teoria',s:'Pontos de temperatura',d:2,
 x:'A temperatura de autoignição é aquela em que o combustível entra em combustão sem a necessidade de qualquer fonte externa de calor.',
 g:1,
 j:'Correto. Na autoignição, o próprio aquecimento do material atinge nível suficiente para iniciar a combustão espontaneamente, dispensando faísca ou chama externa.',
 p:'A banca acrescenta indevidamente "mediante fonte externa" à autoignição. Se há fonte externa, não é autoignição.',
 m:'AUTO = sozinho. Pega fogo sozinho.'},

{i:'T020',t:'ce',e:'teoria',s:'Pontos de temperatura',d:3,
 x:'Os pontos de temperatura de um mesmo combustível organizam-se, em ordem crescente, da seguinte forma: temperatura de autoignição, ponto de combustão e ponto de fulgor.',
 g:0,
 j:'ERRADO — a ordem está invertida. A sequência crescente correta é: PONTO DE FULGOR < PONTO DE COMBUSTÃO < TEMPERATURA DE AUTOIGNIÇÃO. A autoignição é a mais alta, pois dispensa fonte externa.',
 p:'A banca embaralha a ordem confiando em que o candidato memorize os conceitos isoladamente, sem hierarquizá-los.',
 m:'Ordem crescente: Fulgor < Combustão < Autoignição (F-C-A).'},

{i:'T021',t:'ce',e:'teoria',s:'Pontos de temperatura',d:3,
 x:'Situação hipotética: um líquido inflamável, aquecido gradualmente, passa a liberar vapores que produzem um lampejo momentâneo quando aproximada uma chama-piloto, sem manutenção do fogo. Assertiva: nessa situação, o líquido atingiu a sua temperatura de autoignição.',
 g:0,
 j:'ERRADO. O lampejo momentâneo com chama-piloto (fonte externa) e sem sustentação caracteriza o PONTO DE FULGOR. A autoignição ocorreria sem qualquer fonte externa e com queima sustentada.',
 p:'Dois indicadores derrubam a assertiva: houve fonte externa (chama-piloto) e não houve sustentação. Ambos afastam a autoignição.',
 m:'Teve chama-piloto e apagou? Fulgor.'},

{i:'T022',t:'ce',e:'teoria',s:'Pontos de temperatura',d:2,
 x:'Quanto mais baixo o ponto de fulgor de um líquido, maior a sua periculosidade, porquanto ele libera vapores inflamáveis em temperaturas mais próximas das ambientais.',
 g:1,
 j:'Correto. Um ponto de fulgor baixo significa que o líquido já libera vapores inflamáveis em condições ordinárias de temperatura — daí o risco elevado da gasolina e do éter frente a produtos de fulgor alto.',
 p:'Raciocínio de aplicação: a banca gosta de cobrar a consequência prática do conceito, não apenas a definição.',
 m:'Fulgor baixo = perigo alto.'},

/* ------------------------------------------------------ PROPAGAÇÃO ----- */
{i:'T023',t:'ce',e:'teoria',s:'Propagação',d:1,
 x:'A condução é a forma de transmissão de calor que ocorre por contato direto, de molécula a molécula, no interior de um corpo sólido.',
 g:1,
 j:'Correto. A condução depende de contato físico e de meio material, tipicamente sólido — o exemplo clássico é a barra metálica que aquece na extremidade oposta à fonte.',
 p:'A banca troca condução por convecção. Lembre: condução é contato; convecção é fluido que se desloca.',
 m:'CONDUÇÃO = CONTATO.'},

{i:'T024',t:'ce',e:'teoria',s:'Propagação',d:1,
 x:'A convecção é a transmissão de calor por meio de correntes de fluidos aquecidos, sendo a principal responsável pela propagação vertical do incêndio em edificações.',
 g:1,
 j:'Correto. Gases e líquidos aquecidos tornam-se menos densos e ascendem, transportando calor. É por convecção que a fumaça quente sobe e incendeia os pavimentos superiores.',
 p:'Fixe o exemplo: fumaça quente que sobe = convecção. É o exemplo que a banca mais utiliza.',
 m:'ConVECção = VECtor, o calor VIAJA no fluido.'},

{i:'T025',t:'ce',e:'teoria',s:'Propagação',d:2,
 x:'A irradiação é a transmissão de calor por ondas eletromagnéticas, notadamente infravermelhas, prescindindo de contato físico e de meio material para ocorrer.',
 g:1,
 j:'Correto. A irradiação propaga-se por ondas e NÃO exige meio material — ocorre até no vácuo. É o calor que se sente à distância de uma fogueira, sem tocá-la.',
 p:'"Prescinde" significa dispensa. A banca usa esse verbo para dificultar a leitura: prescindir de meio material = não precisar de meio material.',
 m:'IRRADIAÇÃO viaja no vácuo — como a luz do Sol.'},

{i:'T026',t:'ce',e:'teoria',s:'Propagação',d:2,
 x:'A irradiação, por depender da existência de meio material sólido para a transferência de energia térmica, não se verifica no vácuo.',
 g:0,
 j:'ERRADO. A irradiação é exatamente a forma que NÃO depende de meio material: propaga-se por ondas eletromagnéticas, inclusive no vácuo. Quem exige meio sólido e contato é a CONDUÇÃO.',
 p:'Esta é a pegadinha número um do subassunto. Se a assertiva disser que a irradiação precisa de meio ou de contato, está errada.',
 m:'O Sol aquece a Terra pelo vácuo: isso é irradiação.'},

{i:'T027',t:'ce',e:'teoria',s:'Propagação',d:3,
 x:'Situação hipotética: em um incêndio urbano, uma edificação vizinha, separada por uma via de dez metros e sem qualquer contato físico com o foco, começa a apresentar princípio de combustão em sua fachada de madeira. Assertiva: a forma de transmissão de calor preponderante nesse caso é a condução.',
 g:0,
 j:'ERRADO. Sem contato físico e a distância, a forma preponderante é a IRRADIAÇÃO — as ondas de calor atravessam o espaço aberto e aquecem a fachada até o ponto de ignição. A condução exigiria contato ou continuidade de meio sólido.',
 p:'Cenário de aplicação. A palavra-chave "sem qualquer contato físico" já elimina a condução.',
 m:'Sem contato e a distância = irradiação.'},

{i:'T028',t:'ce',e:'teoria',s:'Propagação',d:3,
 x:'Em um incêndio estrutural, a propagação do fogo do pavimento térreo para os pavimentos superiores por meio de escadas e dutos, impulsionada pela ascensão dos gases quentes, decorre principalmente da convecção.',
 g:1,
 j:'Correto. Escadas, poços de elevador e dutos funcionam como chaminés: os gases quentes ascendem por convecção e transportam calor suficiente para inflamar materiais nos andares superiores.',
 p:'Esse fenômeno é chamado de "efeito chaminé". A banca pode nomeá-lo ou apenas descrevê-lo — o mecanismo é a convecção.',
 m:'Calor que SOBE em duto = convecção.'},

{i:'T029',t:'ce',e:'teoria',s:'Propagação',d:2,
 x:'A condução, a convecção e a irradiação constituem as três formas de transmissão de calor, sendo a saponificação a quarta modalidade, típica de incêndios em óleos de cozinha.',
 g:0,
 j:'ERRADO. São TRÊS as formas de transmissão de calor: condução, convecção e irradiação. A saponificação não é forma de transmissão de calor — é a reação química de extinção característica do agente de classe K.',
 p:'A banca insere um conceito verdadeiro (saponificação existe) em contexto falso (não é transmissão de calor). Conceito certo, lugar errado.',
 m:'Transmissão de calor tem 3 formas. Saponificação é EXTINÇÃO, não transmissão.'},

/* ---------------------------------------- PRODUTOS DA COMBUSTÃO ------- */
{i:'T030',t:'ce',e:'teoria',s:'Produtos da combustão',d:1,
 x:'São produtos da combustão o calor, os gases, a fumaça e a chama.',
 g:1,
 j:'Correto. Os quatro produtos da combustão são calor, gases (CO e CO₂, entre outros), fumaça e chama. Todos representam risco à guarnição e às vítimas.',
 p:'Não confunda com os ELEMENTOS do tetraedro (combustível, comburente, calor, reação em cadeia). O calor aparece nas duas listas — é elemento e é produto.',
 m:'Produtos: Calor, Gases, Fumaça, Chama.'},

{i:'T031',t:'ce',e:'teoria',s:'Produtos da combustão',d:1,
 x:'O monóxido de carbono é gás incolor e inodoro, altamente tóxico, apontado como a principal causa de morte por asfixia em incêndios.',
 g:1,
 j:'Correto. O CO é imperceptível aos sentidos (incolor e inodoro) e liga-se à hemoglobina com afinidade muito superior à do oxigênio, provocando asfixia. É o grande matador em incêndios.',
 p:'A banca afirma que o CO "tem cheiro forte" ou "é visível" para induzir o candidato a marcar certo por associação com a fumaça.',
 m:'CO é o assassino invisível.'},

{i:'T032',t:'ce',e:'teoria',s:'Produtos da combustão',d:2,
 x:'O dióxido de carbono e o monóxido de carbono são substâncias equivalentes, distinguindo-se apenas pela nomenclatura empregada na literatura técnica.',
 g:0,
 j:'ERRADO. São gases distintos. O monóxido (CO) resulta da combustão INCOMPLETA e é altamente tóxico. O dióxido (CO₂) resulta da combustão completa, é asfixiante por deslocamento de oxigênio, mas não tóxico no mesmo sentido — inclusive é utilizado como agente extintor.',
 p:'Confundir CO com CO₂ é erro clássico. Um mata por toxicidade; o outro é agente extintor de classes B e C.',
 m:'CO = Carbono Ordinário mata. CO₂ = extintor.'},

{i:'T033',t:'ce',e:'teoria',s:'Produtos da combustão',d:2,
 x:'A fumaça produzida em incêndios é sempre atóxica, representando risco exclusivamente pela redução da visibilidade no ambiente.',
 g:0,
 j:'ERRADO em dois pontos. A fumaça é TÓXICA (carrega CO, gases irritantes e partículas), além de reduzir a visibilidade, desorientar e transportar calor. O risco não é exclusivamente visual.',
 p:'Palavras absolutas — "sempre", "exclusivamente", "apenas" — são sinal de alerta na CEBRASPE. Aqui há duas.',
 m:'Fumaça cega E envenena.'},

{i:'T034',t:'ce',e:'teoria',s:'Produtos da combustão',d:3,
 x:'Em incêndios ocorridos em ambientes fechados, a principal causa de óbito costuma ser a queimadura direta provocada pelo contato com as chamas, e não a inalação de fumaça e gases tóxicos.',
 g:0,
 j:'ERRADO. A principal causa de morte em incêndios em ambientes fechados é a INALAÇÃO de fumaça e gases tóxicos, sobretudo o monóxido de carbono — e não a queimadura. É precisamente esse dado que fundamenta a obrigatoriedade do EPR.',
 p:'Item que integra teoria do fogo com EPI/EPR. A banca gosta dessa costura entre eixos.',
 m:'O CO mata mais que a chama.'},

{i:'T035',t:'ce',e:'teoria',s:'Produtos da combustão',d:2,
 x:'O calor, entre os produtos da combustão, contribui ativamente para a propagação do incêndio, ao aquecer materiais adjacentes até que atinjam suas temperaturas de ignição.',
 g:1,
 j:'Correto. O calor produzido realimenta o incêndio: aquece materiais vizinhos por condução, convecção e irradiação até que estes atinjam o ponto de combustão, ampliando o sinistro.',
 p:'A banca pode afirmar que "o calor não contribui para a propagação" — assertiva flagrantemente falsa.',
 m:'Calor é produto E propagador.'},

{i:'T036',t:'ce',e:'teoria',s:'Produtos da combustão',d:3,
 x:'Situação hipotética: uma guarnição encontra uma vítima inconsciente em um subsolo com fumaça densa, sem sinais visíveis de queimadura. Assertiva: nessa hipótese, a hipótese diagnóstica mais provável é a intoxicação por monóxido de carbono, o que reforça a indispensabilidade do equipamento de proteção respiratória para a própria guarnição.',
 g:1,
 j:'Correto. Vítima inconsciente, ambiente confinado, fumaça densa e ausência de queimaduras compõem o quadro clássico de intoxicação por CO. O mesmo ambiente que incapacitou a vítima incapacita a guarnição — daí a exigência de EPR.',
 p:'Item longo e integrado (teoria do fogo + EPR + conduta). A CEBRASPE valoriza esse encadeamento.',
 m:'Sem queimadura e inconsciente na fumaça? CO.'},

/* ------------------------------------------- INTEGRAÇÃO E APLICAÇÃO --- */
{i:'T037',t:'ce',e:'teoria',s:'Combustão',d:2,
 x:'Para que a combustão se inicie, é necessário que o combustível, o comburente e o calor estejam presentes simultaneamente e em proporções adequadas.',
 g:1,
 j:'Correto. Não basta a presença dos elementos: é preciso simultaneidade e proporção adequada. Mistura muito pobre ou muito rica em combustível não entra em combustão, ainda que haja fonte de ignição.',
 p:'O detalhe "em proporções adequadas" é o que torna o item completo. A banca às vezes suprime essa condição para gerar uma assertiva incompleta.',
 m:'Presença + proporção + simultaneidade.'},

{i:'T038',t:'ce',e:'teoria',s:'Tetraedro',d:3,
 x:'A extinção química, ao atuar sobre os radicais livres gerados na queima, ataca elemento que integra o triângulo do fogo, razão pela qual pode ser explicada integralmente por esse modelo.',
 g:0,
 j:'ERRADO. A extinção química atua sobre a REAÇÃO EM CADEIA, elemento que só existe no TETRAEDRO. É justamente por isso que o triângulo é insuficiente para explicar esse método — o modelo do tetraedro foi formulado para abrigá-lo.',
 p:'Item de raciocínio: exige entender POR QUE o tetraedro substituiu o triângulo. A resposta é a extinção química.',
 m:'Pó químico só se explica pelo tetraedro.'},

{i:'T039',t:'ce',e:'teoria',s:'Propagação',d:2,
 x:'Uma barra metálica que, aquecida em uma extremidade, transmite calor até a extremidade oposta ilustra o fenômeno da irradiação.',
 g:0,
 j:'ERRADO. O exemplo descrito é de CONDUÇÃO — transmissão molécula a molécula em corpo sólido, com contato contínuo. A irradiação ocorre por ondas, sem meio material.',
 p:'A banca associa o exemplo certo ao nome errado. Memorize os pares: barra metálica/condução; fumaça que sobe/convecção; calor a distância/irradiação.',
 m:'Barra de metal = condução.'},

{i:'T040',t:'ce',e:'teoria',s:'Combustão',d:2,
 x:'A oxidação que caracteriza a combustão é sempre um processo rápido, acompanhado de chama visível, não se admitindo, tecnicamente, oxidação lenta.',
 g:0,
 j:'ERRADO. Existe oxidação lenta, como a formação de ferrugem, que ocorre sem chama e sem liberação perceptível de luz. A combustão é a oxidação RÁPIDA e exotérmica com liberação de luz e calor, mas a oxidação como fenômeno não se limita a ela.',
 p:'Novamente as palavras absolutas: "sempre" e "não se admitindo". O item nega a existência de um fenômeno real.',
 m:'Ferrugem é oxidação lenta — sem chama.'},

{i:'T041',t:'ce',e:'teoria',s:'Pontos de temperatura',d:3,
 x:'Situação hipotética: em um depósito, um solvente com ponto de fulgor de 12 °C encontra-se armazenado em ambiente cuja temperatura é de 28 °C. Assertiva: nessa condição, o solvente já está liberando vapores capazes de se inflamar diante de uma fonte externa de ignição.',
 g:1,
 j:'Correto. A temperatura ambiente (28 °C) supera o ponto de fulgor (12 °C), de modo que o solvente já libera vapores inflamáveis. Basta uma fonte de ignição — faísca, chama, eletricidade estática — para ocorrer o lampejo ou a combustão.',
 p:'Item numérico de aplicação. Compare sempre a temperatura ambiente com o ponto de fulgor: ambiente acima do fulgor = vapores inflamáveis presentes.',
 m:'Ambiente > fulgor = risco imediato.'},

{i:'T042',t:'ce',e:'teoria',s:'Produtos da combustão',d:2,
 x:'A combustão completa gera maior quantidade de monóxido de carbono do que a combustão incompleta, em razão da maior intensidade da queima.',
 g:0,
 j:'ERRADO. É a combustão INCOMPLETA que gera mais monóxido de carbono, justamente por não dispor de oxigênio suficiente para oxidar plenamente o carbono até CO₂. A completa gera principalmente CO₂ e água.',
 p:'A justificativa oferecida ("maior intensidade da queima") é falsa e serve para dar aparência de lógica ao erro. Ignore o argumento e verifique o fato.',
 m:'Mais oxigênio = menos CO.'},

{i:'T043',t:'ce',e:'teoria',s:'Tetraedro',d:2,
 x:'A supressão do comburente, dentre os métodos de extinção, corresponde ao abafamento, ao passo que a supressão do calor corresponde ao resfriamento.',
 g:1,
 j:'Correto. A correspondência é exata: abafamento retira o comburente (oxigênio); resfriamento retira o calor. Completa-se o quadro com isolamento (combustível) e extinção química (reação em cadeia).',
 p:'A banca inverte esses dois pares com altíssima frequência. Decore o quadro método × elemento antes da prova.',
 m:'Abafar = tirar ar. Resfriar = tirar calor.'},

{i:'T044',t:'ce',e:'teoria',s:'Combustão',d:3,
 x:'Situação hipotética: em teste laboratorial, observa-se chama de coloração acentuadamente amarelada, com forte deposição de fuligem nas paredes do recipiente. Assertiva: os indícios descritos apontam para queima em regime de combustão completa.',
 g:0,
 j:'ERRADO. Chama amarelada e deposição de fuligem são marcadores de combustão INCOMPLETA, decorrente de oxigênio insuficiente. A combustão completa produz chama azulada e pouca fumaça, sem fuligem significativa.',
 p:'A banca fornece os dois indícios corretos da incompleta e rotula como completa. Leia os sinais, não o rótulo.',
 m:'Amarelo + fuligem = incompleta.'},

{i:'T045',t:'ce',e:'teoria',s:'Propagação',d:2,
 x:'Na convecção, o calor é transportado pelo próprio deslocamento do fluido aquecido, que, por se tornar menos denso, tende a ascender.',
 g:1,
 j:'Correto. O aquecimento reduz a densidade do fluido, que ascende e carrega consigo a energia térmica. Esse é o mecanismo físico da convecção e explica a estratificação da fumaça no teto dos compartimentos.',
 p:'Item que exige o mecanismo, não apenas o exemplo. A CEBRASPE alterna entre cobrar definição, exemplo e mecanismo.',
 m:'Quente sobe porque fica leve.'},

{i:'T046',t:'ce',e:'teoria',s:'Produtos da combustão',d:2,
 x:'A fumaça, além de tóxica, transporta calor e reduz a visibilidade, podendo provocar desorientação espacial no combatente durante a progressão em ambiente sinistrado.',
 g:1,
 j:'Correto. A fumaça acumula três riscos simultâneos: toxicidade (CO e gases irritantes), transporte de calor e obstrução visual, que desorienta e dificulta a localização de saídas e vítimas.',
 p:'Item completo e verdadeiro. A banca também apresenta versões amputadas, mencionando apenas um dos riscos e negando os demais.',
 m:'Fumaça: envenena, esquenta e cega.'},

{i:'T047',t:'ce',e:'teoria',s:'Tetraedro',d:1,
 x:'A madeira, o papel, a gasolina e o gás liquefeito de petróleo constituem exemplos de combustível, ou seja, de material que alimenta a reação de combustão.',
 g:1,
 j:'Correto. Todos são materiais que queimam — sólidos (madeira, papel) e líquidos/gases (gasolina, GLP). Todos são combustíveis, ainda que pertençam a classes de incêndio distintas.',
 p:'Note que combustíveis de classes diferentes (A e B) continuam sendo, todos, combustíveis. A banca às vezes confunde o conceito de combustível com o de classe.',
 m:'Combustível é o que queima, seja qual for a classe.'},

{i:'T048',t:'ce',e:'teoria',s:'Pontos de temperatura',d:2,
 x:'O ponto de fulgor e o ponto de combustão de um mesmo material são coincidentes, uma vez que ambos designam o instante em que a chama passa a se sustentar de modo contínuo.',
 g:0,
 j:'ERRADO. Não são coincidentes: o ponto de fulgor é INFERIOR ao ponto de combustão. Apenas no ponto de combustão a chama se sustenta continuamente; no fulgor há somente o lampejo.',
 p:'A banca funde dois conceitos vizinhos numa só definição. Se o item afirmar que fulgor e combustão são a mesma coisa, está errado.',
 m:'Fulgor vem antes e não sustenta.'},

{i:'T049',t:'ce',e:'teoria',s:'Combustão',d:3,
 x:'A compreensão dos elementos do tetraedro do fogo tem relevância meramente teórica, sem repercussão direta na escolha do método de extinção a ser empregado pela guarnição.',
 g:0,
 j:'ERRADO. A relação é direta e operacional: cada método de extinção corresponde à supressão de um elemento específico do tetraedro. Sem compreender os elementos, não há como escolher tecnicamente o método nem o agente.',
 p:'Assertivas que desqualificam a utilidade prática de um conceito central costumam ser falsas. O tetraedro é a base de toda a decisão tática.',
 m:'Tetraedro não é teoria — é o mapa da extinção.'},

{i:'T050',t:'ce',e:'teoria',s:'Propagação',d:3,
 x:'Situação hipotética: durante o rescaldo, um bombeiro constata aquecimento anormal em uma viga metálica situada em compartimento contíguo ao foco, ainda que naquele cômodo não tenha havido chamas. Assertiva: o fenômeno é compatível com a transmissão de calor por condução ao longo da estrutura metálica.',
 g:1,
 j:'Correto. A viga metálica, sendo boa condutora e apresentando continuidade física com a área sinistrada, transmite calor por condução até o compartimento vizinho, mesmo sem chamas nele. É risco real de propagação oculta.',
 p:'Item de aplicação avançada: cobra o reconhecimento do mecanismo a partir de indícios de campo (metal, continuidade, ausência de chama local).',
 m:'Estrutura metálica contínua = via de condução.'},

{i:'T051',t:'ce',e:'teoria',s:'Produtos da combustão',d:2,
 x:'A chama, entre os produtos da combustão, caracteriza-se pela emissão de luz e de calor decorrente da queima dos gases em fase gasosa.',
 g:1,
 j:'Correto. A chama é a zona luminosa em que ocorre a queima dos gases e vapores liberados pelo combustível, com emissão simultânea de luz e calor.',
 p:'A banca pode afirmar que "a chama não emite luz" — assertiva evidentemente falsa, usada para testar desatenção em item longo.',
 m:'Chama = gás queimando com luz.'},

{i:'T052',t:'ce',e:'teoria',s:'Tetraedro',d:2,
 x:'Ao se cobrir uma panela em chamas com uma tampa, suprime-se o comburente da reação, o que caracteriza atuação sobre um dos vértices do tetraedro do fogo.',
 g:1,
 j:'Correto. A tampa impede o contato do oxigênio com o combustível — suprime-se o comburente. É abafamento, e o vértice atacado é o do comburente.',
 p:'Item que integra teoria (tetraedro) com método (abafamento). Reconheça o método pela descrição da ação, não pelo nome.',
 m:'Tampou = abafou = tirou o O₂.'},

{i:'T053',t:'ce',e:'teoria',s:'Combustão',d:2,
 x:'A reação de combustão é classificada como endotérmica, porquanto absorve energia do ambiente para se manter.',
 g:0,
 j:'ERRADO. A combustão é EXOTÉRMICA: libera energia na forma de calor e luz. Reações endotérmicas absorvem energia, o que é incompatível com o fenômeno do fogo.',
 p:'Troca de prefixo — EXO por ENDO. Erro pontual e discreto em meio a um enunciado de aparência técnica.',
 m:'ENDO absorve, EXO libera. Fogo libera.'},

{i:'T054',t:'ce',e:'teoria',s:'Propagação',d:3,
 x:'A radiação térmica emitida por um incêndio de grandes proporções pode inflamar materiais combustíveis situados a distância, sem que haja contato entre o foco e esses materiais, fenômeno relevante para a definição de distâncias de segurança e de isolamento da área.',
 g:1,
 j:'Correto. A irradiação transmite energia térmica a distância, podendo levar materiais expostos ao ponto de ignição. Por isso o isolamento da área e as distâncias de segurança consideram a carga radiante do sinistro.',
 p:'Item longo que costura conceito (irradiação) com consequência operacional (isolamento da área). Estilo típico da banca em provas de nível técnico.',
 m:'Irradiação define a distância de segurança.'},

{i:'T055',t:'ce',e:'teoria',s:'Pontos de temperatura',d:2,
 x:'A temperatura de autoignição de um combustível é sempre inferior ao seu ponto de fulgor, dado que dispensa fonte externa de calor.',
 g:0,
 j:'ERRADO. A autoignição é a MAIS ALTA das três temperaturas, e não a mais baixa. Justamente por dispensar fonte externa, exige que o próprio material atinja nível térmico bem superior. Ordem: fulgor < combustão < autoignição.',
 p:'A banca oferece uma justificativa que parece lógica ("dispensa fonte externa, logo é menor"). O raciocínio é invertido: dispensar fonte externa exige MAIS temperatura.',
 m:'Sem ajuda externa, precisa de mais calor.'},

{i:'T056',t:'ce',e:'teoria',s:'Produtos da combustão',d:3,
 x:'Situação hipotética: em incêndio de subsolo, a guarnição relata visibilidade praticamente nula e forte estratificação de fumaça junto ao teto. Assertiva: a estratificação descrita é compatível com o transporte de gases quentes por convecção, e a progressão da guarnição, nessas condições, deve ocorrer em plano baixo.',
 g:1,
 j:'Correto nos dois pontos. Os gases quentes ascendem por convecção e se acumulam junto ao teto, formando camada estratificada; a camada inferior conserva melhor visibilidade e temperatura mais baixa, o que fundamenta a progressão em plano baixo.',
 p:'Item de dupla afirmação: mecanismo físico + conduta operacional. Ambos precisam estar corretos para o item ser CERTO.',
 m:'Calor sobe; o bombeiro progride embaixo.'},

{i:'T057',t:'ce',e:'teoria',s:'Tetraedro',d:1,
 x:'O oxigênio, por ser o elemento que efetivamente se consome durante a queima, é classificado tecnicamente como o combustível da reação.',
 g:0,
 j:'ERRADO. O oxigênio é o COMBURENTE. Ainda que participe e se consuma na reação, sua função técnica é alimentar a combustão do combustível — que é o material que queima.',
 p:'A banca oferece um argumento aparentemente técnico ("efetivamente se consome") para sustentar a troca de conceitos. Função, não consumo, define o papel.',
 m:'O oxigênio faz queimar; não é o que queima.'},

{i:'T058',t:'ce',e:'teoria',s:'Combustão',d:2,
 x:'A concentração de oxigênio no ambiente influencia diretamente o regime da combustão, de modo que sua redução progressiva desloca a queima do regime completo para o incompleto.',
 g:1,
 j:'Correto. A disponibilidade de oxigênio determina o regime: abundância favorece a combustão completa (CO₂, chama azulada); escassez desloca para a incompleta (CO, fuligem, chama amarelada).',
 p:'Esse é o fundamento do risco em ambientes confinados e também do mecanismo do abafamento como método de extinção.',
 m:'Menos O₂ » queima pior » mais CO.'},

/* ------------------------------------------------ MÚLTIPLA ESCOLHA ---- */
{i:'T059',t:'me',e:'teoria',s:'Tetraedro',d:1,
 x:'Os elementos essenciais que compõem o triângulo do fogo são:',
 alt:['Combustível, fumaça e calor',
      'Combustível, comburente e calor',
      'Comburente, reação em cadeia e calor',
      'Combustível, oxigênio e reação em cadeia',
      'Calor, chama e combustível'],
 g:1,
 j:'O triângulo do fogo é formado por combustível, comburente e calor. A reação em cadeia é o quarto elemento, exclusivo do tetraedro.',
 ja:['Fumaça é produto da combustão, não elemento.',
     'CORRETA — os três elementos essenciais.',
     'Inclui a reação em cadeia, que pertence ao tetraedro, e omite o combustível.',
     'Inclui a reação em cadeia (tetraedro) e repete o comburente sob outro nome.',
     'Chama é produto da combustão e falta o comburente.'],
 p:'A banca insere "fumaça" ou "chama" no lugar do comburente. São produtos, jamais elementos.',
 m:'Triângulo: os 3 C — Combustível, Comburente, Calor.'},

{i:'T060',t:'me',e:'teoria',s:'Tetraedro',d:1,
 x:'A diferença entre o triângulo do fogo e o tetraedro do fogo está no acréscimo do elemento:',
 alt:['Oxigênio','Combustível','Reação em cadeia','Calor','Fumaça'],
 g:2,
 j:'O tetraedro acrescenta a REAÇÃO EM CADEIA aos três elementos do triângulo, totalizando quatro. Esse elemento é o alvo da extinção química, realizada pelo pó químico.',
 ja:['O oxigênio (comburente) já integra o triângulo.',
     'O combustível já integra o triângulo.',
     'CORRETA — quarto elemento, exclusivo do tetraedro.',
     'O calor já integra o triângulo.',
     'Fumaça é produto da combustão, não elemento.'],
 p:'Três das cinco alternativas listam elementos que JÁ pertencem ao triângulo. Ler com atenção elimina 60% das opções.',
 m:'TETRA = 4. O que entra é a reação em cadeia.'},

{i:'T061',t:'me',e:'teoria',s:'Tetraedro',d:2,
 x:'No processo de combustão, o comburente é representado, no ar atmosférico, principalmente pelo:',
 alt:['Nitrogênio','Gás carbônico','Oxigênio','Monóxido de carbono','Hidrogênio'],
 g:2,
 j:'O comburente é o oxigênio, presente em cerca de 21% do ar atmosférico, e é ele que alimenta a combustão.',
 ja:['O nitrogênio é o gás mais abundante do ar (~78%), mas é inerte — não alimenta a combustão.',
     'O gás carbônico (CO₂) é produto da combustão e, mais que isso, agente extintor por abafamento.',
     'CORRETA — o oxigênio é o comburente.',
     'O monóxido de carbono é produto tóxico da combustão incompleta.',
     'O hidrogênio é combustível, não comburente.'],
 p:'O nitrogênio é a armadilha: por ser o gás mais abundante do ar, atrai quem lembra do dado sem entender a função.',
 m:'Abundante é o nitrogênio; comburente é o oxigênio.'},

{i:'T062',t:'me',e:'teoria',s:'Propagação',d:1,
 x:'A forma de transmissão de calor que ocorre por ondas, sem necessidade de contato ou de meio material, é a:',
 alt:['Condução','Convecção','Irradiação','Combustão','Saponificação'],
 g:2,
 j:'A irradiação transmite calor por ondas eletromagnéticas (infravermelhas), sem meio material — propaga-se até no vácuo.',
 ja:['A condução exige contato direto e meio material, tipicamente sólido.',
     'A convecção exige fluido em movimento (gases ou líquidos aquecidos).',
     'CORRETA — irradiação dispensa contato e meio.',
     'Combustão é a reação química do fogo, não forma de transmissão de calor.',
     'Saponificação é a reação de extinção do agente de classe K.'],
 p:'As alternativas D e E inserem conceitos verdadeiros do conteúdo, porém de outro assunto. Conceito certo em lugar errado.',
 m:'Sem contato e sem meio = irradiação.'},

{i:'T063',t:'me',e:'teoria',s:'Propagação',d:2,
 x:'A transmissão de calor por meio de correntes de fluidos aquecidos, como a fumaça quente que sobe e incendeia andares superiores, denomina-se:',
 alt:['Condução','Convecção','Irradiação','Reflexão','Difusão'],
 g:1,
 j:'A convecção ocorre por correntes de gases ou líquidos aquecidos que se deslocam. É a principal responsável pela propagação vertical do incêndio em edifícios.',
 ja:['A condução ocorre por contato molécula a molécula em sólidos.',
     'CORRETA — fluido aquecido em movimento.',
     'A irradiação ocorre por ondas, sem meio material.',
     'Reflexão não é forma de transmissão de calor no estudo do fogo.',
     'Difusão não integra as três formas clássicas de transmissão de calor.'],
 p:'As alternativas D e E são termos plausíveis da física geral, inseridos para confundir. As formas são apenas três.',
 m:'Fumaça que sobe = convecção.'},

{i:'T064',t:'me',e:'teoria',s:'Pontos de temperatura',d:2,
 x:'A menor temperatura na qual um combustível libera vapores que se inflamam em contato com uma fonte externa de calor, mas sem manter a chama, é o:',
 alt:['Ponto de combustão','Ponto de fulgor','Ponto de autoignição','Ponto de ebulição','Ponto crítico'],
 g:1,
 j:'O ponto de fulgor (flash point) é a temperatura em que os vapores lampejam com fonte externa, mas não sustentam a chama.',
 ja:['No ponto de combustão a chama se MANTÉM continuamente.',
     'CORRETA — lampeja e apaga.',
     'Na autoignição o material inflama SEM fonte externa.',
     'Ponto de ebulição é a passagem do líquido ao estado gasoso, sem relação com inflamabilidade.',
     'Ponto crítico é conceito termodinâmico alheio ao tema.'],
 p:'A expressão decisiva é "sem manter a chama". Ela separa o fulgor do ponto de combustão.',
 m:'Fulgor lampeja; combustão sustenta.'},

{i:'T065',t:'me',e:'teoria',s:'Combustão',d:2,
 x:'Sobre a combustão incompleta, é correto afirmar que:',
 alt:['Ocorre com excesso de oxigênio e gera apenas CO₂ e água',
      'Ocorre com deficiência de oxigênio e gera monóxido de carbono e fuligem',
      'Não produz gases tóxicos',
      'Produz chama azulada e sem fumaça',
      'É a forma mais segura de queima'],
 g:1,
 j:'A combustão incompleta decorre da falta de oxigênio e gera monóxido de carbono (CO), fuligem e fumaça densa, com chama amarelada.',
 ja:['Descreve a combustão COMPLETA (excesso de O₂, CO₂ e água).',
     'CORRETA — deficiência de O₂, CO e fuligem.',
     'Produz sim: o CO é altamente tóxico.',
     'Chama azulada e sem fumaça caracteriza a combustão COMPLETA.',
     'É a mais PERIGOSA, precisamente por gerar CO.'],
 p:'As alternativas A e D descrevem corretamente a combustão completa — estão erradas apenas porque a pergunta é sobre a incompleta. Leia o comando.',
 m:'Incompleta: pouco O₂, muito CO.'},

{i:'T066',t:'me',e:'teoria',s:'Produtos da combustão',d:1,
 x:'O gás produzido na combustão incompleta, incolor, inodoro e principal responsável por mortes em incêndios por asfixia, é o:',
 alt:['Dióxido de carbono (CO₂)','Monóxido de carbono (CO)','Oxigênio (O₂)','Nitrogênio (N₂)','Ozônio (O₃)'],
 g:1,
 j:'O monóxido de carbono (CO) é incolor, inodoro e altamente tóxico — a principal causa de morte por asfixia em incêndios.',
 ja:['O CO₂ é produto da combustão completa e agente extintor; asfixia por deslocamento de O₂, mas não é o principal matador.',
     'CORRETA — o CO é o grande vilão dos incêndios.',

{i:'T068',t:'me',e:'teoria',s:'Pontos de temperatura',d:3,

{i:'T069',t:'me',e:'teoria',s:'Propagação',d:3,
 x:'Uma edificação situada do outro lado de uma via, sem contato físico com o imóvel sinistrado, começa a apresentar princípio de combustão em sua fachada de madeira em razão da intensa carga térmica do incêndio. A forma de transmissão de calor preponderante nesse caso é a:',

      'Reflexão térmica das superfícies vizinhas'],
 g:2,
 j:'Sem contato físico e a distância, a transmissão preponderante é a IRRADIAÇÃO: as ondas infravermelhas atravessam o espaço aberto e aquecem a fachada até a ignição. É o fundamento das distâncias de segurança.',
 ja:['A condução exigiria continuidade de meio sólido entre foco e alvo, o que a via interrompe.',
     'A convecção teria papel secundário; o vetor dominante a distância, em linha reta, é a radiação térmica.',
     'CORRETA — irradiação, sem contato e sem meio.',
     'Saponificação é reação de extinção do agente de classe K, sem relação com propagação.',
     'Reflexão térmica não integra as três formas clássicas de transmissão de calor.'],
 p:'Item de cenário. A expressão "sem contato físico" é a chave que elimina condução e aponta irradiação.',
 m:'Fogo que pula a rua viaja por irradiação.'},

{i:'T070',t:'me',e:'teoria',s:'Combustão',d:2,

{i:'T071',t:'me',e:'teoria',s:'Tetraedro',d:3,
 x:'Durante um princípio de incêndio alimentado por vazamento de gás liquefeito de petróleo, a guarnição procede ao fechamento do registro do recipiente e as chamas se extinguem. Sob a ótica do tetraedro do fogo, o elemento suprimido foi o:',
 alt:['Comburente, pois o fechamento impediu a entrada de oxigênio',

      'Combustível, pois cessou o fornecimento do gás que alimentava a chama',

     'O fechamento não retira calor — apenas interrompe o fornecimento de combustível.',
     'CORRETA — suprimiu-se o combustível.',
     'A ação foi mecânica sobre o suprimento, não química sobre os radicais livres.',
     'Houve sim supressão deliberada de elemento: o combustível.'],
 p:'A alternativa A é a armadilha: o verbo "fechar" sugere abafamento. Mas o que se fechou foi a fonte de COMBUSTÍVEL.',

{i:'T072',t:'me',e:'teoria',s:'Produtos da combustão',d:3,

      'O agente causador mais provável é o dióxido de carbono, por ser o gás mais tóxico da combustão',
      'Em ambiente de subsolo, a combustão tende a ser completa, reduzindo a formação de gases tóxicos',

     'CORRETA — CO e obrigatoriedade do EPR.',
     'O gás mais tóxico da combustão é o MONÓXIDO (CO), não o dióxido (CO₂).',

     'Pano úmido NÃO substitui o EPR — não filtra CO nem supre oxigênio.'],
 p:'Item integrador, formato preferido da banca em nível técnico: teoria do fogo + produtos + EPR + conduta, tudo em uma só questão.',
 m:'Fumaça densa + inconsciente + sem queimadura = CO.'}

{i:'C010',t:'ce',e:'classes',s:'Classe A',d:3,

 x:'Nos incêndios de classe C, inexiste risco de choque elétrico para o operador, desde que este mantenha distância superior a um metro do equipamento.',
 g:0,
 j:'ERRADO. O risco de choque é inerente à classe C e não se elimina por distância arbitrária, sobretudo porque o jato de agente condutor (água ou espuma) estabelece caminho elétrico contínuo até o operador. A proteção vem da escolha de agente não condutor e, quando possível, do desligamento.',
 p:'A banca inventa um critério numérico falso ("distância superior a um metro") para dar aparência normativa ao erro.',
 m:'O jato de água conduz — distância não protege.'},

/* --------------------------------------------------------- CLASSE D --- */
{i:'C024',t:'ce',e:'classes',s:'Classe D',d:1,
 x:'Incêndios envolvendo metais pirofóricos, como magnésio, sódio, potássio, titânio e lítio, classificam-se como classe D.',
 g:1,
 j:'Correto. A classe D abrange os metais combustíveis ou pirofóricos, que reagem violentamente com água e exigem pó especial próprio.',
 p:'A banca troca a classe D pela K. Metais são D; óleo de cozinha é K. São classes inconfundíveis, mas frequentemente confundidas.',
 m:'D = metais. Pó especial exclusivo.'},

{i:'C025',t:'ce',e:'classes',s:'Classe D',d:2,
 x:'Os metais pirofóricos reagem violentamente em contato com a água, razão pela qual esse agente é vedado nos incêndios de classe D.',
 g:1,
 j:'Correto. A reação de metais como sódio e potássio com a água libera hidrogênio e grande quantidade de calor, podendo resultar em explosão. Por isso a classe D exige pó especial e proíbe a água.',
 p:'A banca pode afirmar que a água "apenas é ineficaz" em D. É muito mais que ineficaz: é perigosa e pode provocar explosão.',
 m:'Água em metal pirofórico = explosão.'},

{i:'C026',t:'ce',e:'classes',s:'Classe D',d:2,
 x:'O dióxido de carbono constitui agente extintor adequado aos incêndios de classe D, por atuar mediante abafamento sobre os metais em combustão.',
 g:0,
 j:'ERRADO. O CO₂ NÃO serve para classe D. Metais pirofóricos em combustão podem decompor o CO₂ e continuar queimando, e o agente não forma a crosta isolante necessária. Somente o pó especial de classe D é adequado.',
 p:'Pegadinha expressamente listada na apostila: "CO₂ serve para classe D" é afirmação clássica e ERRADA.',
 m:'CO₂ » B e C. Nunca D.'},

{i:'C027',t:'ce',e:'classes',s:'Classe D',d:2,
 x:'O pó especial para classe D é agente de emprego exclusivo em incêndios de metais pirofóricos, não se prestando ao combate das demais classes.',
 g:1,
 j:'Correto. O pó de classe D é formulado especificamente para metais, formando crosta que isola o metal do oxigênio. Não é agente polivalente e não substitui pó ABC, CO₂ ou espuma nas demais classes.',
 p:'A banca inverte: afirma que o pó D "também cobre a classe K" ou que é "polivalente". Não é — é exclusivo.',
 m:'Pó D só serve para D.'},

{i:'C028',t:'ce',e:'classes',s:'Classe D',d:3,
 x:'Situação hipotética: em uma oficina metalúrgica, aparas de magnésio entram em combustão. Um bombeiro, por analogia com incêndios de classe A, aplica jato pleno de água sobre o material. Assertiva: a conduta é tecnicamente correta, pois o resfriamento intenso interromperá a queima do metal.',
 g:0,
 j:'ERRADO e potencialmente fatal. O magnésio é metal pirofórico (classe D) e reage violentamente com a água, podendo provocar projeções incandescentes e explosão. A conduta correta é o emprego de pó especial de classe D, aplicado suavemente.',
 p:'A banca constrói a armadilha justamente pela "analogia" com a classe A — analogia falsa e perigosa. Classe define agente; não há transposição.',
 m:'Magnésio + água = explosão. Nunca.'},

/* --------------------------------------------------------- CLASSE K --- */
{i:'C029',t:'ce',e:'classes',s:'Classe K',d:1,
 x:'A classe K refere-se aos incêndios em óleos e gorduras utilizados em cozinhas, como os presentes em fritadeiras e frigideiras.',
 g:1,
 j:'Correto. A classe K (de kitchen, cozinha) abrange óleos e gorduras vegetais e animais de cocção, caracterizados por altíssima tendência à reignição.',
 p:'A banca troca K por B (por serem ambos líquidos) ou por D. Óleo de cozinha aquecido tem classe própria: K.',
 m:'K = Kitchen. Cozinha, óleo quente.'},

{i:'C030',t:'ce',e:'classes',s:'Classe K',d:2,
 x:'O agente extintor específico da classe K atua por saponificação, formando sobre o óleo uma camada que abafa e resfria, o que reduz o risco de reignição.',
 g:1,
 j:'Correto. A saponificação converte a superfície do óleo em uma camada semelhante a sabão, que sela o combustível (abafamento) e contribui para baixar a temperatura (resfriamento) — combate direto à reignição típica da classe.',
 p:'Saponificação é palavra-chave exclusiva da classe K. Se aparecer em outro contexto, desconfie.',
 m:'K » saponificação » vira "sabão" e sela.'},

{i:'C031',t:'ce',e:'classes',s:'Classe K',d:2,
 x:'A aplicação de água em incêndio de óleo de cozinha aquecido é conduta segura, desde que realizada sob a forma de neblina.',
 g:0,
 j:'ERRADO. Água em óleo quente — seja jato pleno, seja neblina — provoca vaporização instantânea e projeção violenta do óleo em chamas (fenômeno de projeção/boilover), com risco grave de queimaduras e ampliação do sinistro.',
 p:'A ressalva "sob a forma de neblina" é a armadilha: sugere que a modalidade do jato tornaria a conduta segura. Não torna.',
 m:'Água em óleo quente: nunca, de forma alguma.'},

{i:'C032',t:'ce',e:'classes',s:'Classe K',d:2,
 x:'As classes D e K são equivalentes, uma vez que ambas exigem agentes extintores especiais e vedam o emprego de água.',
 g:0,
 j:'ERRADO. Embora ambas exijam agentes especiais e vedem a água, NÃO são equivalentes: a classe D é de metais pirofóricos e exige pó especial; a classe K é de óleos e gorduras de cocção e exige agente saponificante. Os agentes não são intercambiáveis.',
 p:'A banca usa uma semelhança verdadeira (agente especial + veda água) para sustentar uma equivalência falsa. Semelhança não é identidade.',
 m:'D é metal, K é óleo. Agentes diferentes.'},

{i:'C033',t:'ce',e:'classes',s:'Classe K',d:3,
 x:'A elevada tendência à reignição nos incêndios de classe K decorre da grande massa térmica do óleo aquecido, que permanece acima da temperatura de ignição mesmo após a supressão momentânea das chamas.',
 g:1,
 j:'Correto. O óleo retém enorme quantidade de calor. Extinta a chama por agente que apenas abafa, o óleo continua acima da temperatura de ignição e reacende assim que o oxigênio retorna — daí a necessidade de agente que abafe E resfrie, como o saponificante de classe K.',
 p:'Item que explica a CAUSA técnica da exigência de agente próprio. A banca valoriza o candidato que entende o porquê.',
 m:'Óleo guarda calor — por isso reacende.'},

{i:'C034',t:'ce',e:'classes',s:'Classe K',d:2,
 x:'O pó especial destinado à classe D constitui alternativa tecnicamente adequada para o combate a incêndios de classe K, dada a similaridade entre os agentes especiais.',
 g:0,
 j:'ERRADO. O pó D é exclusivo de metais pirofóricos e não provoca saponificação. Em óleo de cozinha, não impede a reignição. O agente correto da classe K é o saponificante específico.',
 p:'A banca cria uma "similaridade entre agentes especiais" que não existe funcionalmente. Cada agente especial tem mecanismo próprio.',
 m:'Pó D não saponifica. Não serve em K.'},

/* ------------------------------------------ INTEGRAÇÃO ENTRE CLASSES -- */
{i:'C035',t:'ce',e:'classes',s:'Classificação geral',d:2,
 x:'A borracha e o plástico, por serem materiais industrializados de origem sintética, classificam-se como incêndio de classe B.',
 g:0,
 j:'ERRADO. Borracha e plástico são SÓLIDOS combustíveis comuns e integram a classe A. A origem sintética ou industrializada é irrelevante para a classificação — o que importa é o estado físico e o comportamento na queima.',
 p:'A banca usa a origem industrial do material como falso critério de classificação. O critério é o material combustível e seu estado.',
 m:'Sólido comum é A, mesmo sendo plástico.'},

{i:'C036',t:'ce',e:'classes',s:'Classificação geral',d:3,
 x:'Situação hipotética: em um data center, ocorre princípio de incêndio em servidores em pleno funcionamento. A guarnição opta pelo emprego de pó químico ABC. Assertiva: a escolha é tecnicamente admissível quanto à classe, mas inadequada do ponto de vista da preservação dos equipamentos, sendo o dióxido de carbono a opção mais indicada.',
 g:1,
 j:'Correto nos dois pontos. O pó ABC cobre a classe C e não conduz corrente — logo, é admissível quanto à classe. Contudo, deixa resíduo corrosivo que inutiliza eletrônicos. O CO₂, que não deixa resíduo, é a escolha mais indicada em data centers.',
 p:'Item de duas afirmações encadeadas — típico da CEBRASPE. Ambas devem estar corretas. Aqui está o critério fino: admissibilidade técnica × adequação prática.',
 m:'Eletrônico sensível: CO₂, não pó.'},

{i:'C037',t:'ce',e:'classes',s:'Classe A',d:2,
 x:'O agente extintor à base de pó químico ABC é adequado à classe A porque sua base de fosfato monoamônico forma crosta sobre o material em brasa, dificultando a reignição.',
 g:1,
 j:'Correto. É precisamente o fosfato monoamônico que confere ao pó ABC a cobertura da classe A: ele funde e forma crosta aderente sobre o sólido em brasa, selando o material. O pó BC, de composição diversa, não produz esse efeito.',
 p:'Aqui está a razão técnica da diferença entre ABC e BC. Saber o mecanismo permite responder mesmo variações inéditas do item.',
 m:'ABC forma crosta na brasa; BC não.'},

{i:'C038',t:'ce',e:'classes',s:'Classe B',d:2,
 x:'O gás liquefeito de petróleo, por se apresentar no estado gasoso, não se enquadra em nenhuma das cinco classes de incêndio previstas na normatização brasileira.',
 g:0,
 j:'ERRADO. O GLP é gás inflamável e integra a CLASSE B, que abrange líquidos E gases inflamáveis. Não há lacuna classificatória.',
 p:'A banca sugere uma lacuna normativa inexistente. A classe B contempla expressamente os gases.',
 m:'Gás inflamável é B.'},

{i:'C039',t:'ce',e:'classes',s:'Classe C',d:3,
 x:'Situação hipotética: durante o combate a incêndio em painel elétrico, a guarnição consegue desligar o disjuntor geral da edificação. Assertiva: a partir desse momento, torna-se admissível o emprego de água sobre o material remanescente em combustão, observadas as demais cautelas operacionais.',
 g:1,
 j:'Correto. Desligada a energia, cessa a classe C e o fogo residual passa a ser tratado pelo material que queima — em regra, classe A (isolantes, plásticos, componentes sólidos), para o qual a água é indicada. A ressalva final ("observadas as demais cautelas") mantém o item tecnicamente preciso.',
 p:'Este é o desdobramento prático do conceito "C desligado vira A". A banca cobra tanto a regra quanto sua consequência operacional.',
 m:'Desligou » deixou de ser C » água liberada.'},

{i:'C040',t:'ce',e:'classes',s:'Classificação geral',d:2,
 x:'A definição da classe de incêndio decorre da intensidade das chamas e da extensão da área atingida pelo sinistro.',
 g:0,
 j:'ERRADO. A classe decorre exclusivamente do MATERIAL COMBUSTÍVEL envolvido (ou, na classe C, da condição de energização). Intensidade e extensão dizem respeito ao porte do incêndio, não à sua classe.',
 p:'A banca substitui o critério correto (material) por critérios quantitativos plausíveis (intensidade, extensão). Não confunda porte com classe.',
 m:'Classe é qualidade do material, não tamanho do fogo.'},

{i:'C041',t:'ce',e:'classes',s:'Classe D',d:2,
 x:'A aplicação do pó especial de classe D deve ser feita de forma suave, evitando-se jatos violentos que possam dispersar o metal em combustão.',
 g:1,
 j:'Correto. Jato violento espalha partículas metálicas incandescentes, ampliando a área do sinistro. A aplicação do pó D é feita de modo suave, cobrindo o metal e formando crosta isolante.',
 p:'Detalhe operacional pouco decorado, mas cobrado em provas de nível técnico. Pó D: aplicação suave.',
 m:'Em metal, cobre devagar — não sopra.'},

{i:'C042',t:'ce',e:'classes',s:'Classe K',d:2,
 x:'Os incêndios de classe K, por envolverem substâncias líquidas, devem ser combatidos com os mesmos agentes indicados para a classe B, notadamente a espuma mecânica.',
 g:0,
 j:'ERRADO. Embora o óleo seja líquido, a classe K tem agente próprio (saponificante), justamente porque os agentes de classe B não impedem a reignição em óleo aquecido. A espuma mecânica não é o agente indicado para a classe K.',
 p:'A banca usa uma premissa verdadeira (óleo é líquido) para deduzir conclusão falsa (logo, trata-se como B). A classe K existe exatamente porque o tratamento é distinto.',
 m:'K não é B. Tem agente próprio.'},

{i:'C043',t:'ce',e:'classes',s:'Classe A',d:1,
 x:'A madeira, o papel e o tecido são exemplos de combustíveis sólidos comuns que, ao queimarem, deixam resíduos na forma de brasas e cinzas.',
 g:1,
 j:'Correto. São exemplos típicos da classe A, cuja marca é a queima em profundidade com formação de brasa e cinzas.',
 p:'Item direto e verdadeiro. A banca alterna itens fáceis e difíceis no mesmo bloco para induzir insegurança.',
 m:'A deixa cinzas.'},

{i:'C044',t:'ce',e:'classes',s:'Classe C',d:2,
 x:'Os pós químicos BC e ABC são ambos admissíveis nos incêndios de classe C, por não conduzirem corrente elétrica.',
 g:1,
 j:'Correto. Tanto o pó BC quanto o ABC cobrem a classe C e não conduzem eletricidade. A diferença entre eles está na cobertura da classe A, presente apenas no ABC.',
 p:'A banca costuma negar a cobertura do BC em C. O BC cobre B e C — a letra que lhe falta é o A.',
 m:'BC = B e C. ABC = A, B e C. Ambos cobrem C.'},

{i:'C045',t:'ce',e:'classes',s:'Classificação geral',d:3,
 x:'Situação hipotética: em um posto de combustíveis, ocorre incêndio simultâneo em derramamento de gasolina no piso e em um transformador energizado da unidade. Assertiva: o sinistro apresenta, concomitantemente, incêndios das classes B e C, o que impõe à guarnição a seleção de agente compatível com ambas as classes ou o emprego sequencial de agentes distintos.',
 g:1,
 j:'Correto. A gasolina configura classe B e o transformador energizado, classe C. Agentes que cobrem ambas — CO₂, pó BC ou pó ABC — resolvem tecnicamente a situação. Água e espuma estão vedadas pela presença da classe C.',
 p:'Item que exige a interseção entre classes: qual agente cobre B e C simultaneamente. Domine a tabela classe × agente e a resposta é imediata.',
 m:'B e C juntos: CO₂ ou pó.'},

{i:'C046',t:'ce',e:'classes',s:'Classe B',d:2,
 x:'Nos incêndios de classe B, o combate por resfriamento com água é o método preferencial, dada a elevada capacidade de absorção térmica desse agente.',
 g:0,
 j:'ERRADO. Na classe B o método preferencial é o ABAFAMENTO (espuma, CO₂, pó). A água é contraindicada porque espalha o líquido inflamável, ampliando a superfície em chamas — a capacidade térmica do agente não compensa esse efeito.',
 p:'A banca oferece um atributo verdadeiro da água (alta absorção térmica) para justificar um emprego incorreto. Atributo certo, indicação errada.',
 m:'B pede abafamento, não resfriamento.'},

{i:'C047',t:'ce',e:'classes',s:'Classe D',d:2,
 x:'Os metais pirofóricos, tais como o sódio e o potássio, podem entrar em combustão em contato com a umidade ambiente, o que reforça a vedação absoluta do emprego de água nesses sinistros.',
 g:1,
 j:'Correto. Metais alcalinos como sódio e potássio reagem com a umidade e com a água, liberando hidrogênio e calor — o que pode iniciar ou agravar a combustão. Daí a vedação absoluta da água na classe D.',
 p:'Item que aprofunda o mecanismo. Saber que a reação libera hidrogênio explica por que o risco é de explosão, e não apenas de ineficácia.',
 m:'Sódio e potássio odeiam água.'},

{i:'C048',t:'ce',e:'classes',s:'Classe K',d:2,
 x:'Nos incêndios de classe K, recomenda-se, sempre que possível, o desligamento da fonte de calor que aquece o óleo, medida que contribui para a eficácia da extinção e para a prevenção da reignição.',
 g:1,
 j:'Correto. Enquanto a fonte de calor permanecer ativa, o óleo continua sendo reaquecido acima da temperatura de ignição, favorecendo a reignição. O desligamento é medida complementar essencial ao agente saponificante.',
 p:'Item de conduta, não apenas de classificação. A CEBRASPE combina os dois planos com frequência.',
 m:'Antes de tudo: desliga o fogão.'},

/* ------------------------------------------------ MÚLTIPLA ESCOLHA ---- */
{i:'C049',t:'me',e:'classes',s:'Classe A',d:1,
 x:'Os incêndios em materiais sólidos combustíveis comuns, como madeira, papel e tecido, que deixam resíduos (brasas e cinzas), pertencem à classe:',
 alt:['A','B','C','D','K'],
 g:0,
 j:'A classe A abrange os sólidos comuns, que queimam em superfície e em profundidade e deixam resíduo. É a classe do resfriamento com água.',
 ja:['CORRETA — sólidos comuns com formação de brasa.',
     'Classe B é de líquidos e gases inflamáveis.',
     'Classe C é de equipamentos energizados.',
     'Classe D é de metais pirofóricos.',
     'Classe K é de óleos e gorduras de cozinha.'],
 p:'O detalhe "deixam resíduos" é o marcador da classe A — a classe B não deixa resíduo.',
 m:'A = Alvenaria, sólidos, brasa.'},

{i:'C050',t:'me',e:'classes',s:'Classe B',d:1,
 x:'Um incêndio em gasolina, álcool e outros líquidos inflamáveis é classificado como classe:',
 alt:['A','B','C','D','K'],
 g:1,
 j:'Líquidos e gases inflamáveis (gasolina, álcool, GLP) são classe B. Queimam apenas na superfície e não deixam resíduo.',
 ja:['Classe A é de sólidos comuns.',
     'CORRETA — líquidos e gases inflamáveis.',
     'Classe C é de equipamentos energizados.',
     'Classe D é de metais pirofóricos.',
     'Classe K é de óleos de cocção — outra categoria de líquido, com agente próprio.'],
 p:'Atenção ao álcool: por ser de uso doméstico, é frequentemente confundido com a classe A. É líquido, logo é B.',
 m:'Líquido ou gás inflamável = B.'},

{i:'C051',t:'me',e:'classes',s:'Classe C',d:2,
 x:'Sobre a classe C de incêndio, assinale a alternativa correta:',
 alt:['Refere-se a metais pirofóricos',
      'Refere-se a óleos e gorduras de cozinha',
      'Refere-se a equipamentos elétricos energizados',
      'Deve ser combatida preferencialmente com água',
      'Não existe risco de choque elétrico'],
 g:2,
 j:'A classe C é a de equipamentos elétricos energizados. Exige agente não condutor (CO₂ ou pó químico). A água é proibida pelo risco de choque. Desligada a energia, trata-se pelo material que queima.',
 ja:['Metais pirofóricos são classe D.',
     'Óleos e gorduras de cozinha são classe K.',
     'CORRETA — equipamentos energizados.',
     'A água é PROIBIDA na classe C, por conduzir corrente.',
     'O risco de choque é justamente o traço definidor da classe C.'],
 p:'As alternativas A e B trocam a classe C por D e K — as três são frequentemente embaralhadas pela banca.',
 m:'C = Corrente elétrica.'},

{i:'C052',t:'me',e:'classes',s:'Classe D',d:1,
 x:'Incêndios envolvendo metais pirofóricos, como magnésio, sódio e titânio, pertencem à classe:',
 alt:['A','B','C','D','K'],
 g:3,
 j:'Metais combustíveis e pirofóricos são classe D, reagem violentamente com água e exigem pó especial de aplicação suave.',
 ja:['Classe A é de sólidos combustíveis comuns, não metais pirofóricos.',
     'Classe B é de líquidos e gases inflamáveis.',
     'Classe C é de equipamentos energizados.',
     'CORRETA — metais pirofóricos.',
     'Classe K é de óleos e gorduras de cozinha.'],
 p:'Não confundir com a classe K: ambas exigem agente especial, mas D é metal e K é óleo.',
 m:'D = metais. Pó especial exclusivo.'},

{i:'C053',t:'me',e:'classes',s:'Classe K',d:1,
 x:'A classe de incêndio específica para óleos e gorduras utilizados em cozinhas, como em fritadeiras, é a classe:',
 alt:['A','B','C','D','K'],
 g:4,
 j:'A classe K (do inglês kitchen) é a de óleos e gorduras de cozinha. Exige agente que provoca saponificação, capaz de abafar e resfriar, impedindo a reignição.',
 ja:['Classe A é de sólidos comuns.',
     'Classe B é de líquidos inflamáveis em geral, mas o óleo de cocção tem classe própria.',
     'Classe C é de equipamentos energizados.',
     'Classe D é de metais pirofóricos.',
     'CORRETA — óleos e gorduras de cozinha.'],
 p:'A alternativa B é a armadilha: o óleo é líquido, o que sugere classe B. Mas o óleo de cocção aquecido tem classe própria pela alta reignição.',
 m:'K = Kitchen.'},

{i:'C054',t:'me',e:'classes',s:'Classe C',d:3,
 x:'Considere: (I) o incêndio é de classe C, em um computador energizado; (II) a guarnição desliga a energia elétrica. Após o desligamento, o incêndio residual no material passa a ser tratado, em regra, como classe:',
 alt:['Permanece classe C','Classe A','Classe D','Classe K','Classe B'],
 g:1,
 j:'Desligada a energia, cessa a condição de "energizado" (classe C) e o fogo passa a ser tratado conforme o material que queima — em geral classe A (plásticos, isolantes e componentes sólidos). Ponto frequente de prova.',
 ja:['A classe C é uma CONDIÇÃO de energização; cessada esta, cessa a classe.',
     'CORRETA — em regra passa a ser tratado como classe A.',
     'Classe D pressupõe metais pirofóricos, ausentes no caso.',
     'Classe K pressupõe óleos de cocção, ausentes no caso.',
     'Classe B pressupõe líquidos ou gases inflamáveis, ausentes no caso.'],
 p:'A alternativa A é escolhida por quem memoriza "computador = classe C" sem entender que a classe C depende da energização.',
 m:'C desligado vira A.'},

{i:'C055',t:'me',e:'classes',s:'Classificação geral',d:2,
 x:'Assinale a alternativa que apresenta corretamente a correspondência entre classe de incêndio e material combustível:',
 alt:['Classe A — líquidos inflamáveis; Classe B — sólidos comuns',
      'Classe A — sólidos comuns; Classe B — líquidos e gases inflamáveis; Classe C — equipamentos energizados',
      'Classe C — metais pirofóricos; Classe D — equipamentos energizados',
      'Classe D — óleos de cozinha; Classe K — metais pirofóricos',
      'Classe B — equipamentos energizados; Classe C — líquidos inflamáveis'],
 g:1,
